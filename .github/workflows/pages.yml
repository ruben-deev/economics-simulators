# Публикация игр на GitHub Pages.
#
# На сайт выкладываются:
#   /                                — витрина со списком игр
#   /games/<игра>/                   — игра (модульная версия, работает в браузере)
#   /games/<игра>/dist/<имя>.html    — та же игра одним файлом, для раздачи офлайн
#   /docs/                           — разбор моделей и сценарии занятий
#
# Перед публикацией прогоняются тесты и пересобираются одиночные файлы,
# поэтому на сайт физически не может попасть версия, не прошедшая проверки.
#
# ВАЖНО: один раз нужно включить Pages вручную —
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Сам workflow этого сделать не может: у GITHUB_TOKEN нет прав создавать
# Pages-сайт, и без ручного включения шаг configure-pages падает с Not Found.

name: Deploy games to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/delivery-simulator-prototype-qy5zst
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; новый пуш отменяет незавершённый.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Тесты моделей и перевода
        run: npm test

      - name: Сборка одного файла для каждой игры
        run: npm run build

      - name: Проверить, что собранные файлы в репозитории не устарели
        run: |
          # Дата сборки меняется каждый день — её отличие не «устаревший dist»
          if ! git diff --quiet -I 'app-build-date' -- 'games/*/dist/*.html'; then
            echo "Собранные файлы отличаются от текущих исходников."
            echo "Запустите 'npm run build' и закоммитьте результат."
            git diff --stat -- 'games/*/dist/*.html'
            exit 1
          fi

      - name: Собрать содержимое сайта
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r shared _site/
          cp -r docs _site/
          cp -r games _site/
          rm -rf _site/shared/tools _site/games/*/tests
          find _site -name 'build.manifest.js' -delete
          echo "--- содержимое сайта ---"
          find _site -maxdepth 3 -type d | sort

      # Требует, чтобы Pages были включены в настройках репозитория
      # с источником «GitHub Actions» (см. комментарий вверху файла).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
