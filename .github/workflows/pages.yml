# Публикация игр на GitHub Pages.
#
# Сайт собирается из ДВУХ веток и живёт по двум адресам:
#   /       — прежняя версия целиком (эта ветка, claude/delivery-simulator-prototype-qy5zst):
#             витрина с тремя играми, их проверенные сборки. Старые ссылки не меняются.
#   /next/  — новая версия целиком (ветка claude/novograd-ecosystem-game-bnenng):
#             витрина с НОВОГРАДОМ и обновлённые игры.
# Когда новая версия принята, её вливают в эту ветку — тогда она становится
# корнем, а /next/ продолжает показывать вершину новой ветки.
#
# Запуск — только пушем в ветку сайта или кнопкой «Run workflow» (окружение
# github-pages разрешает деплой только с ветки сайта; запуск из других веток
# падает на публикации до первого шага). После пуша в ветку новой версии
# обновите /next/ перезапуском workflow: Actions → Deploy games to GitHub
# Pages → Run workflow (ветка по умолчанию — ветка сайта).
#
# Внутри каждой версии раскладка прежняя:
#   витрина в корне, /games/<игра>/ — модульная версия,
#   /games/<игра>/dist/<имя>.html — один файл для раздачи офлайн, /docs/ — разборы.
#
# Перед публикацией прогоняются тесты обеих версий, поэтому на сайт физически
# не может попасть версия, не прошедшая проверки.
#
# ВАЖНО: один раз нужно включить Pages вручную —
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Сам workflow этого сделать не может: у GITHUB_TOKEN нет прав создавать
# Pages-сайт, и без ручного включения шаг configure-pages падает с Not Found.

name: Deploy games to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/delivery-simulator-prototype-qy5zst
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; новый пуш отменяет незавершённый.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      # Корень сайта всегда берётся из ветки прежней версии — какая бы ветка
      # ни запустила workflow. Поэтому пуш в новую ветку обновляет только /next/.
      - uses: actions/checkout@v4
        with:
          ref: claude/delivery-simulator-prototype-qy5zst

      - uses: actions/checkout@v4
        with:
          ref: claude/novograd-ecosystem-game-bnenng
          path: _next

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Тесты прежней версии
        run: npm test

      - name: Тесты новой версии
        run: npm test
        working-directory: _next

      # Тесты пересобирают одиночные файлы — дата сборки в них меняется каждый
      # день, поэтому её отличие не «устаревший dist». На сайт идут файлы из
      # репозитория: рабочее дерево возвращается к закоммиченному состоянию.
      - name: Проверить, что собранные файлы новой версии не устарели
        run: |
          if ! git diff --quiet -I 'app-build-date' -- 'games/*/dist/*.html'; then
            echo "Собранные файлы отличаются от текущих исходников."
            echo "Запустите 'npm run build' и закоммитьте результат."
            git diff --stat -- 'games/*/dist/*.html'
            exit 1
          fi
          git checkout -- .
        working-directory: _next

      - name: Вернуть собранные файлы прежней версии из репозитория
        run: git checkout -- .

      - name: Собрать содержимое сайта
        run: |
          mkdir -p _site/next
          cp index.html manifest.webmanifest sw.js social-card.png _site/
          cp -r shared docs games icons press _site/
          cp _next/index.html _next/manifest.webmanifest _next/sw.js _next/social-card.png _site/next/
          cp -r _next/shared _next/docs _next/games _next/icons _site/next/
          rm -rf _site/shared/tools _site/games/*/tests _site/games/*/tools
          rm -rf _site/next/shared/tools _site/next/games/*/tests _site/next/games/*/tools
          find _site -name 'build.manifest.js' -delete
          echo "--- содержимое сайта ---"
          find _site -maxdepth 4 -type d | sort

      # Требует, чтобы Pages были включены в настройках репозитория
      # с источником «GitHub Actions» (см. комментарий вверху файла).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
