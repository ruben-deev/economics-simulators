// Выбирает событие недели (или null). Вероятность события ~35%.
function rollEvent(rng, week, flags = {}) {
  if (week < 2) return null;
  if (rng() > 0.35) return null;
  const pool = EVENTS.filter((e) => week >= (e.minWeek ?? 0));
  if (flags.regulationRisk) pool.push(REGULATION_FINE);
  const picked = weightedPick(rng, pool);
  return picked ? { ...picked } : null;
}

// Собирает модификаторы недели из события и выбранной игроком опции
function applyEvent(mods, event, optionIndex) {
  if (!event) return mods;
  const effects = { ...(event.effects ?? {}) };
  if (event.options && event.options[optionIndex]) {
    Object.assign(effects, event.options[optionIndex].effects);
  }
  for (const [key, value] of Object.entries(effects)) {
    if (key === 'demandMult' || key === 'capacityMult' || key === 'courierSupplyMult') {
      mods[key] *= value;
    } else if (key === 'notes') {
      continue;
    } else if (typeof value === 'number' && key in mods) {
      mods[key] += value;
    } else {
      mods[key] = value;
    }
  }
  mods.notes.push(event.id);
  return mods;
}


// ===== src/model/engine.js =========================================
// ============================================================================
// Ядро симуляции. Чистые функции: step(state) -> {state, report}.
// Никакой работы с DOM — модуль можно гонять в тестах и в ноутбуке.
//
// Смысловая структура модели (её же объясняем игроку):
//
//   маркетинг -> узнаваемость -> пробные заказы -> база клиентов (запас)
//                                                        |
//   цена, скорость, ассортимент  ------------------> частота заказов
//                                                        |
//                                             спрос = база x частота
//                                                        |
//                                   пропускная способность курьеров (ограничение)
//                                                        |
//                                   выполненные заказы -> выручка -> P&L -> касса
//
// Ключевая обратная связь: не хватает курьеров -> растёт время доставки ->
// падает удовлетворённость -> растёт отток клиентов -> спрос падает.
// ============================================================================


const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const safe = (x, fallback = 0) => (Number.isFinite(x) ? x : fallback);

function districtById(id) {
  return DISTRICTS.find((d) => d.id === id);
}

// Средний чек района зависит от уровня дохода
function aovOf(district) {
  return CONFIG.aovBase * Math.pow(district.income, CONFIG.aovIncomeExponent);
}

// Доступный вам рынок района: часть жителей прочно сидит у конкурента.
// Это потолок охвата — сколько ни трать на маркетинг, всех не заберёшь.
function reachableOf(district) {
  return district.potential * (1 - district.competitor * CONFIG.competitorLock);
}

// ----------------------------------------------------------------------------
// Начальное состояние
// ----------------------------------------------------------------------------
function createInitialState(seed = 'novograd') {
  const rng = createRng(seed);
  // Погода первой недели и публичный прогноз на вторую
  const weather = rollWeather(rng, 1);
  const weatherNext = rollWeather(rng, 2);
  return {
    seed,
    rngState: rng.state(),
    weather,
    weatherNext,
    week: 0,
    cash: CONFIG.startCash,
    equity: 1,               // доля основателей, 1.0 = 100%
    raisedTotal: 0,
    techStock: 0,
    rndStock: 0,             // накопленные вложения в data science
    dataStock: 0,            // накопленный объём заказов = обучающая выборка
    installed: {},           // внедрённые алгоритмы
    couriers: 0,
    courierMorale: 1,        // отношение заработка курьера к рынку на прошлой неделе
    decisions: { ...DEFAULT_DECISIONS, districts: [] },
    districts: Object.fromEntries(
      DISTRICTS.map((d) => [d.id, {
        id: d.id,
        active: false,
        launchedWeek: null,
        awareness: 0,
        customers: 0,
        restaurants: 0,
        deliveryTime: d.baseTime,
        satisfaction: 1,
      }])
    ),
    flags: { commissionDelta: 0, valuationBonus: 0, regulationRisk: false },
    pendingEvent: null,
    pendingChoice: null,
    history: [],
    lastSnapshot: null,      // состояние до последнего хода — для «что было бы, если»
    over: null,   // 'bankrupt' | 'finished'
  };
}

// ----------------------------------------------------------------------------
// Производные показатели
// ----------------------------------------------------------------------------

function techLevel(state) {
  return state.techStock / (state.techStock + CONFIG.techSaturation);
}

// Данные и команда по отдельности бесполезны — качество алгоритмов растёт
// только когда есть и то и другое. Отсюда среднее геометрическое.
function dataLevel(state) {
  return (state.dataStock ?? 0) / ((state.dataStock ?? 0) + CONFIG.dataSaturation);
}
function rndLevel(state) {
  return (state.rndStock ?? 0) / ((state.rndStock ?? 0) + CONFIG.rndSaturation);
}
function algoQuality(state) {
  return Math.sqrt(dataLevel(state) * rndLevel(state));
}

// Доступен ли алгоритм: либо уже внедрён, либо качество доросло до порога
function algoAvailable(state, key) {
  const def = ALGORITHMS.find((a) => a.key === key);
  if (!def) return false;
  return Boolean(state.installed?.[key]) || algoQuality(state) >= def.unlock;
}

// Заказов в неделю на одного курьера с учётом плеча доставки, технологий и мотивации.
// Недоплаченный курьер не увольняется мгновенно — он просто работает вполсилы
// и берёт заказы у конкурента (мультиаппинг). Мораль берётся с лагом в неделю.
function ordersPerCourier(state, avgDistanceKm, capacityMult = 1) {
  const t = techLevel(state);
  const distanceFactor = Math.pow(CONFIG.courierRefDistanceKm / Math.max(0.5, avgDistanceKm), 0.45);
  const morale = clamp(0.85 + 0.15 * (state.courierMorale ?? 1), 0.75, 1.08);
  return CONFIG.courierBaseOrders * (1 + 0.35 * t) * distanceFactor * morale * capacityMult;
}

// Сезонность: годовая волна + новогодний всплеск
function seasonality(week) {
  const wave = 1 + 0.10 * Math.sin((2 * Math.PI * (week - 6)) / 52);
  const newYear = week % 52 >= 50 || week % 52 <= 1 ? 1.15 : 1;
  return wave * newYear;
}

// Эффективная комиссия с учётом сделок с сетями
function effectiveCommission(state, decisions) {
  return clamp(decisions.commissionRate + state.flags.commissionDelta, 0.02, 0.45);
}

// ----------------------------------------------------------------------------
// Главный шаг симуляции
// ----------------------------------------------------------------------------
function step(prevState, input = {}) {
  const state = structuredClone(prevState);
  if (state.over) return { state, report: state.history[state.history.length - 1] ?? null };

  // Компактный снимок «как было до хода» — по нему интерфейс считает контрфактические
  // сценарии «сколько бы мы заработали без этого алгоритма».
  const snapshot = structuredClone({
    ...prevState,
    history: prevState.history.slice(-2),
    lastSnapshot: null,
  });

  const decisions = { ...state.decisions, ...(input.decisions ?? {}) };
  state.decisions = decisions;

  const rng = createRng(state.seed);
  rng.restore(state.rngState);

  const week = state.week + 1;

  // --- 1. Событие недели (было объявлено в конце прошлой недели) ---
  const mods = neutralModifiers();
  const event = state.pendingEvent;
  const choice = input.eventChoice ?? state.pendingChoice ?? 0;
  applyEvent(mods, event, choice);
  if (mods.commissionOverrideDelta) state.flags.commissionDelta += mods.commissionOverrideDelta;
  if (mods.valuationBonus) state.flags.valuationBonus += mods.valuationBonus;
  if (mods.regulationRisk) state.flags.regulationRisk = true;

  // --- 2. Запуск и закрытие районов ---
  const wanted = new Set(decisions.districts ?? []);
  let launchCost = 0;
  const launched = [];
  const closed = [];
  for (const def of DISTRICTS) {
    const ds = state.districts[def.id];
    if (wanted.has(def.id) && !ds.active) {
      ds.active = true;
      ds.launchedWeek = week;
      ds.deliveryTime = def.baseTime;
      // Часть жителей уже привыкла заказывать еду — стартовое ядро аудитории
      ds.awareness = Math.max(ds.awareness, 0.02);
      ds.customers = Math.max(ds.customers, reachableOf(def) * 0.005);
      launchCost += def.launchCost;
      launched.push(def.id);
    } else if (!wanted.has(def.id) && ds.active) {
      ds.active = false;
      ds.customers = 0;
      ds.restaurants = 0;
      closed.push(def.id);
    }
  }

  const activeDefs = DISTRICTS.filter((d) => state.districts[d.id].active);
  const commission = effectiveCommission(state, decisions);
  const season = seasonality(week);

  // --- 2а. Погода недели ---
  // Игрок знал её заранее: она была объявлена в конце прошлого хода.
  // Бьёт с двух сторон сразу — поднимает спрос и режет пропускную способность.
  const weatherType = state.weather ?? 'clear';
  const wx = weatherEffect(weatherType, decisions.weatherBonus ?? 0);

  // --- 2б. Алгоритмы: доступность, внедрение, настройки ---
  const quality = algoQuality(state);
  let installCost = 0;
  const installedNow = [];
  for (const a of ALGORITHMS) {
    if (decisions.algoOn?.[a.key] && !state.installed[a.key] && quality >= a.unlock) {
      state.installed[a.key] = true;
      installCost += a.install;
      installedNow.push(a.key);
    }
  }
  // Интенсивность алгоритма: 0 = выключен или недоступен
  const algo = (key) => (decisions.algoOn?.[key] && state.installed[key]
    ? clamp(decisions.algoParam?.[key] ?? 0, 0, 1)
    : 0);

  const batchLevel = algo('batching');
  const surgeStrength = algo('surge');
  const targetShare = decisions.algoOn?.targeting && state.installed.targeting
    ? clamp(decisions.algoParam?.targeting ?? 1, 0.05, 1) : 1;
  const targetingOn = decisions.algoOn?.targeting && state.installed.targeting;
  const allocSkew = algo('allocation');
  const flexSpread = algo('flexCommission');
  const forecastOn = Boolean(decisions.algoOn?.forecast && state.installed.forecast);
  const serviceTarget = clamp(decisions.algoParam?.forecast ?? 0.8, 0.55, 0.95);

  // Батчинг: курьер везёт несколько заказов за одну поездку. Растёт и число заказов
  // на курьера, и заработок курьера — а ставка за отдельный заказ в связке ниже,
  // потому что второй адрес по пути стоит платформе дешевле первого.
  // Плата за это — время: заказ ждёт попутчика и едет по цепочке.
  const batchCapacityMult = 1 + 0.60 * batchLevel * quality;
  const batchTimeMult = 1 + 0.16 * batchLevel * (1 - 0.6 * quality);
  const courierPayEff = decisions.courierPay * (1 - 0.20 * batchLevel * quality) + wx.payPerOrder;

  // Персональные скидки: платим за долю заказов, а эффект близок к скидке всем.
  // Точность = качество алгоритмов; при плохой модели скидка уходит не туда.
  const precision = quality;
  const promoLift = targetingOn
    ? 1 + precision * (1 / targetShare - 1) * 0.75
    : 1;
  const promoCostPerOrder = targetingOn ? decisions.promo * targetShare : decisions.promo;
  // Потолок: даже идеальная модель не создаст больше спроса, чем скидка всем подряд,
  // а неточная упирается заметно раньше.
  const promoCeiling = decisions.promo * (0.4 + 0.6 * precision);
  const effPromo = targetingOn
    ? Math.min(promoCeiling, decisions.promo * targetShare * promoLift)
    : decisions.promo;
  // Чем уже охват и хуже модель, тем больше клиентов замечают, что скидка досталась
  // не им. Штраф пропорционален размеру скидки: без скидок обижаться не на что.
  const targetingPenalty = targetingOn
    ? Math.pow(1 - targetShare, 2) * (1 - precision) * 0.35
      * Math.min(1, decisions.promo / 50)
    : 0;

  // Гибкая комиссия: крупным партнёрам ниже, остальным выше. Рестораны в среднем
  // довольнее (ниже воспринимаемая ставка), но часть выручки мы отдаём.
  const commissionForRevenue = commission * (1 - 0.06 * flexSpread);
  const commissionPerceived = commission * (1 - 0.35 * flexSpread * quality);

  // --- 3. Спрос по районам (время доставки берём прошлой недели — лаг обратной связи) ---
  const totalPotentialActive = activeDefs.reduce((s, d) => s + d.potential, 0) || 1;
  const perDistrict = [];
  let totalDemand = 0;

  for (const def of activeDefs) {
    const ds = state.districts[def.id];
    const aov = aovOf(def);
    const customerPrice = aov + decisions.deliveryFee - effPromo;
    const refPrice = aov + CONFIG.refDeliveryFee;
    const priceFactor = clamp(Math.pow(refPrice / Math.max(50, customerPrice), def.elasticity), 0.2, 2.5);

    const selRaw = ds.restaurants / (ds.restaurants + 50);
    const selRef = CONFIG.refRestaurants / (CONFIG.refRestaurants + 50);
    const selectionFactor = clamp(selRaw / selRef, 0, 1.35);

    const speedFactor = clamp(Math.pow(CONFIG.refDeliveryTime / Math.max(8, ds.deliveryTime), 0.6), 0.4, 1.3);

    const freq = def.baseFreq
      * priceFactor
      * Math.pow(speedFactor, 0.5)
      * Math.pow(Math.max(0.001, selectionFactor), 0.5)
      * season
      * wx.demandMult
      * mods.demandMult;

    const demand = ds.customers * freq;
    totalDemand += demand;
    perDistrict.push({ def, ds, aov, priceFactor, selectionFactor, speedFactor, freq, demand });
  }

  // --- 4. Пропускная способность курьеров ---
  const demandWeight = totalDemand > 0 ? totalDemand : 1;
  const avgDistance = perDistrict.length
    ? perDistrict.reduce((s, p) => s + p.def.distanceKm * (totalDemand > 0 ? p.demand : p.def.potential), 0)
      / (totalDemand > 0 ? demandWeight : activeDefs.reduce((s, d) => s + d.potential, 0) || 1)
    : CONFIG.courierRefDistanceKm;

  const perCourier = ordersPerCourier(state, avgDistance,
    mods.capacityMult * batchCapacityMult * wx.capacityMult);
  const capacity = state.couriers * perCourier;

  // Динамическое ценообразование. Надбавка появляется только в перегрузе:
  // surge зарабатывает не столько на цене, сколько на сглаживании пика.
  const rawUtil = capacity > 0 ? totalDemand / capacity : (totalDemand > 0 ? 3 : 0);
  const surgeUp = surgeStrength * clamp((rawUtil - 0.7) / 0.6, 0, 1);
  const surgeFeeMult = 1 + 0.35 * surgeUp;
  const surgeShave = 1 - 0.10 * surgeUp;          // часть пикового спроса отказывается
  const surgeTimeMult = 1 - 0.12 * surgeUp * quality;
  const surgePenalty = Math.pow(surgeStrength, 1.5) * (0.03 + 0.35 * surgeUp) * (1 - 0.5 * quality);

  const effDemandTotal = totalDemand * surgeShave;
  for (const p of perDistrict) p.demandEff = p.demand * surgeShave;

  // Распределение курьеров по районам. Без алгоритма — пропорционально спросу
  // (одинаковая загрузка везде). С алгоритмом — с перекосом в пользу маржи.
  const cmOf = (p) => p.aov * commissionForRevenue + decisions.deliveryFee * surgeFeeMult
    - courierPayEff - promoCostPerOrder
    - (p.aov + decisions.deliveryFee * surgeFeeMult - promoCostPerOrder) * CONFIG.paymentFeeRate
    - Math.max(2, CONFIG.supportCostPerOrder - CONFIG.supportTechDiscount * techLevel(state));
  const cmAvg = effDemandTotal > 0
    ? perDistrict.reduce((acc, p) => acc + cmOf(p) * p.demandEff, 0) / effDemandTotal
    : 1;

  let weightSum = 0;
  for (const p of perDistrict) {
    const edge = cmAvg !== 0 ? cmOf(p) / cmAvg - 1 : 0;
    p.allocWeight = Math.max(0.2 * p.demandEff, p.demandEff * (1 + 2.5 * allocSkew * quality * edge));
    weightSum += p.allocWeight;
  }

  // Мощность закрепляется за районом. Лишние курьеры в одном районе не спасают
  // соседний — они просто простаивают. Поэтому перекос всегда чем-то оплачен.
  for (const p of perDistrict) {
    p.capacity = weightSum > 0 ? capacity * (p.allocWeight / weightSum) : 0;
  }

  const utilization = capacity > 0 ? effDemandTotal / capacity : (effDemandTotal > 0 ? 3 : 0);

  let orders = 0;
  let gmv = 0;
  let paymentBase = 0;

  for (const p of perDistrict) {
    p.util = p.capacity > 0 ? p.demandEff / p.capacity : (p.demandEff > 0 ? 3 : 0);
    p.fill = p.demandEff > 0 ? clamp(p.capacity / p.demandEff, 0, 1) : 1;
    p.served = Math.min(p.demandEff, p.capacity);
    // Новое время доставки: перегрузка кубически бьёт по скорости
    const congestion = 1 + 0.85 * Math.pow(Math.min(p.util, 2.2), 3);
    p.newTime = state.couriers > 0
      ? clamp(p.def.baseTime * congestion * batchTimeMult * surgeTimeMult
          * (1 - 0.12 * techLevel(state)), 10, 120)
      : 120;
    orders += p.served;
    gmv += p.served * p.aov;
    paymentBase += p.served * (p.aov + decisions.deliveryFee * surgeFeeMult - promoCostPerOrder);
  }
  const fillRate = effDemandTotal > 0 ? orders / effDemandTotal : (capacity > 0 ? 1 : 0);

  // --- 5. P&L недели ---
  const commissionRevenue = gmv * commissionForRevenue;
  const feeRevenue = orders * decisions.deliveryFee * surgeFeeMult;
  const netRevenue = commissionRevenue + feeRevenue;

  const courierCost = orders * courierPayEff;
  const promoCost = orders * promoCostPerOrder;
  const paymentCost = Math.max(0, paymentBase) * CONFIG.paymentFeeRate;
  const supportCost = orders * Math.max(2,
    CONFIG.supportCostPerOrder - CONFIG.supportTechDiscount * techLevel(state) + mods.variableCostAdd);
  const variableCost = courierCost + promoCost + paymentCost + supportCost;
  const contribution = netRevenue - variableCost;

  const districtFixed = activeDefs.reduce((s, d) => s + d.weeklyFixed, 0);
  const hqCost = CONFIG.hqWeeklyBase + CONFIG.hqPerCourier * state.couriers;

  // --- 6. Курьеры: наём и отток ---
  // Курьер оценивает не фактический, а ожидаемый заработок: он видит ставку и
  // рассчитывает набрать хотя бы 60% полной смены. Поэтому у ставки есть «пол».
  const realizedPerCourier = state.couriers > 0 ? orders / state.couriers : 0;
  const expectedOrdersPerCourier = Math.max(realizedPerCourier, perCourier * CONFIG.courierExpectedLoad);
  const courierEarnings = expectedOrdersPerCourier * courierPayEff;
  const attractiveness = courierEarnings / CONFIG.courierMarketWeeklyPay;
  // Удержание же зависит от фактического заработка: простой злит не меньше низкой ставки.
  const realizedEarnings = state.couriers > 0
    ? realizedPerCourier * courierPayEff
    : courierEarnings;
  const realizedAttractiveness = realizedEarnings / CONFIG.courierMarketWeeklyPay;

  const avgAwareness = activeDefs.length
    ? activeDefs.reduce((s, d) => s + state.districts[d.id].awareness, 0) / activeDefs.length
    : 0;

  // Предложение труда: отклики появляются, только когда заработок обгоняет рынок
  const applicants = CONFIG.courierApplicantsBase
    * clamp((attractiveness - CONFIG.courierHireThreshold) / CONFIG.courierHireSpan, 0, 1.4)
    * (1 + 0.6 * avgAwareness)
    * mods.courierSupplyMult
    * (activeDefs.length ? 1 : 0);

  // Прогноз спроса: штат подбирается автоматически под ожидаемую нагрузку.
  // Ошибка прогноза детерминирована (не трогает ГПСЧ) и падает с ростом качества.
  // Наём этой недели выходит на линию на следующей, поэтому и прогноз, и ручное
  // решение игрока должны смотреть на погоду СЛЕДУЮЩЕЙ недели. Она объявлена публично.
  const wxNext = weatherEffect(state.weatherNext ?? 'clear', decisions.weatherBonus ?? 0);
  let forecastDemand = null;
  let targetCouriers = Math.max(0, Math.round(decisions.targetCouriers));
  if (forecastOn) {
    const hist = state.history;
    const prevDemand = hist.length ? hist[hist.length - 1].demand : effDemandTotal;
    const growth = prevDemand > 0 ? clamp(effDemandTotal / prevDemand, 0.85, 1.35) : 1.1;
    const noise = Math.sin(week * 127.1) * Math.cos(week * 311.7);
    const error = noise * (1 - quality) * 0.30;
    // Спрос текущей недели уже включает сегодняшнюю погоду — переводим его
    // в «безпогодный» вид и накладываем прогноз на следующую
    const weatherShift = wxNext.demandMult / Math.max(0.01, wx.demandMult);
    forecastDemand = Math.max(0, effDemandTotal * growth * weatherShift * (1 + error));
    targetCouriers = Math.round(
      forecastDemand / Math.max(1, perCourier * (wxNext.capacityMult / Math.max(0.01, wx.capacityMult)))
      / serviceTarget);
  }

  const churnRate = clamp(
    CONFIG.courierBaseChurn
    + Math.max(0, 1.15 - realizedAttractiveness) * 0.55
    + Math.max(0, utilization - 0.9) * 0.35
    + wx.churnAdd
    + mods.courierChurnAdd,
    0, 0.7
  );
  state.courierMorale = state.couriers > 0 ? realizedAttractiveness : 1;
  const courierLeft = state.couriers * churnRate;
  const target = targetCouriers;
  const after = state.couriers - courierLeft;
  const hires = clamp(target - after, 0, applicants);
  const hiringCost = hires * CONFIG.courierHireCost;
  state.couriers = Math.max(0, Math.round(after + hires));

  // --- 7. Рестораны ---
  const remainingPoolTotal = activeDefs.reduce(
    (s, d) => s + Math.max(0, d.restaurantPool - state.districts[d.id].restaurants), 0) || 1;
  const salesPower = clamp(0.35 * Math.pow(decisions.sales / CONFIG.salesRefBudget, 0.6), 0, 0.8);
  const commissionTerm = clamp(
    Math.pow(CONFIG.restaurantRefCommission / Math.max(0.02, commissionPerceived), 0.8), 0.3, 1.6);

  for (const def of activeDefs) {
    const ds = state.districts[def.id];
    const p = perDistrict.find((x) => x.def.id === def.id);
    const served = p ? p.served : 0;
    const ordersPerRest = ds.restaurants > 0 ? served / ds.restaurants : 0;
    const volumeTerm = clamp(Math.pow(ordersPerRest / CONFIG.restaurantRefOrders, 0.5), 0, 1.5);
    // Поток заказов компенсирует высокую комиссию лишь до предела: когда доставка
    // перестаёт быть рентабельной для самого ресторана, объём его уже не удержит.
    const viability = clamp(
      (CONFIG.restaurantMaxCommission - commissionPerceived) / CONFIG.restaurantCommissionSpan, 0, 1);
    const attractR = clamp(
      (0.35 + 0.65 * volumeTerm) * commissionTerm * (0.25 + 0.75 * viability), 0, 1.6);

    const remaining = Math.max(0, def.restaurantPool - ds.restaurants);
    const share = remaining / remainingPoolTotal;
    const localSales = salesPower * (activeDefs.length > 1 ? share * activeDefs.length : 1);
    const newRest = remaining * clamp(localSales * attractR * 0.5, 0, 0.4);

    const restChurn = clamp(CONFIG.restaurantBaseChurn
      + Math.max(0, 1 - attractR) * 0.12 + mods.restaurantChurnAdd, 0, 0.5);

    ds.restaurants = clamp(ds.restaurants * (1 - restChurn) + newRest, 0, def.restaurantPool);
    ds.attractR = attractR;
  }

  // Событие «крупная сеть» добавляет рестораны сразу
  if (mods.restaurantsAdd && activeDefs.length) {
    const per = mods.restaurantsAdd / activeDefs.length;
    for (const def of activeDefs) {
      const ds = state.districts[def.id];
      ds.restaurants = Math.min(def.restaurantPool, ds.restaurants + per);
    }
  }

  // --- 8. Клиенты: узнаваемость, приток, отток ---
  let newCustomers = 0;
  let lostCustomers = 0;
  let weightedSat = 0;

  for (const p of perDistrict) {
    const { def, ds } = p;
    const marketingShare = def.potential / totalPotentialActive;
    const spendPerUser = (decisions.marketing * marketingShare) / def.potential;
    const gain = clamp(
      0.30 * Math.pow(spendPerUser / CONFIG.refMarketingPerUser, 0.55),
      0, CONFIG.awarenessMaxGain
    );
    ds.awareness = clamp(
      ds.awareness + (1 - ds.awareness) * safe(gain) - ds.awareness * CONFIG.awarenessDecay + mods.awarenessAdd,
      0, 1
    );

    const newSpeedFactor = clamp(Math.pow(CONFIG.refDeliveryTime / p.newTime, 0.6), 0.4, 1.3);
    const lostShare = 1 - p.fill;
    const satisfaction = clamp(
      0.35 * newSpeedFactor
      + 0.25 * Math.min(p.selectionFactor, 1.2)
      + 0.25 * Math.min(p.priceFactor, 1.3)
      + 0.15 * (1 - lostShare * 2)
      + mods.satisfactionAdd
      - surgePenalty
      - targetingPenalty,
      0, 1.4
    );
    ds.satisfaction = satisfaction;
    weightedSat += satisfaction * def.potential;

    const churn = clamp(
      CONFIG.customerBaseChurn + Math.max(0, 1 - satisfaction) * 0.30 + def.competitor * 0.012,
      0, 0.6
    );
    const leaving = ds.customers * churn;

    const untapped = Math.max(0, reachableOf(def) - ds.customers);
    const trial = untapped * ds.awareness * CONFIG.trialRate
      * clamp(satisfaction, 0.3, 1.3) * clamp(p.selectionFactor, 0, 1.2);
    const wom = ds.customers * 0.02 * Math.max(0, satisfaction - 1);

    ds.customers = Math.max(0, ds.customers - leaving + trial + wom);
    ds.deliveryTime = p.newTime;
    newCustomers += trial + wom;
    lostCustomers += leaving;
    p.satisfaction = satisfaction;
  }

  // --- 9. Деньги ---
  const opex = districtFixed + hqCost + decisions.marketing + decisions.sales
    + decisions.tech + (decisions.rnd ?? 0);
  const oneOff = launchCost + hiringCost + installCost + (mods.oneOffCost ?? 0);
  const profit = contribution - opex;
  state.cash += profit - oneOff;
  state.techStock += decisions.tech;
  state.rndStock += decisions.rnd ?? 0;
  state.dataStock += orders;   // каждая доставка — строчка в обучающей выборке

  // --- 10. Метрики для интерфейса ---
  const totalCustomers = activeDefs.reduce((s, d) => s + state.districts[d.id].customers, 0);
  const totalRestaurants = activeDefs.reduce((s, d) => s + state.districts[d.id].restaurants, 0);
  const avgDeliveryTime = orders > 0
    ? perDistrict.reduce((s, p) => s + p.newTime * p.served, 0) / orders
    : (perDistrict.length ? perDistrict.reduce((s, p) => s + p.newTime, 0) / perDistrict.length : 0);

  const cityMarketOrders = DISTRICTS.reduce((s, d) => s + d.potential * d.baseFreq * 0.45, 0);
  const marketShare = orders / cityMarketOrders;

  const cac = newCustomers > 0 ? (decisions.marketing) / newCustomers : 0;
  const cmPerOrder = orders > 0 ? contribution / orders : 0;
  // LTV = вклад с заказа x частота x ожидаемое число недель жизни клиента
  const avgFreq = totalCustomers > 0 ? orders / totalCustomers : 0;
  const avgChurn = clamp(CONFIG.customerBaseChurn
    + Math.max(0, 1 - (totalPotentialActive ? weightedSat / totalPotentialActive : 1)) * 0.30, 0.01, 0.6);
  const ltv = cmPerOrder * avgFreq / avgChurn;

  const wGeo = (key) => {
    if (!perDistrict.length || totalDemand <= 0) return 1;
    let acc = 0;
    for (const p of perDistrict) acc += Math.log(Math.max(1e-6, p[key])) * (p.demand / totalDemand);
    return Math.exp(acc);
  };

  const report = {
    week,
    orders,
    demand: effDemandTotal,
    demandRaw: totalDemand,
    lostOrders: Math.max(0, effDemandTotal - orders),
    gmv,
    netRevenue,
    commissionRevenue,
    feeRevenue,
    courierCost,
    promoCost,
    paymentCost,
    supportCost,
    variableCost,
    contribution,
    cmPerOrder,
    opex,
    districtFixed,
    hqCost,
    oneOff,
    launchCost,
    hiringCost,
    profit,
    cash: state.cash,
    couriers: state.couriers,
    hires,
    courierLeft,
    applicants,
    courierEarnings: state.couriers > 0 ? realizedEarnings : courierEarnings,
    courierAttractiveness: state.couriers > 0 ? realizedAttractiveness : attractiveness,
    utilization,
    fillRate,
    capacity,
    perCourier,
    avgDeliveryTime,
    customers: totalCustomers,
    newCustomers,
    lostCustomers,
    restaurants: totalRestaurants,
    marketShare,
    commission,
    cac,
    ltv,
    ltvCac: cac > 0 ? ltv / cac : null,
    techLevel: techLevel(state),
    season,

    // --- погода ---
    weather: weatherType,
    weatherNext: state.weatherNext ?? 'clear',
    weatherDemandMult: wx.demandMult,
    weatherCapacityMult: wx.capacityMult,
    weatherSeverity: wx.severity,
    weatherBonusPerOrder: wx.payPerOrder,
    weatherBonusCost: orders * wx.payPerOrder,
    weatherChurnAdd: wx.churnAdd,
    seasonName: seasonOf(week),

    // --- алгоритмы ---
    algoQuality: quality,
    dataLevel: dataLevel(state),
    rndLevel: rndLevel(state),
    installCost,
    installedNow,
    algoActive: Object.fromEntries(ALGORITHMS.map((a) => [a.key, Boolean(decisions.algoOn?.[a.key] && state.installed[a.key])])),
    courierPayEff,
    surgeUplift: surgeUp,
    surgeFeeMult,
    effectivePromo: effPromo,
    promoCostPerOrder,
    promoLift: targetingOn ? promoLift : 1,
    batchCapacityMult,
    batchTimeMult,
    forecastDemand,
    commissionForRevenue,
    commissionPerceived,
    avgPriceFactor: wGeo('priceFactor'),
    avgSpeedFactor: wGeo('speedFactor'),
    avgSelectionFactor: wGeo('selectionFactor'),
    event: event ? { id: event.id, choice } : null,
    launched,
    closed,
    districts: perDistrict.map((p) => ({
      id: p.def.id,
      orders: p.served,
      demand: p.demand,
      customers: state.districts[p.def.id].customers,
      penetration: state.districts[p.def.id].customers / reachableOf(p.def),
      restaurants: state.districts[p.def.id].restaurants,
      awareness: state.districts[p.def.id].awareness,
      deliveryTime: p.newTime,
      satisfaction: p.satisfaction,
      fill: p.fill,
      util: p.util,
      aov: p.aov,
      priceFactor: p.priceFactor,
      selectionFactor: p.selectionFactor,
      speedFactor: p.speedFactor,
      contribution: p.served * cmOf(p),
      cmPerOrder: cmOf(p),
    })),
    decisions: structuredClone({ ...decisions, districts: [...(decisions.districts ?? [])] }),
  };

  // --- 11. Завершение недели ---
  state.week = week;
  state.lastSnapshot = snapshot;
  state.history.push(report);
  state.rngState = rng.state();
  state.pendingChoice = null;
  state.pendingEvent = rollEvent(rng, week + 1, state.flags);
  state.weather = state.weatherNext ?? 'clear';
  state.weatherNext = rollWeather(rng, week + 2);
  state.rngState = rng.state();

  if (state.cash < 0) state.over = 'bankrupt';
  else if (week >= CONFIG.weeksTotal) state.over = 'finished';

  report.valuation = valuation(state);
  report.equityValue = report.valuation * state.equity;

  return { state, report };
}

// ----------------------------------------------------------------------------
// Контрфактический разбор: «сколько на самом деле принёс каждый алгоритм».
//
// Для каждого включённого алгоритма прошлая неделя пересчитывается заново с
// выключенным алгоритмом — и сравнивается с тем, что получилось на самом деле.
// Это честный ответ на вопрос «а стоило ли оно того», который в реальной
// компании требует A/B-теста, а здесь считается мгновенно.
// ----------------------------------------------------------------------------
function algorithmImpact(state) {
  const snap = state.lastSnapshot;
  const actual = state.history[state.history.length - 1];
  if (!snap || !actual) return [];

  const out = [];
  for (const a of ALGORITHMS) {
    if (!actual.algoActive?.[a.key]) continue;
    const decisions = structuredClone(actual.decisions);
    decisions.algoOn = { ...decisions.algoOn, [a.key]: false };
    let alt;
    try {
      alt = step(snap, { decisions, eventChoice: actual.event?.choice ?? 0 }).report;
    } catch {
      continue;
    }
    if (!alt) continue;
    out.push({
      key: a.key,
      profit: actual.profit - alt.profit,
      orders: actual.orders - alt.orders,
      deliveryTime: actual.avgDeliveryTime - alt.avgDeliveryTime,
      cmPerOrder: actual.cmPerOrder - alt.cmPerOrder,
      customers: actual.customers - alt.customers,
    });
  }
  return out.sort((x, y) => y.profit - x.profit);
}

// ----------------------------------------------------------------------------
// Оценка компании и раунды инвестиций
// ----------------------------------------------------------------------------
function valuation(state) {
  const h = state.history;
  if (!h.length) return 40_000_000;
  const last = h[h.length - 1];
  const netRevenueRunRate = last.netRevenue * 52;

  const tail = h.slice(-4).reduce((s, r) => s + r.orders, 0);
  const prev = h.slice(-8, -4).reduce((s, r) => s + r.orders, 0);
  const growth = prev > 0 ? tail / prev : (tail > 0 ? 1.5 : 1);
  const growthScore = clamp(growth - 1, 0, 1);

  const margin = last.netRevenue > 0 ? last.profit / last.netRevenue : -0.5;
  const marginScore = clamp(margin, -0.4, 0.25) / 0.25;

  const multiple = clamp(2.0 + 5 * growthScore + 4 * Math.max(0, marginScore) + 1.5 * Math.min(0, marginScore), 0.5, 12);
  const base = netRevenueRunRate * multiple;
  const bonus = 1 + clamp(state.flags.valuationBonus, -0.4, 0.6);
  return Math.max(40_000_000, base * bonus);
}

function fundingOffer(state, amount) {
  const pre = valuation(state);
  const dilution = amount / (pre + amount);
  return { pre, post: pre + amount, amount, dilution, newEquity: state.equity * (1 - dilution) };
}

function raise(state, amount) {
  const offer = fundingOffer(state, amount);
  const next = structuredClone(state);
  next.cash += amount;
  next.equity = offer.newEquity;
  next.raisedTotal += amount;
  return { state: next, offer };
}

// ----------------------------------------------------------------------------
// Разбор недели: раскладываем изменение числа заказов на факторы.
// ln(orders) = ln(клиенты) + ln(частота) + ln(доля выполненных)
// ----------------------------------------------------------------------------
function explain(prev, cur) {
  if (!prev || !cur) return [];
  // Возвращаем ключи, а не текст: подпись подставит слой интерфейса
  const parts = [
    ['driverCustomers', prev.customers, cur.customers],
    ['driverPrice', prev.avgPriceFactor, cur.avgPriceFactor],
    ['driverSpeed', Math.pow(prev.avgSpeedFactor, 0.5), Math.pow(cur.avgSpeedFactor, 0.5)],
    ['driverSelection', Math.pow(prev.avgSelectionFactor, 0.5), Math.pow(cur.avgSelectionFactor, 0.5)],
    ['driverSeason', prev.season * prev.weatherDemandMult, cur.season * cur.weatherDemandMult],
    ['driverFill', Math.max(0.01, prev.fillRate), Math.max(0.01, cur.fillRate)],
  ];
  return parts
    .map(([key, a, b]) => ({
      key,
      effect: a > 0 && b > 0 ? Math.exp(Math.log(b) - Math.log(a)) - 1 : 0,
    }))
    .filter((p) => Math.abs(p.effect) > 0.002)
    .sort((a, b) => Math.abs(b.effect) - Math.abs(a.effect));
}

// ----------------------------------------------------------------------------
// Экономика одного заказа «на салфетке» — считается мгновенно, до расчёта недели.
// Именно эту таблицу студент должен научиться держать в голове.
// ----------------------------------------------------------------------------
function unitEconomics(state, decisions) {
  const active = DISTRICTS.filter((d) => state.districts[d.id].active);
  const weights = active.length
    ? active.map((d) => {
        const ds = state.districts[d.id];
        return Math.max(1, ds.customers || d.potential * 0.01);
      })
    : [1];
  const pool = active.length ? active : [DISTRICTS[0]];
  const wsum = weights.reduce((s, w) => s + w, 0);
  const aov = pool.reduce((s, d, i) => s + aovOf(d) * weights[i], 0) / wsum;

  const commission = effectiveCommission(state, decisions);
  const t = techLevel(state);

  // Алгоритмы меняют экономику заказа ещё до того, как сыграна неделя
  const on = (key) => Boolean(decisions.algoOn?.[key] && state.installed?.[key]);
  const flexSpread = on('flexCommission') ? clamp(decisions.algoParam?.flexCommission ?? 0, 0, 1) : 0;
  const commissionForRevenue = commission * (1 - 0.06 * flexSpread);
  const targetShare = on('targeting') ? clamp(decisions.algoParam?.targeting ?? 1, 0.05, 1) : 1;
  const promo = on('targeting') ? decisions.promo * targetShare : decisions.promo;

  const commissionRevenue = aov * commissionForRevenue;
  const feeRevenue = decisions.deliveryFee;
  const revenue = commissionRevenue + feeRevenue;

  const courier = decisions.courierPay;
  const payment = (aov + decisions.deliveryFee - promo) * CONFIG.paymentFeeRate;
  const support = Math.max(2, CONFIG.supportCostPerOrder - CONFIG.supportTechDiscount * t);
  const variable = courier + promo + payment + support;

  return {
    aov, commission: commissionForRevenue, commissionBase: commission, targetShare,
    commissionRevenue, feeRevenue, revenue,
    courier, promo, payment, support, variable,
    contribution: revenue - variable,
    takeRate: revenue / aov,
    marginOfGmv: (revenue - variable) / aov,
  };
}

// Итоговый счёт партии
function finalScore(state) {
  const v = valuation(state);
  return {
    valuation: v,
    equity: state.equity,
    equityValue: v * state.equity,
    raised: state.raisedTotal,
    cash: state.cash,
    weeks: state.week,
    bankrupt: state.over === 'bankrupt',
  };
}


// ===== ../../shared/format.js ======================================
// Форматирование чисел для интерфейса.
// Разделители разрядов и суффиксы («млн» / «M») зависят от языка.


const LOCALE = { ru: 'ru-RU', en: 'en-US' };
const SUFFIX = {
  ru: { thousand: 'тыс', million: 'млн', billion: 'млрд', k: 'к', m: 'м' },
  en: { thousand: 'K', million: 'M', billion: 'B', k: 'K', m: 'M' },
};

const locale = () => LOCALE[getLang()] ?? 'ru-RU';
const suffix = () => SUFFIX[getLang()] ?? SUFFIX.ru;
const group = (x) => Math.round(x).toLocaleString(locale());

function num(x, digits = 0) {
  if (!Number.isFinite(x)) return '—';
  return x.toLocaleString(locale(), { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function money(x) {
  if (!Number.isFinite(x)) return '—';
  const abs = Math.abs(x);
  const sign = x < 0 ? '−' : '';
  const s = suffix();
  if (abs >= 1e9) return `${sign}${(abs / 1e9).toFixed(2)} ${s.billion} ₽`;
  if (abs >= 1e6) return `${sign}${(abs / 1e6).toFixed(abs >= 1e7 ? 1 : 2)} ${s.million} ₽`;
  if (abs >= 1e3) return `${sign}${group(abs)} ₽`;
  return `${sign}${abs.toFixed(0)} ₽`;
}

function moneyExact(x) {
  if (!Number.isFinite(x)) return '—';
  return `${x < 0 ? '−' : ''}${group(Math.abs(x))} ₽`;
}

// Короткие подписи на осях графиков
function axisNum(v) {
  const s = suffix();
  if (Math.abs(v) >= 1e6) return `${(v / 1e6).toFixed(1)}${s.m}`;
  if (Math.abs(v) >= 1000) return `${Math.round(v / 1000)}${s.k}`;
  return String(Math.round(v));
}

function pct(x, digits = 1) {
  if (!Number.isFinite(x)) return '—';
  return `${(x * 100).toFixed(digits)}%`;
}

function signedPct(x, digits = 1) {
  if (!Number.isFinite(x)) return '—';
  return `${x > 0 ? '+' : ''}${(x * 100).toFixed(digits)}%`;
}

function compact(x) {
  if (!Number.isFinite(x)) return '—';
  const abs = Math.abs(x);
  const s = suffix();
  if (abs >= 1e6) return `${(x / 1e6).toFixed(1)} ${s.million}`;
  if (abs >= 1e3) return `${(x / 1e3).toFixed(1)} ${s.thousand}`;
  return group(x);
}


// ===== ../../shared/charts.js ======================================
// Минималистичные графики на canvas — без внешних библиотек,
// чтобы игра открывалась одним файлом и работала офлайн.

const PALETTE = ['#4ade80', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa', '#22d3ee'];

function niceTicks(min, max, count = 4) {
  if (!Number.isFinite(min) || !Number.isFinite(max) || min === max) {
    return [min || 0, (min || 0) + 1];
  }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) ?? mag * 10;
  const start = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = start; v <= max + step * 0.5; v += step) ticks.push(v);
  return ticks;
}

/**
 * series: [{ label, color?, data: number[] }]
 * opts: { format?: (v)=>string, zeroLine?: boolean, title?: string }
 */
function drawLineChart(canvas, series, opts = {}) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 320;
  const cssH = canvas.clientHeight || 180;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const fmt = opts.format ?? ((v) => (Math.abs(v) >= 1000 ? `${Math.round(v / 1000)}к` : String(Math.round(v))));
  const padL = 52, padR = 10, padT = 16, padB = 22;
  const w = cssW - padL - padR;
  const h = cssH - padT - padB;

  const visible = series.filter((s) => s.data && s.data.length);
  if (!visible.length || visible.every((s) => s.data.length < 1)) {
    ctx.fillStyle = 'rgba(226,232,240,0.35)';
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(opts.emptyText ?? '', cssW / 2, cssH / 2);
    return;
  }

  const n = Math.max(...visible.map((s) => s.data.length));
  let min = Infinity, max = -Infinity;
  for (const s of visible) for (const v of s.data) {
    if (!Number.isFinite(v)) continue;
    min = Math.min(min, v); max = Math.max(max, v);
  }
  if (!Number.isFinite(min)) { min = 0; max = 1; }
  if (opts.zeroLine) { min = Math.min(min, 0); max = Math.max(max, 0); }
  if (min === max) { max = min + Math.abs(min || 1) * 0.2 + 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;

  const x = (i) => padL + (n <= 1 ? w / 2 : (i / (n - 1)) * w);
  const y = (v) => padT + h - ((v - min) / (max - min)) * h;

  // сетка
  const ticks = niceTicks(min, max, 4);
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const t of ticks) {
    if (t < min || t > max) continue;
    const py = y(t);
    ctx.strokeStyle = Math.abs(t) < 1e-9 ? 'rgba(148,163,184,0.35)' : 'rgba(148,163,184,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, py + 0.5);
    ctx.lineTo(padL + w, py + 0.5);
    ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.7)';
    ctx.fillText(fmt(t), padL - 6, py);
  }

  // ось X — номера недель
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const labelEvery = Math.max(1, Math.ceil(n / 8));
  for (let i = 0; i < n; i += labelEvery) {
    ctx.fillStyle = 'rgba(148,163,184,0.6)';
    ctx.fillText(String(i + 1), x(i), padT + h + 6);
  }

  // линии
  visible.forEach((s, si) => {
    ctx.strokeStyle = s.color ?? PALETTE[si % PALETTE.length];
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let started = false;
    s.data.forEach((v, i) => {
      if (!Number.isFinite(v)) return;
      const px = x(i), py = y(v);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    });
    ctx.stroke();

    // последняя точка
    const lastIdx = s.data.length - 1;
    if (lastIdx >= 0 && Number.isFinite(s.data[lastIdx])) {
      ctx.fillStyle = s.color ?? PALETTE[si % PALETTE.length];
      ctx.beginPath();
      ctx.arc(x(lastIdx), y(s.data[lastIdx]), 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function legendHtml(series) {
  return series.map((s, i) => `<span class="legend-item"><i style="background:${s.color ?? PALETTE[i % PALETTE.length]}"></i>${s.label}</span>`).join('');
}



// ===== src/ui/app.js ===============================================
// ============================================================================
// Слой интерфейса: состояние партии, отрисовка, обработка ввода.
// Вся экономика живёт в src/model — здесь только показ и управление.
// Весь текст берётся из src/i18n.js: t() для строк интерфейса,
// tx() для двуязычных полей модели (районы, рычаги, события, алгоритмы).
// ============================================================================


const SAVE_KEY = 'novoeda-save-v3';
const el = (id) => document.getElementById(id);

let state = null;
let chartTab = 'orders';
let rightTab = 'unit';
let leversBuilt = false;

// ----------------------------------------------------------------------------
// Сохранение
// ----------------------------------------------------------------------------
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch { /* приватный режим */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && s.districts && Array.isArray(s.history) ? s : null;
  } catch { return null; }
}

const last = () => state.history[state.history.length - 1] ?? null;
const prev = () => state.history[state.history.length - 2] ?? null;

const algoByKey = (key) => ALGORITHMS.find((a) => a.key === key);
const weatherName = (type) => t(`wx${type.charAt(0).toUpperCase()}${type.slice(1)}`);
const seasonName = (season) => t(`season${season.charAt(0).toUpperCase()}${season.slice(1)}`);

// ----------------------------------------------------------------------------
// KPI в шапке
// ----------------------------------------------------------------------------
function kpi(label, value, sub, cls = 'neutral') {
  return `<div class="kpi">
    <div class="k-label">${label}</div>
    <div class="k-value">${value}</div>
    <div class="k-delta ${cls}">${sub ?? ''}</div>
  </div>`;
}

function delta(cur, before) {
  if (!Number.isFinite(cur) || !Number.isFinite(before) || before === 0) return ['', 'neutral'];
  const d = cur / before - 1;
  return [signedPct(d), d > 0.001 ? 'up' : d < -0.001 ? 'down' : 'neutral'];
}

function renderKpis() {
  const r = last();
  const p = prev();
  const burn = r ? r.opex + r.oneOff - r.contribution : 0;
  const runway = burn > 0 ? state.cash / burn : Infinity;

  const parts = [
    kpi(t('kpiWeek'), `${state.week} / ${CONFIG.weeksTotal}`,
      r?.event ? t('kpiWeekEvent') : t('kpiWeekCity')),
    kpi(t('kpiCash'), money(state.cash),
      state.cash < 0 ? t('kpiCashOut')
        : Number.isFinite(runway) ? t('kpiRunway', { weeks: runway.toFixed(0) })
        : t('kpiProfitable'),
      state.cash < 0 ? 'down' : runway < 8 ? 'down' : runway < 20 ? 'neutral' : 'up'),
  ];

  if (r) {
    const [dOrders, cOrders] = delta(r.orders, p?.orders);
    parts.push(
      kpi(t('kpiOrders'), compact(r.orders), dOrders, cOrders),
      kpi(t('kpiProfit'), money(r.profit), t('kpiProfitSub', { value: money(r.contribution) }),
        r.profit >= 0 ? 'up' : 'down'),
      kpi(t('kpiCm'), `${num(r.cmPerOrder)} ₽`,
        t('kpiTakeRate', { value: pct(r.netRevenue / Math.max(1, r.gmv)) }),
        r.cmPerOrder >= 0 ? 'up' : 'down'),
      kpi(t('kpiDelivery'), t('minutes', { value: num(r.avgDeliveryTime) }),
        t('kpiUtil', { value: pct(r.utilization, 0) }),
        r.avgDeliveryTime <= 35 ? 'up' : r.avgDeliveryTime <= 45 ? 'neutral' : 'down'),
      kpi(t('kpiShare'), pct(r.marketShare), t('kpiCustomers', { value: compact(r.customers) }), 'neutral'),
      kpi(t('kpiEquity'), money(r.equityValue ?? 0), t('kpiEquitySub', { value: pct(state.equity, 1) }), 'neutral'),
    );
  } else {
    parts.push(kpi(t('kpiStart'), money(CONFIG.startCash), t('kpiStartSub'), 'up'));
  }

  el('kpis').innerHTML = parts.join('');
}

// ----------------------------------------------------------------------------
// Рычаги
// ----------------------------------------------------------------------------
function buildLevers() {
  el('levers').innerHTML = LEVERS.map((l) => `
    <div class="lever" data-key="${l.key}">
      <div class="lever-head">
        <span class="lever-label">${tx(l.label)}</span>
        <span class="lever-value" id="val-${l.key}"></span>
      </div>
      <input type="range" id="in-${l.key}" min="${l.min}" max="${l.max}" step="${l.step}" />
      <button class="lever-why" type="button">${t('leverWhy')}</button>
      <div class="lever-tip">${tx(l.tip)}</div>
    </div>
  `).join('');

  for (const l of LEVERS) {
    const input = el(`in-${l.key}`);
    input.addEventListener('input', () => {
      state.decisions[l.key] = Number(input.value) * (l.scale ?? 1);
      syncLevers();
      renderOpsReadout();
      if (l.key === 'weatherBonus') renderWeather();
      renderRightTab();
      save();
    });
  }
  el('levers').querySelectorAll('.lever-why').forEach((b) => {
    b.addEventListener('click', () => b.closest('.lever').classList.toggle('open'));
  });
  leversBuilt = true;
}

function leverDisplay(l, raw) {
  const unit = tx(l.unit);
  if (l.key === 'marketing' || l.key === 'sales' || l.key === 'tech' || l.key === 'rnd') return money(raw);
  if (unit === '%') return `${raw}%`;
  if (l.key === 'targetCouriers') return num(raw);
  return `${num(raw)} ${unit}`;
}

function syncLevers() {
  for (const l of LEVERS) {
    const raw = state.decisions[l.key] / (l.scale ?? 1);
    const input = el(`in-${l.key}`);
    if (input) input.value = String(raw);
    el(`val-${l.key}`).textContent = leverDisplay(l, raw);
  }
}

// Оперативная сводка под ползунками: сколько курьер заработает и сколько
// заказов увезёт выбранный штат. Считается мгновенно, до перехода к неделе —
// именно здесь видно, что ставка ниже рынка означает «никто не выйдет на смену».
function renderOpsReadout() {
  const active = DISTRICTS.filter((d) => state.decisions.districts?.includes(d.id));
  if (!active.length) {
    el('ops-readout').innerHTML = `<div class="hint-box" style="margin-bottom:12px">${t('opsNoDistrict')}</div>`;
    return;
  }
  const wsum = active.reduce((s, d) => s + d.potential, 0);
  const avgDistance = active.reduce((s, d) => s + d.distanceKm * d.potential, 0) / wsum;

  // Батчинг меняет и производительность курьера, и его ставку за отдельный заказ
  const q = algoQuality(state);
  const batch = state.decisions.algoOn?.batching && state.installed?.batching
    ? (state.decisions.algoParam?.batching ?? 0) : 0;
  const forecastOn = Boolean(state.decisions.algoOn?.forecast && state.installed?.forecast);

  // Штат, набранный сейчас, выйдет на линию на следующей неделе — считаем по её погоде
  const nextType = state.weatherNext ?? 'clear';
  const wxNext = weatherEffect(nextType, state.decisions.weatherBonus ?? 0);
  const perCourier = ordersPerCourier(state, avgDistance, (1 + 0.60 * batch * q) * wxNext.capacityMult);
  const payEff = state.decisions.courierPay * (1 - 0.20 * batch * q) + wxNext.payPerOrder;
  const expected = perCourier * CONFIG.courierExpectedLoad * payEff;
  const ratio = expected / CONFIG.courierMarketWeeklyPay;
  const capacity = state.decisions.targetCouriers * perCourier;
  const r = last();
  const demand = r ? r.demand : 0;
  const util = capacity > 0 ? demand / capacity : null;

  const hiring = ratio >= CONFIG.courierHireThreshold + 0.35 ? t('opsHiringQueue')
    : ratio >= CONFIG.courierHireThreshold + 0.1 ? t('opsHiringSteady')
    : ratio >= CONFIG.courierHireThreshold ? t('opsHiringTrickle')
    : t('opsHiringNone');

  // Минимальная ставка, при которой вообще пойдут отклики на этом плече доставки
  const minPay = Math.ceil(
    (CONFIG.courierHireThreshold * CONFIG.courierMarketWeeklyPay)
    / (CONFIG.courierExpectedLoad * perCourier * (1 - 0.20 * batch * q)) / 10) * 10;

  const capacityLine = forecastOn
    ? `<div>${t('opsForecastStaff', {
        target: pct(state.decisions.algoParam?.forecast ?? 0.75, 0),
        couriers: num(r?.couriers ?? 0),
      })}</div>`
    : `<div>${t('opsCapacity', {
        couriers: num(state.decisions.targetCouriers),
        capacity: compact(capacity),
      })}${util !== null && demand > 0
        ? t('opsCapacityUtil', {
            demand: compact(demand),
            util: pct(util, 0),
            cls: util > 1 || util < 0.55 ? 'neg' : 'pos',
          })
        : ''}.</div>`;

  el('ops-readout').innerHTML = `<div class="hint-box" style="margin-bottom:12px">
    <div>${t('opsPerCourier', { orders: num(perCourier), km: avgDistance.toFixed(1) })}</div>
    <div>${t('opsEarnings', {
      pay: money(expected), market: money(CONFIG.courierMarketWeeklyPay),
      cls: ratio >= 1 ? 'pos' : 'neg', ratio: ratio.toFixed(2), hiring,
    })}</div>
    ${capacityLine}
    ${batch > 0 ? `<div>${t('opsBatching', { pay: num(payEff) })}</div>` : ''}
    ${(WEATHER[nextType]?.severity ?? 0) > 0
      ? `<div>${t('opsWeatherAhead', {
          weather: weatherName(nextType).toLowerCase(),
          lift: signedPct(wxNext.demandMult - 1, 0),
        })}</div>`
      : ''}
    ${ratio < CONFIG.courierHireThreshold
      ? `<div class="neg">${t('opsMinPay', { pay: num(minPay) })}</div>` : ''}
  </div>`;
}

// ----------------------------------------------------------------------------
// Погода
// ----------------------------------------------------------------------------
function weatherCard(type, when, cls = '') {
  const fx = weatherEffect(type, state.decisions.weatherBonus ?? 0);
  const effects = type === 'clear'
    ? t('weatherNoEffect')
    : t('weatherEffects', {
        demand: signedPct(fx.demandMult - 1, 0),
        capacity: signedPct(fx.capacityMult - 1, 0),
        churn: (fx.churnAdd * 100).toFixed(1),
      });
  return `<div class="${cls}">
    <span class="weather-icon">${WEATHER[type]?.icon ?? '☀️'}</span>
    <span class="weather-body">
      <span class="weather-when">${when}</span>
      <div class="weather-name">${weatherName(type)}</div>
      <div class="weather-fx">${effects}</div>
    </span>
  </div>`;
}

function renderWeather() {
  if (state.over) { el('weather-slot').innerHTML = ''; return; }
  const now = state.weather ?? 'clear';
  const next = state.weatherNext ?? 'clear';
  const nextSeverity = WEATHER[next]?.severity ?? 0;

  const bonus = state.decisions.weatherBonus ?? 0;
  const advice = nextSeverity >= 0.7 && bonus < 30
    ? `<div class="funding-note" style="flex-basis:100%">${t('weatherAdvice')}</div>` : '';

  el('weather-slot').innerHTML = `<div class="panel">
    <h2 class="panel-title">${t('weatherPanel', {
      season: seasonName(seasonOf(state.week + 1)), week: state.week + 1,
    })}</h2>
    <div class="weather">
      ${weatherCard(now, t('weatherNow'), 'weather-now')}
      ${weatherCard(next, t('weatherNext'), `weather-next ${nextSeverity >= 0.7 ? 'alarm' : ''}`)}
      ${advice}
    </div>
  </div>`;
}

// ----------------------------------------------------------------------------
// Алгоритмы: качество, карточки, настройки
// ----------------------------------------------------------------------------
function qualityBar(name, value, hint) {
  return `<div class="quality-row">
    <span class="q-name" title="${hint}">${name}</span>
    <span class="q-bar"><span class="q-fill" style="width:${Math.min(100, value * 100).toFixed(0)}%"></span></span>
    <span class="q-val">${pct(value, 0)}</span>
  </div>`;
}

function renderAlgos() {
  const q = algoQuality(state);
  const head = `<div class="quality-box">
    ${qualityBar(t('algoData'), dataLevel(state), t('algoDataHint'))}
    ${qualityBar(t('algoTeam'), rndLevel(state), t('algoTeamHint'))}
    ${qualityBar(t('algoQuality'), q, t('algoQualityHint'))}
    <div class="funding-note">${t('algoIntro')}</div>
  </div>`;

  const cards = ALGORITHMS.map((a) => {
    const installed = Boolean(state.installed?.[a.key]);
    const unlocked = installed || q >= a.unlock;
    const on = Boolean(state.decisions.algoOn?.[a.key]);
    const raw = (state.decisions.algoParam?.[a.key] ?? a.param.def * (a.param.scale ?? 1)) / (a.param.scale ?? 1);

    const badge = installed
      ? `<span class="badge on">${t('algoInstalled')}</span>`
      : unlocked
        ? `<span class="badge">${t('algoInstallCost', { cost: money(a.install) })}</span>`
        : `<span class="badge">${t('algoNeedQuality', { value: pct(a.unlock, 0) })}</span>`;

    const slider = installed && on ? `<div class="algo-param">
        <div class="algo-param-head"><span>${tx(a.param.label)}</span><b>${raw}${tx(a.param.unit)}</b></div>
        <input type="range" data-algo-param="${a.key}"
          min="${a.param.min}" max="${a.param.max}" step="${a.param.step}" value="${raw}" />
      </div>` : '';

    const pending = on && !installed && unlocked
      ? `<div class="algo-tradeoff">${t('algoPending', { cost: money(a.install) })}</div>` : '';

    return `<div class="algo ${!unlocked ? 'locked' : ''} ${on && installed ? 'on' : ''}">
      <div class="algo-head">
        <label class="algo-title">
          <input type="checkbox" data-algo="${a.key}" ${on ? 'checked' : ''} ${unlocked ? '' : 'disabled'} />
          ${tx(a.name)}
        </label>
        ${badge}
      </div>
      <div class="algo-what">${tx(a.what)}</div>
      ${slider}
      ${installed && on ? `<div class="algo-tradeoff">${tx(a.tradeoff)}</div>` : pending}
    </div>`;
  }).join('');

  el('algos').innerHTML = head + cards;

  el('algos').querySelectorAll('[data-algo]').forEach((box) => {
    box.addEventListener('change', () => {
      state.decisions.algoOn = { ...state.decisions.algoOn, [box.dataset.algo]: box.checked };
      renderAlgos();
      renderOpsReadout();
      renderRightTab();
      save();
    });
  });
  el('algos').querySelectorAll('[data-algo-param]').forEach((input) => {
    input.addEventListener('input', () => {
      const a = algoByKey(input.dataset.algoParam);
      state.decisions.algoParam = {
        ...state.decisions.algoParam,
        [a.key]: Number(input.value) * (a.param.scale ?? 1),
      };
      const head = input.parentElement.querySelector('b');
      if (head) head.textContent = `${input.value}${tx(a.param.unit)}`;
      renderOpsReadout();
      renderRightTab();
      save();
    });
  });
}

// ----------------------------------------------------------------------------
// Районы
// ----------------------------------------------------------------------------
function renderDistricts() {
  const chosen = new Set(state.decisions.districts ?? []);
  el('districts').innerHTML = DISTRICTS.map((d) => {
    const ds = state.districts[d.id];
    const on = chosen.has(d.id);
    const live = ds.active;
    const stats = live
      ? t('districtStatsLive', {
          customers: compact(ds.customers), restaurants: num(ds.restaurants),
          time: num(ds.deliveryTime), reach: pct(ds.customers / d.potential, 1),
        })
      : t('districtStatsIdle', {
          potential: compact(d.potential), aov: num(aovOf(d)), km: d.distanceKm,
        });
    return `<div class="district ${on ? 'active' : ''}" data-id="${d.id}">
      <div class="district-head">
        <span class="district-name">${tx(d.name)}</span>
        <span class="badge ${live ? 'on' : ''}">${live
          ? t('districtLive') : t('districtLaunch', { cost: money(d.launchCost) })}</span>
      </div>
      <div class="district-meta">${stats}</div>
      <div class="district-meta">${tx(d.hint)}</div>
    </div>`;
  }).join('');

  el('districts').querySelectorAll('.district').forEach((node) => {
    node.addEventListener('click', () => {
      const id = node.dataset.id;
      const set = new Set(state.decisions.districts ?? []);
      if (set.has(id)) set.delete(id); else set.add(id);
      state.decisions.districts = [...set];
      renderDistricts();
      renderOpsReadout();
      renderRightTab();
      save();
    });
  });
}

// ----------------------------------------------------------------------------
// Инвестиции
// ----------------------------------------------------------------------------
function renderFunding() {
  const canRaise = state.week >= CONFIG.minWeekForFunding && !state.over;
  const v = valuation(state);
  const rows = CONFIG.fundingOptions.map((amount) => {
    const o = fundingOffer(state, amount);
    return `<div class="funding-row">
      <div>
        <div><b>${money(amount)}</b></div>
        <div class="funding-note">${t('fundingDilution', {
          dilution: pct(o.dilution, 1), equity: pct(o.newEquity, 1),
        })}</div>
      </div>
      <button class="btn small" data-raise="${amount}" ${canRaise ? '' : 'disabled'}>${t('fundingTake')}</button>
    </div>`;
  }).join('');

  el('funding').innerHTML = `
    <div class="funding-note">${t('fundingHead', {
      valuation: money(v), equity: pct(state.equity, 1), raised: money(state.raisedTotal),
    })}</div>
    ${rows}
    <div class="funding-note">
      ${t('fundingNote')}
      ${state.week < CONFIG.minWeekForFunding ? t('fundingLocked', { week: CONFIG.minWeekForFunding }) : ''}
    </div>`;

  el('funding').querySelectorAll('[data-raise]').forEach((b) => {
    b.addEventListener('click', () => {
      const amount = Number(b.dataset.raise);
      const { state: next, offer } = raise(state, amount);
      state = next;
      save();
      renderAll();
      toast(t('fundingDone', { amount: money(amount), dilution: pct(offer.dilution, 1) }));
    });
  });
}

// ----------------------------------------------------------------------------
// Событие недели
// ----------------------------------------------------------------------------
function renderEvent() {
  const ev = state.pendingEvent;
  if (!ev || state.over) { el('event-slot').innerHTML = ''; return; }

  const options = ev.options
    ? `<div class="event-options">${ev.options.map((o, i) => `
        <button class="event-option ${state.pendingChoice === i ? 'selected' : ''}" data-choice="${i}">
          <b>${tx(o.label)}</b><span>${tx(o.detail)}</span>
        </button>`).join('')}</div>`
    : `<div class="funding-note">${t('eventAuto')}</div>`;

  el('event-slot').innerHTML = `<div class="panel event">
    <h3>⚡ ${tx(ev.title)}</h3>
    <p>${tx(ev.text)}</p>
    ${options}
    ${ev.lesson ? `<div class="lesson"><b>${t('eventLesson')}</b> ${tx(ev.lesson)}</div>` : ''}
  </div>`;

  el('event-slot').querySelectorAll('[data-choice]').forEach((b) => {
    b.addEventListener('click', () => {
      state.pendingChoice = Number(b.dataset.choice);
      renderEvent();
      save();
    });
  });
}

// ----------------------------------------------------------------------------
// Отчёт недели + разбор факторов + предупреждения
// ----------------------------------------------------------------------------
function stat(label, value, sub) {
  return `<div class="stat"><div class="s-label">${label}</div>
    <div class="s-value">${value}</div><div class="s-sub">${sub ?? ''}</div></div>`;
}

function buildAlerts(r) {
  const alerts = [];
  const burn = r.opex + r.oneOff - r.contribution;
  const runway = burn > 0 ? state.cash / burn : Infinity;

  if (r.utilization > 1.02) {
    alerts.push(['bad', t('alertShortage', {
      fill: pct(r.fillRate, 0), lost: compact(r.lostOrders), time: num(r.avgDeliveryTime),
    })]);
  } else if (r.utilization < 0.55 && r.couriers > 20) {
    alerts.push(['warn', t('alertIdle', {
      util: pct(r.utilization, 0), cost: num(CONFIG.hqPerCourier),
    })]);
  }
  if (r.applicants < 1 && r.couriers < r.decisions.targetCouriers) {
    const minPay = Math.ceil((CONFIG.courierHireThreshold * CONFIG.courierMarketWeeklyPay)
      / (CONFIG.courierExpectedLoad * Math.max(1, r.perCourier)) / 10) * 10;
    alerts.push(['bad', t('alertNoApplicants', {
      pay: num(r.decisions.courierPay), orders: num(r.perCourier),
      market: money(CONFIG.courierMarketWeeklyPay), minPay: num(minPay),
    })]);
  } else if (r.courierAttractiveness < 1) {
    alerts.push(['warn', t('alertLowPay', {
      earnings: money(r.courierEarnings), market: money(CONFIG.courierMarketWeeklyPay),
      churn: pct(r.courierLeft / Math.max(1, r.couriers + r.courierLeft), 0),
    })]);
  }
  if (r.cmPerOrder < 0) {
    alerts.push(['bad', t('alertNegativeCm', { value: num(r.cmPerOrder) })]);
  } else if (r.cmPerOrder > 0 && r.profit < 0) {
    alerts.push(['warn', t('alertBreakEven', {
      cm: num(r.cmPerOrder), opex: money(r.opex), orders: compact(r.opex / r.cmPerOrder),
    })]);
  }
  if (runway < 8 && state.cash >= 0) {
    alerts.push(['bad', t('alertRunway', { weeks: runway.toFixed(0), burn: money(burn) })]);
  }
  if (r.restaurants < 5 && r.decisions.sales === 0) {
    alerts.push(['bad', t('alertNoRestaurants')]);
  }
  if (r.decisions.marketing === 0 && r.restaurants > 40) {
    alerts.push(['warn', t('alertNoMarketing', {
      decay: pct(CONFIG.awarenessDecay, 0),
      gained: compact(r.newCustomers), lost: compact(r.lostCustomers),
    })]);
  }
  if (r.restaurants < 40 && r.customers > 0) {
    alerts.push(['warn', t('alertFewRestaurants', {
      count: num(r.restaurants), factor: r.avgSelectionFactor.toFixed(2),
    })]);
  }
  if (Number.isFinite(r.ltvCac) && r.ltvCac !== null && r.cac > 0) {
    if (r.ltvCac < 1) alerts.push(['bad', t('alertLtvCacBad', { value: r.ltvCac.toFixed(2) })]);
    else if (r.ltvCac > 3) alerts.push(['good', t('alertLtvCacGood', { value: r.ltvCac.toFixed(2) })]);
  }
  if ((WEATHER[r.weather]?.severity ?? 0) >= 0.7 && r.utilization > 1) {
    alerts.push(['bad', t('alertWeatherCrunch', {
      weather: weatherName(r.weather),
      demand: signedPct(r.weatherDemandMult - 1, 0),
      capacity: signedPct(r.weatherCapacityMult - 1, 0),
    })]);
  }
  if (r.weatherBonusCost > 0) {
    alerts.push(['good', t('alertWeatherBonus', {
      cost: money(r.weatherBonusCost), perOrder: num(r.weatherBonusPerOrder),
    })]);
  }
  const anyAlgoOn = Object.values(r.algoActive ?? {}).some(Boolean);
  if ((r.decisions.rnd ?? 0) > 0 && !anyAlgoOn) {
    alerts.push(['warn', t('alertRndIdle', {
      cost: money(r.decisions.rnd), quality: pct(r.algoQuality, 0),
    })]);
  }
  const ready = ALGORITHMS.filter((a) => !state.installed?.[a.key] && r.algoQuality >= a.unlock);
  if (ready.length) {
    alerts.push(['good', t('alertAlgosReady', {
      names: ready.map((a) => tx(a.name)).join(', '), quality: pct(r.algoQuality, 0),
    })]);
  }
  if (r.profit > 0) alerts.push(['good', t('alertProfit', { value: money(r.profit) })]);
  return alerts;
}

function renderReport() {
  const r = last();
  if (!r) { el('report-slot').innerHTML = renderStartHint(); return; }

  const drivers = explain(prev(), r);
  const maxAbs = Math.max(0.02, ...drivers.map((d) => Math.abs(d.effect)));
  const driversHtml = drivers.length ? `
    <div class="drivers">
      <div class="panel-title">${t('driversTitle', {
        delta: signedPct(r.orders / Math.max(1e-9, prev().orders) - 1),
      })}</div>
      ${drivers.slice(0, 6).map((d) => {
        const w = (Math.abs(d.effect) / maxAbs) * 50;
        const pos = d.effect > 0;
        return `<div class="driver">
          <span class="d-name">${t(d.key)}</span>
          <span class="d-bar">
            <span class="d-fill" style="${pos ? `left:50%;width:${w}%` : `right:50%;width:${w}%`};background:${pos ? 'var(--good)' : 'var(--bad)'}"></span>
          </span>
          <span class="d-val ${pos ? 'pos' : 'neg'}">${signedPct(d.effect)}</span>
        </div>`;
      }).join('')}
    </div>` : '';

  const alerts = buildAlerts(r);
  const alertsHtml = alerts.length
    ? `<div class="alerts">${alerts.map(([k, text]) => `<div class="alert ${k}">${text}</div>`).join('')}</div>`
    : '';

  const ev = r.event ? eventById(r.event.id) : null;
  const eventNote = ev ? `<div class="lesson"><b>${tx(ev.title)}.</b> ${tx(ev.lesson)}</div>` : '';

  const installNote = r.installedNow?.length
    ? `<div class="alert good" style="margin-top:8px">${t('installNote', {
        names: r.installedNow.map((k) => tx(algoByKey(k)?.name)).join(', '),
        cost: money(r.installCost),
      })}</div>` : '';
  const launchNote = r.launched.length
    ? `<div class="alert warn" style="margin-top:8px">${t('launchNote', {
        names: r.launched.map((id) => tx(districtById(id)?.name)).join(', '),
        cost: money(r.launchCost),
      })}</div>` : '';

  el('report-slot').innerHTML = `<div class="panel">
    <div class="report-head">
      <h3>${t('reportTitle', { week: r.week })}</h3>
      <span class="funding-note">${t('reportHeadStats', {
        gmv: money(r.gmv), revenue: money(r.netRevenue),
        take: pct(r.netRevenue / Math.max(1, r.gmv)),
      })}</span>
    </div>
    <div class="report-grid">
      ${stat(t('statOrders'), compact(r.orders),
        t('statOrdersSub', { demand: compact(r.demand), lost: compact(r.lostOrders) }))}
      ${stat(t('statCustomers'), compact(r.customers),
        `+${compact(r.newCustomers)} / −${compact(r.lostCustomers)}`)}
      ${stat(t('statCouriers'), num(r.couriers),
        t('statCouriersSub', { hires: num(r.hires), left: num(r.courierLeft), perCourier: num(r.perCourier) }))}
      ${stat(t('statRestaurants'), num(r.restaurants),
        t('statRestaurantsSub', { value: r.avgSelectionFactor.toFixed(2) }))}
      ${stat(t('statDeliveryTime'), t('minutes', { value: num(r.avgDeliveryTime) }),
        t('kpiUtil', { value: pct(r.utilization, 0) }))}
      ${stat(t('statWeather'), `${WEATHER[r.weather]?.icon ?? ''} ${weatherName(r.weather)}`,
        r.weather === 'clear' ? t('statWeatherNone')
          : t('statWeatherSub', {
              demand: signedPct(r.weatherDemandMult - 1, 0),
              capacity: signedPct(r.weatherCapacityMult - 1, 0),
            }))}
      ${stat(t('statCm'), `${num(r.cmPerOrder)} ₽`,
        t('statCmSub', { value: pct(r.cmPerOrder / Math.max(1, r.gmv / Math.max(1, r.orders))) }))}
      ${stat(t('statProfit'), money(r.profit), t('statProfitSub', { value: money(r.opex) }))}
      ${stat(t('statCacLtv'), r.cac > 0 ? `${num(r.cac)} ₽` : '—',
        r.ltvCac ? `LTV/CAC ${r.ltvCac.toFixed(2)}` : t('statCacOff'))}
    </div>
    ${installNote}
    ${launchNote}
    ${driversHtml}
    ${alertsHtml}
    ${eventNote}
  </div>`;
}

function modal(html, actions = []) {
  const root = el('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}
    <div class="modal-actions">${actions.map((a, i) => `<button class="btn ${a.primary ? 'primary' : 'ghost'}" data-act="${i}">${a.label}</button>`).join('')}</div>
  </div></div>`;
  root.querySelectorAll('[data-act]').forEach((b) => {
    b.addEventListener('click', () => {
      const a = actions[Number(b.dataset.act)];
      root.innerHTML = '';
      a.onClick?.();
    });
  });
}

function toast(text) {
  const root = el('modal-root');
  const node = document.createElement('div');
  node.className = 'alert good';
  node.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:60;max-width:340px;background:#0f2018';
  node.textContent = text;
  root.appendChild(node);
  setTimeout(() => node.remove(), 3500);
}

function showGameOver() {
  const s = finalScore(state);
  const r = last();
  const grade = s.bankrupt ? t('gradeBankrupt')
    : s.equityValue > 3e9 ? t('gradeExcellent')
    : s.equityValue > 1e9 ? t('gradeSolid')
    : s.equityValue > 3e8 ? t('gradeSurvived') : t('gradeModest');

  modal(`
    <h2>${s.bankrupt ? t('gameOverBankrupt') : t('gameOverFinished')}</h2>
    <p class="funding-note">${s.bankrupt
      ? t('gameOverBankruptText', { week: s.weeks }) : t('gameOverFinishedText')}</p>
    <div class="score-grid">
      <div class="stat"><div class="s-label">${t('scoreValuation')}</div><div class="s-value">${money(s.valuation)}</div></div>
      <div class="stat"><div class="s-label">${t('scoreStake')}</div><div class="s-value">${pct(s.equity, 1)}</div></div>
      <div class="stat"><div class="s-label">${t('scoreResult')}</div><div class="s-value">${money(s.equityValue)}</div></div>
      <div class="stat"><div class="s-label">${t('scoreRaised')}</div><div class="s-value">${money(s.raised)}</div></div>
      <div class="stat"><div class="s-label">${t('scoreCash')}</div><div class="s-value">${money(s.cash)}</div></div>
      <div class="stat"><div class="s-label">${t('scoreGrade')}</div><div class="s-value">${grade}</div></div>
    </div>
    ${r ? `<p class="funding-note">${t('gameOverLastWeek', {
      orders: compact(r.orders), cm: num(r.cmPerOrder), profit: money(r.profit),
      share: pct(r.marketShare), time: num(r.avgDeliveryTime),
    })}</p>` : ''}
    <div class="hint-box" style="margin-top:10px">${t('gameOverQuestions')}</div>
  `, [
    { label: t('gameOverPlayAgain'), primary: true, onClick: () => restart() },
    { label: t('gameOverCharts'), onClick: () => {} },
  ]);
}

function showHelp() {
  modal(`<h2>${t('helpModalTitle')}</h2>${renderHelpTab()}`, [{ label: t('helpModalOk'), primary: true }]);
}

// ----------------------------------------------------------------------------
// Ход игры
// ----------------------------------------------------------------------------
function nextWeek() {
  if (state.over) { showGameOver(); return; }
  const ev = state.pendingEvent;
  if (ev && ev.options && state.pendingChoice === null) {
    toast(t('eventChoiceNeeded'));
    return;
  }
  const { state: next } = step(state, { decisions: state.decisions, eventChoice: state.pendingChoice ?? 0 });
  state = next;
  save();
  renderAll();
  if (state.over) showGameOver();
}

function restart() {
  const seed = `novograd-${Math.floor(Math.random() * 1e6)}`;
  state = createInitialState(seed);
  save();
  renderAll();
}

// Статические подписи разметки
function renderChrome() {
  el('brand-title').textContent = t('brandTitle');
  el('brand-sub').textContent = t('brandSub');
  el('title-levers').textContent = t('panelLevers');
  el('title-algos').textContent = t('panelAlgos');
  el('title-coverage').textContent = t('panelCoverage');
  el('title-funding').textContent = t('panelFunding');
  el('title-dynamics').textContent = t('panelDynamics');
  el('btn-restart').textContent = t('btnRestart');
  el('btn-help').title = t('btnHelpTitle');
  el('btn-lang').textContent = t('langToggle');
  el('btn-lang').title = t('langTitle');
  el('btn-next').textContent = state.over
    ? t('btnResults') : t('btnNext', { week: state.week + 1 });
  for (const [tab, key] of Object.entries({
    unit: 'tabUnit', pnl: 'tabPnl', algos: 'tabAlgos', districts: 'tabDistricts', help: 'tabHelp',
  })) {
    const node = el('tabs').querySelector(`[data-tab="${tab}"]`);
    if (node) node.textContent = t(key);
  }
}

function renderAll() {
  if (!leversBuilt) buildLevers();
  renderChrome();
  syncLevers();
  renderAlgos();
  renderOpsReadout();
  renderKpis();
  renderDistricts();
  renderFunding();
  renderWeather();
  renderEvent();
  renderReport();
  renderChart();
  renderRightTab();
}

function switchLang() {
  setLang(getLang() === 'ru' ? 'en' : 'ru');
  leversBuilt = false;   // подписи рычагов меняются вместе с языком
  renderAll();
}

function init() {
  setStrings(STRINGS);
  setLang(detectLang());
  state = load() ?? createInitialState('novograd');

  el('btn-next').addEventListener('click', nextWeek);
  el('btn-help').addEventListener('click', showHelp);
  el('btn-lang').addEventListener('click', switchLang);
  el('btn-restart').addEventListener('click', () => {
    modal(`<h2>${t('restartTitle')}</h2><p class="funding-note">${t('restartText')}</p>`,
      [{ label: t('restartYes'), primary: true, onClick: restart }, { label: t('restartNo') }]);
  });
  el('tabs').querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => { rightTab = tab.dataset.tab; renderRightTab(); });
  });
  window.addEventListener('resize', () => renderChart());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.repeat && document.activeElement?.tagName !== 'BUTTON') nextWeek();
  });

  renderAll();
}


init();
})();
</script>
</body>
</html>
