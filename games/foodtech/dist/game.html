<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>НОВОЕДА · food delivery economics simulator</title>
  <style>
:root {
  --bg: #0b1120;
  --panel: #111a2e;
  --panel-2: #16213a;
  --line: rgba(148, 163, 184, 0.16);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #4ade80;
  --accent-2: #60a5fa;
  --warn: #fbbf24;
  --bad: #f87171;
  --good: #4ade80;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: radial-gradient(1200px 600px at 20% -10%, #16233d 0%, var(--bg) 55%);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  min-height: 100%;
}

button { font-family: inherit; }

/* ------------------------------- Шапка ---------------------------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(11, 17, 32, 0.9);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 26px; }
.brand-title { font-weight: 800; letter-spacing: 0.14em; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 11px; }

.kpis { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px 10px;
  min-width: 96px;
}
.kpi .k-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.kpi .k-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.kpi .k-delta { font-size: 10px; font-variant-numeric: tabular-nums; }
.up { color: var(--good); }
.down { color: var(--bad); }
.neutral { color: var(--muted); }

.topbar-actions { display: flex; gap: 8px; }

.btn {
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.15s;
}
.btn:hover { border-color: rgba(148, 163, 184, 0.4); }
.btn.primary { background: linear-gradient(180deg, #22c55e, #16a34a); border-color: #16a34a; color: #04240f; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 9px; font-size: 12px; font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ------------------------------- Сетка ---------------------------------- */
.layout {
  display: grid;
  grid-template-columns: 340px minmax(420px, 1fr) 360px;
  gap: 14px;
  padding: 14px;
  align-items: start;
}
/* На средних экранах правая колонка уходит под центральную, но остаётся во
   ВТОРОЙ колонке. Растягивать её на всю ширину нельзя: липкая левая колонка
   не ограничена своей строкой грида и накрывала бы её левый край. */
@media (max-width: 1400px) {
  .layout { grid-template-columns: 320px minmax(0, 1fr); }
  .col-right { grid-column: 2; }
}
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col-right { grid-column: auto; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.col-center { display: flex; flex-direction: column; gap: 14px; }
.col-left { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 74px; }
.col-right { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 74px; }
@media (max-width: 1400px) { .col-right { position: static; max-height: none; } }
@media (max-width: 980px) { .col-left { position: static; max-height: none; } }

.panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 4px 0 10px;
  font-weight: 700;
}
.panel-title.inline { margin: 0; }

/* ------------------------------- Рычаги --------------------------------- */
.lever { margin-bottom: 14px; }
.lever-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lever-label { font-weight: 600; font-size: 13px; }
.lever-value { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 700; font-size: 13px; }
.lever input[type="range"] { width: 100%; margin: 6px 0 2px; accent-color: var(--accent); }
.lever-tip { color: var(--muted); font-size: 11px; line-height: 1.4; display: none; }
.lever.open .lever-tip { display: block; }
.lever-why {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 11px; padding: 0; text-decoration: underline dotted;
}

/* ------------------------------- Районы --------------------------------- */
.districts { display: flex; flex-direction: column; gap: 8px; }
.district {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  background: var(--panel-2);
  cursor: pointer;
  transition: 0.15s;
}
.district:hover { border-color: rgba(148, 163, 184, 0.35); }
.district.active { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.07); }
.district-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.district-name { font-weight: 700; font-size: 13px; }
.district-meta { color: var(--muted); font-size: 11px; margin-top: 3px; line-height: 1.45; }
.badge {
  font-size: 10px; padding: 2px 6px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.badge.on { color: var(--good); border-color: rgba(74, 222, 128, 0.4); }

/* ------------------------------ Инвестиции ------------------------------ */
.funding { display: flex; flex-direction: column; gap: 8px; }
.funding-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2);
}
.funding-note { color: var(--muted); font-size: 11px; line-height: 1.45; }

/* ------------------------------- Событие -------------------------------- */
.event {
  border-left: 3px solid var(--warn);
  background: linear-gradient(90deg, rgba(251, 191, 36, 0.09), transparent 60%);
}
.event h3 { margin: 0 0 6px; font-size: 15px; }
.event p { margin: 0 0 10px; color: #cbd5e1; line-height: 1.5; }
.event-options { display: flex; gap: 8px; flex-wrap: wrap; }
.event-option {
  flex: 1 1 200px; text-align: left; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 11px; background: var(--panel-2); cursor: pointer; color: var(--text);
}
.event-option:hover { border-color: var(--warn); }
.event-option.selected { border-color: var(--warn); background: rgba(251, 191, 36, 0.12); }
.event-option b { display: block; margin-bottom: 3px; font-size: 13px; }
.event-option span { color: var(--muted); font-size: 11px; }
.lesson {
  margin-top: 10px; font-size: 11px; color: var(--muted);
  border-top: 1px dashed var(--line); padding-top: 8px;
}
.lesson b { color: var(--warn); }

/* ------------------------------- Отчёт ---------------------------------- */
.report-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.report-head h3 { margin: 0; font-size: 15px; }
.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat .s-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat .s-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .s-sub { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

.drivers { margin-top: 12px; }
.driver { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
.driver .d-name { width: 150px; color: var(--muted); flex-shrink: 0; }
.driver .d-bar { flex: 1; height: 8px; background: rgba(148, 163, 184, 0.1); border-radius: 4px; position: relative; }
.driver .d-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.driver .d-val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

.alerts { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.alert { font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); line-height: 1.45; }
.alert.bad { border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.08); }
.alert.warn { border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.08); }
.alert.good { border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.08); }

/* ------------------------------- Графики -------------------------------- */
.charts-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chart-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.chart-tabs button {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.chart-tabs button.active { color: var(--text); border-color: var(--accent-2); background: rgba(96, 165, 250, 0.12); }
#chart { width: 100%; height: 230px; margin-top: 6px; }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-item i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.chart-caption { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.45; }

/* -------------------------------- Табы ---------------------------------- */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer;
}
.tab.active { color: var(--text); border-color: var(--accent); background: rgba(74, 222, 128, 0.1); }
.tab-content { font-size: 12px; line-height: 1.5; }

table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
table.data tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
table.data tr.sub td:first-child { padding-left: 16px; color: var(--muted); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.help h4 { margin: 14px 0 6px; font-size: 13px; }
.help p, .help li { color: #cbd5e1; }
.help ul { padding-left: 18px; margin: 6px 0; }
.help code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
.formula {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; margin: 6px 0; font-family: ui-monospace, monospace; font-size: 11px; color: #cbd5e1;
  overflow-x: auto; white-space: pre-wrap;
}

/* ------------------------------- Модалка -------------------------------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(2, 6, 16, 0.8);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; max-width: 620px; width: 100%; max-height: 86vh; overflow-y: auto;
}
.modal h2 { margin: 0 0 10px; font-size: 20px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 14px 0; }
.hint-box {
  border: 1px dashed rgba(96, 165, 250, 0.45); background: rgba(96, 165, 250, 0.07);
  border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #cbd5e1;
}
.hint-box b { color: var(--accent-2); }

/* ------------------------------ Алгоритмы ------------------------------- */
.quality-box { margin-bottom: 10px; }
.quality-row { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px; }
.quality-row .q-name { width: 74px; color: var(--muted); flex-shrink: 0; }
.quality-row .q-bar { flex: 1; height: 6px; background: rgba(148, 163, 184, 0.12); border-radius: 3px; overflow: hidden; }
.quality-row .q-fill { height: 100%; border-radius: 3px; background: var(--accent-2); }
.quality-row .q-val { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

.algo {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
  background: var(--panel-2); margin-bottom: 8px;
}
.algo.locked { opacity: 0.5; }
.algo.on { border-color: rgba(96, 165, 250, 0.5); background: rgba(96, 165, 250, 0.07); }
.algo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.algo-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; cursor: pointer; }
.algo-title input { accent-color: var(--accent-2); cursor: pointer; }
.algo-what { color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 4px; }
.algo-tradeoff { color: #cbd5e1; font-size: 11px; line-height: 1.45; margin-top: 5px;
  border-left: 2px solid rgba(251, 191, 36, 0.5); padding-left: 7px; }
.algo-param { margin-top: 7px; }
.algo-param input[type="range"] { width: 100%; accent-color: var(--accent-2); margin: 3px 0 0; }
.algo-param-head { display: flex; justify-content: space-between; font-size: 11px; }
.algo-param-head b { color: var(--accent-2); font-variant-numeric: tabular-nums; }

/* ------------------------------- Погода --------------------------------- */
.weather { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.weather-now, .weather-next {
  flex: 1 1 220px; display: flex; gap: 10px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--panel-2);
}
.weather-next.alarm { border-color: rgba(251, 191, 36, 0.55); background: rgba(251, 191, 36, 0.09); }
.weather-icon { font-size: 26px; line-height: 1; }
.weather-body { min-width: 0; }
.weather-when { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.weather-name { font-weight: 700; font-size: 14px; }
.weather-fx { color: var(--muted); font-size: 11px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.weather-fx b.up { color: var(--good); }
.weather-fx b.down { color: var(--bad); }

/* ---------------- Конкурент, цели совета, кризис (КИНОПОТОК) ------------- */
.rival-head {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: flex-start;
  margin-bottom: 10px;
}
.rival-stance { flex: 1 1 220px; }
.rival-stance-hint { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 5px; }
.rival-facts { flex: 1 1 260px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.rival-facts b { color: var(--text); }

.share-bar {
  display: flex;
  height: 22px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 700;
}
.share-bar span {
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  transition: width 0.35s ease;
}
.share-you { background: rgba(74, 222, 128, 0.30); color: var(--good); }
.share-them { background: rgba(248, 113, 113, 0.20); color: var(--bad); flex: 1; }

.goal-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent-2);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.goal-card.done { border-left-color: var(--good); }
.goal-card.urgent { border-left-color: var(--warn); }
.goal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal-year { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.goal-left { color: var(--muted); font-size: 11px; }
.goal-line { margin: 6px 0 8px; line-height: 1.5; font-size: 13px; }
.goal-card .q-bar { display: block; margin-bottom: 6px; }
.q-fill.ok { background: var(--good); }
.goal-past { font-size: 11px; padding: 3px 0; color: var(--muted); }
.goal-past.pos { color: var(--good); }
.goal-past.neg { color: var(--bad); }

.event-card.crisis { border-left: 3px solid var(--bad); }
.event-card.crisis h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.event-option.chosen { border-color: var(--accent); background: rgba(74, 222, 128, 0.12); }

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛵</span>
      <div>
        <div class="brand-title" id="brand-title"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="topbar-actions">
      <button id="btn-lang" class="btn ghost"></button>
      <button id="btn-help" class="btn ghost">?</button>
      <button id="btn-restart" class="btn ghost"></button>
      <button id="btn-next" class="btn primary"></button>
    </div>
  </header>

  <main class="layout">
    <!-- ЛЕВАЯ КОЛОНКА: рычаги -->
    <aside class="panel col-left">
      <h2 class="panel-title" id="title-levers"></h2>
      <div id="levers"></div>
      <div id="ops-readout"></div>

      <h2 class="panel-title" id="title-algos"></h2>
      <div id="algos"></div>

      <h2 class="panel-title" id="title-coverage"></h2>
      <div id="districts" class="districts"></div>

      <h2 class="panel-title" id="title-funding"></h2>
      <div id="funding" class="funding"></div>
    </aside>

    <!-- ЦЕНТР: события, разбор недели, графики -->
    <section class="col-center">
      <div id="weather-slot"></div>
      <div id="event-slot"></div>
      <div id="report-slot"></div>
      <div class="panel charts">
        <div class="charts-head">
          <h2 class="panel-title inline" id="title-dynamics"></h2>
          <div class="chart-tabs" id="chart-tabs"></div>
        </div>
        <div class="chart-legend" id="chart-legend"></div>
        <canvas id="chart" height="230"></canvas>
        <div class="chart-caption" id="chart-caption"></div>
      </div>
    </section>

    <!-- ПРАВАЯ КОЛОНКА: аналитика -->
    <aside class="panel col-right">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="unit"></button>
        <button class="tab" data-tab="pnl"></button>
        <button class="tab" data-tab="algos"></button>
        <button class="tab" data-tab="districts"></button>
        <button class="tab" data-tab="help"></button>
      </div>
      <div id="tab-content" class="tab-content"></div>
    </aside>
  </main>

  <div id="modal-root"></div>

  <script>
(function () {
'use strict';
// ===== ../../shared/i18n.js ========================================
// ============================================================================
// Ядро локализации, общее для всех игр. Два языка: ru (по умолчанию) и en.
//
// Словарь строк живёт в самой игре (games/<игра>/src/strings.js) и передаётся
// сюда через setStrings(). Строки хранятся парами { ru, en } рядом друг с
// другом — так переводчик видит оригинал и перевод вместе, и невозможно
// потерять одну из версий незаметно.
//
// t(key, vars) — строка интерфейса с подстановкой {переменных}.
// tx(obj)      — двуязычное поле из модели (район, рычаг, событие, алгоритм).
// ============================================================================

const LANGS = ['ru', 'en'];
const STORAGE_KEY = 'game-lang';

let current = 'ru';
let dictionary = {};

// Игра регистрирует свой словарь при старте
function setStrings(dict) {
  dictionary = dict ?? {};
}

function getStrings() {
  return dictionary;
}

function getLang() {
  return current;
}

function setLang(lang) {
  if (!LANGS.includes(lang)) return;
  current = lang;
  try { localStorage.setItem(STORAGE_KEY, lang); } catch { /* приватный режим */ }
  if (typeof document !== 'undefined') document.documentElement.lang = lang;
}

function detectLang() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch { /* приватный режим */ }
  if (typeof navigator !== 'undefined' && !/^ru\b/i.test(navigator.language ?? '')) return 'en';
  return 'ru';
}

// Двуязычное поле модели: { ru: '…', en: '…' }
function tx(field) {
  if (field == null) return '';
  if (typeof field === 'string') return field;
  return field[current] ?? field.ru ?? '';
}

function t(key, vars) {
  const entry = dictionary[key];
  if (!entry) return key;
  let out = entry[current] ?? entry.ru ?? key;
  if (vars) {
    for (const [name, value] of Object.entries(vars)) {
      out = out.replaceAll(`{${name}}`, String(value));
    }
  }
  return out;
}

  // --- алгоритмы (вкладка) ---
  algosTabQuality: { ru: 'Качество алгоритмов: <b>{quality}</b> (данные {data} × команда {team}). Оно определяет и точность каждого алгоритма, и то, какие из них вообще доступны.', en: 'Algorithm quality: <b>{quality}</b> (data {data} × team {team}). It sets both the accuracy of each algorithm and which ones are available at all.' },
  algosColName: { ru: 'Алгоритм', en: 'Algorithm' },
  algosColProfit: { ru: '₽ / нед', en: '₽ / wk' },
  algosTotal: { ru: 'Итого от алгоритмов', en: 'Total from algorithms' },
  algosTeamCost: { ru: 'Стоимость команды', en: 'Cost of the team' },
  algosNet: { ru: 'Чистый эффект', en: 'Net effect' },
  algosCounterfactual: { ru: 'Каждая строка — честный контрфактический расчёт: прошлая неделя пересчитана заново с выключенным алгоритмом, и разница показана здесь. В реальной компании такой ответ стоит нескольких недель A/B-теста.', en: 'Every row is an honest counterfactual: last week was re-simulated with that algorithm switched off, and the difference is shown here. In a real company this answer costs weeks of A/B testing.' },
  algosNone: { ru: 'Ни один алгоритм не включён — сравнивать нечего. Начните с бюджета на Data Science: качество алгоритмов растёт как √(данные × команда), а данные копятся только от выполненных заказов.', en: 'No algorithm is switched on, so there is nothing to compare. Start with a data science budget: quality grows as √(data × team), and data only accumulates from completed orders.' },
  algosZeroNote: { ru: '{names} сейчас ничего не меняет. Это не поломка: surge включается только при загрузке выше 70%, аллокация — только когда мощности не хватает, а прогноз бесполезен, если вы и так угадываете штат. Алгоритм стоит денег ровно столько же, работает он или нет.', en: '{names} currently changes nothing. That is not a bug: surge only engages above 70% utilisation, allocation only matters when capacity is short, and forecasting is useless if you already size the team correctly. The algorithm costs the same either way.' },
  algosVsSlider: { ru: 'Чем алгоритм отличается от ползунка', en: 'How an algorithm differs from a slider' },
  algosVsSliderText: { ru: 'Обычный рычаг задаёт <b>число</b>: цена доставки 149 ₽ для всех и всегда. Алгоритм задаёт <b>правило</b>: цена = f(загрузка), скидка = f(клиент), курьеры = f(прогноз). Правило умеет то, чего не умеет число, — быть разным в разных обстоятельствах. Именно поэтому оптимизация второго порядка способна улучшить сразу оба конца компромисса, который для одного числа неразрешим.', en: 'An ordinary lever sets a <b>number</b>: a delivery fee of ₽149 for everyone, always. An algorithm sets a <b>rule</b>: price = f(utilisation), discount = f(customer), couriers = f(forecast). A rule can do what a number cannot — be different in different circumstances. That is why second-order optimisation can improve both ends of a trade-off that a single number cannot resolve.' },

  // --- справка ---
  helpWhatTitle: { ru: 'Что это такое', en: 'What this is' },
  helpWhatText: { ru: 'Вы — операционный директор сервиса доставки еды в городе на 1,4 млн человек. Один ход = одна неделя. Цель за год (52 недели) — построить бизнес, который стоит дорого <i>и</i> в котором вам всё ещё принадлежит большая доля.', en: 'You are the COO of a food delivery service in a city of 1.4 million. One turn is one week. Over a year (52 weeks) your goal is a business that is worth a lot <i>and</i> in which you still own a large share.' },
  helpDemandTitle: { ru: 'Как считается спрос', en: 'How demand is calculated' },
  helpDemandFormula: {
    ru: `заказы = клиенты × частота
частота = базовая × Цена × √Скорость × √Выбор × сезон × погода
Цена   = (эталонная цена / ваша цена) ^ эластичность района
Скорость = (35 мин / ваше время) ^ 0.6
Выбор  = насыщение по числу подключённых ресторанов`,
    en: `orders = customers × frequency
frequency = base × Price × √Speed × √Selection × season × weather
Price  = (reference price / your price) ^ district elasticity
Speed  = (35 min / your time) ^ 0.6
Selection = saturation curve over connected restaurants`,
  },
  helpDemandText: { ru: 'Клиенты — это <b>запас</b>: он пополняется пробными заказами (их даёт узнаваемость от маркетинга) и убывает от оттока (его определяет удовлетворённость).', en: 'Customers are a <b>stock</b>: it is filled by trial orders (driven by awareness from marketing) and drained by churn (driven by satisfaction).' },
  helpSupplyTitle: { ru: 'Как считается предложение', en: 'How supply is calculated' },
  helpSupplyFormula: {
    ru: `пропускная способность = курьеры × заказов на курьера
заказов на курьера ≈ 105 × (1 + 0.35 × технологии) × (3.5 км / плечо) ^ 0.45 × погода
загрузка = спрос / пропускная способность
время доставки = базовое × (1 + 0.85 × загрузка³)`,
    en: `capacity = couriers × orders per courier
orders per courier ≈ 105 × (1 + 0.35 × tech) × (3.5 km / leg) ^ 0.45 × weather
utilisation = demand / capacity
delivery time = base × (1 + 0.85 × utilisation³)`,
  },
  helpSupplyText: { ru: 'Куб в формуле — это очередь: при загрузке 100% время доставки почти удваивается. Это главная нелинейность игры и главная причина, по которой доставка ломается внезапно, а не постепенно.', en: 'The cube is a queue: at 100% utilisation delivery time nearly doubles. This is the key non-linearity in the game and the reason delivery breaks suddenly rather than gradually.' },
  helpWeatherTitle: { ru: 'Погода', en: 'Weather' },
  helpWeatherText: { ru: 'Погода действует каждую неделю и разыгрывается по сезону: гололёд бывает только зимой, жара — только летом. Она всегда бьёт с двух сторон: поднимает спрос и режет мощность курьеров. В шторм загрузка растёт сразу в 1.6 раза. Прогноз на следующую неделю публичен — но курьеры, нанятые сегодня, выходят на линию именно на ней, поэтому прогноз надо не читать, а отрабатывать.', en: 'Weather applies every week and is drawn by season: ice only in winter, heat only in summer. It always hits from both sides — lifting demand and cutting courier capacity. In a storm utilisation jumps by a factor of 1.6. Next week’s forecast is public, but the couriers you hire today go out exactly then, so the forecast is something to act on, not to read.' },
  helpSpiralsTitle: { ru: 'Обратные связи, которые вас погубят', en: 'The feedback loops that will kill you' },
  helpSpiralSpeed: { ru: '<b>Спираль скорости.</b> Мало курьеров → долгая доставка → недовольство → отток клиентов → падение выручки → нечем платить курьерам.', en: '<b>The speed spiral.</b> Too few couriers → slow delivery → dissatisfaction → customer churn → falling revenue → no money to pay couriers.' },
  helpSpiralPromo: { ru: '<b>Спираль промо.</b> Скидка → рост заказов → отрицательный вклад → сжигание кассы → отмена скидки → обвал спроса.', en: '<b>The promo spiral.</b> Discount → more orders → negative contribution → cash burn → discount cancelled → demand collapses.' },
  helpSpiralCommission: { ru: '<b>Спираль комиссии.</b> Подняли комиссию → рестораны уходят → падает выбор → падает спрос → падает выручка с ресторана → уходят ещё.', en: '<b>The commission spiral.</b> Raise commission → restaurants leave → selection shrinks → demand falls → revenue per restaurant falls → more of them leave.' },
  helpSpiralPay: { ru: '<b>Спираль зарплаты.</b> Срезали ставку курьеру → отток курьеров → рост загрузки оставшихся → выгорание → ещё больший отток.', en: '<b>The pay spiral.</b> Cut courier pay → couriers leave → those left are overloaded → burnout → even more leave.' },
  helpWatchTitle: { ru: 'На что смотреть каждую неделю', en: 'What to watch every week' },
  helpWatchCm: { ru: '<b>Вклад с заказа</b> — положителен ли он вообще.', en: '<b>Contribution per order</b> — is it positive at all.' },
  helpWatchUtil: { ru: '<b>Загрузка курьеров</b> — выше 90% сроки ломаются лавиной, ниже 60% вы платите за простой.', en: '<b>Courier utilisation</b> — above 90% delivery times break in an avalanche, below 60% you pay for idleness.' },
  helpWatchLtv: { ru: '<b>LTV/CAC</b> — есть ли смысл покупать ещё клиентов.', en: '<b>LTV/CAC</b> — whether buying more customers makes sense.' },
  helpWatchRunway: { ru: '<b>Запас кассы</b> в неделях — сколько у вас осталось времени на ошибки.', en: '<b>Cash runway</b> in weeks — how much time you have left for mistakes.' },
  helpAlgosTitle: { ru: 'Оптимизации второго порядка', en: 'Second-order optimisation' },
  helpAlgosText: { ru: 'Ползунки задают <b>числа</b>. Алгоритмы задают <b>правила</b>: цена = f(загрузка), скидка = f(клиент), штат = f(прогноз). Правило умеет быть разным в разных обстоятельствах — поэтому способно улучшить сразу оба конца компромисса, неразрешимого для одного числа.', en: 'Sliders set <b>numbers</b>. Algorithms set <b>rules</b>: price = f(utilisation), discount = f(customer), headcount = f(forecast). A rule can be different in different circumstances, which is why it can improve both ends of a trade-off a single number cannot resolve.' },
  helpAlgosFormula: {
    ru: `качество алгоритмов = √(данные × команда)
данные  = накопленные заказы / (заказы + 400 000)
команда = вложения в Data Science / (вложения + 25 млн ₽)`,
    en: `algorithm quality = √(data × team)
data = cumulative orders / (orders + 400,000)
team = data science spend / (spend + ₽25M)`,
  },
  helpAlgosOrder: { ru: 'Ни данные, ни команда по отдельности не работают. Отсюда естественный порядок: сначала объём, потом алгоритмы. Data Science, купленный до того, как появились заказы, — просто строка расходов.', en: 'Neither data nor team works alone. Hence the natural order: volume first, algorithms second. Data science bought before the orders exist is simply a cost line.' },
  helpAlgosCheck: { ru: 'Проверяйте вкладку «Алгоритмы»: там каждая неделя пересчитана заново с выключенным алгоритмом, и видно, сколько он принёс на самом деле. Часто ответ — ноль.', en: 'Check the Algorithms tab: each week is re-simulated with the algorithm switched off, showing what it actually earned. Often the answer is zero.' },
  helpScoreTitle: { ru: 'Как считается финальный счёт', en: 'How the final score works' },
  helpScoreFormula: {
    ru: `оценка = годовая выручка × мультипликатор
мультипликатор растёт от темпа роста и рентабельности
счёт = оценка × ваша доля`,
    en: `valuation = annual revenue × multiple
the multiple grows with growth rate and margin
score = valuation × your stake`,
  },

// ===== ../../shared/rng.js =========================================
// Детерминированный генератор псевдослучайных чисел (mulberry32).
// Нужен, чтобы одна и та же игра с одним и тем же seed воспроизводилась точно:
// это важно и для тестов, и для учебных сценариев («у всей группы одинаковый город»).

function hashSeed(str) {
  const s = String(str);
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}

function createRng(seed) {
  let a = typeof seed === 'number' ? seed >>> 0 : hashSeed(seed);
  const rng = () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.state = () => a >>> 0;
  rng.restore = (s) => { a = s >>> 0; };
  return rng;
}

// Случайное число из диапазона
function between(rng, min, max) {
  return min + rng() * (max - min);
}

// Выбор элемента с весами: items = [{weight, ...}]
function weightedPick(rng, items) {
  const total = items.reduce((s, i) => s + (i.weight ?? 1), 0);
  if (total <= 0) return null;
  let r = rng() * total;
  for (const item of items) {
    r -= item.weight ?? 1;
    if (r <= 0) return item;
  }
  return items[items.length - 1];
}

// ============================================================================
// Погода — постоянно действующий фактор, а не редкое событие.
//
// Каждая неделя имеет свой тип погоды, разыгрываемый по сезонной таблице.
// Погода бьёт с двух сторон одновременно: поднимает спрос (никто не хочет
// выходить из дома) и режет пропускную способность (курьеры едут медленнее).
// Именно это сочетание ломает сроки доставки в реальных сервисах.
//
// Прогноз на следующую неделю публичен — метеосводка доступна всем. Ценность
// не в информации, а в реакции: успеть нанять курьеров и поднять надбавку.
// ============================================================================


// severity — насколько погода «плохая» (0 = ясно, 1 = максимум).
// От неё зависит и размер надбавки курьеру, и то, как сильно она помогает.
const WEATHER = {
  clear:  { id: 'clear',  icon: '☀️', demand: 1.00, capacity: 1.00, churn: 0,    severity: 0 },
  rain:   { id: 'rain',   icon: '🌧️', demand: 1.16, capacity: 0.92, churn: 0.04, severity: 0.45 },
  storm:  { id: 'storm',  icon: '⛈️', demand: 1.30, capacity: 0.80, churn: 0.12, severity: 1.00 },
  heat:   { id: 'heat',   icon: '🔥', demand: 1.04, capacity: 0.86, churn: 0.10, severity: 0.70 },
  snow:   { id: 'snow',   icon: '🌨️', demand: 1.22, capacity: 0.82, churn: 0.09, severity: 0.80 },
  ice:    { id: 'ice',    icon: '🧊', demand: 1.10, capacity: 0.74, churn: 0.16, severity: 1.00 },
  frost:  { id: 'frost',  icon: '❄️', demand: 1.14, capacity: 0.88, churn: 0.07, severity: 0.60 },
};

// Неделя 1 — начало января, дальше по календарю
function seasonOf(week) {
  const w = ((Math.max(1, week) - 1) % 52) + 1;
  if (w <= 8 || w >= 49) return 'winter';
  if (w <= 21) return 'spring';
  if (w <= 34) return 'summer';
  return 'autumn';
}

// Сезонные вероятности. Гололёд бывает только зимой, жара — только летом.
const SEASON_WEIGHTS = {
  winter: { clear: 30, snow: 28, frost: 24, ice: 12, storm: 6 },
  spring: { clear: 45, rain: 35, storm: 10, frost: 10 },
  summer: { clear: 45, rain: 25, storm: 12, heat: 18 },
  autumn: { clear: 35, rain: 38, storm: 15, frost: 12 },
};

function rollWeather(rng, week) {
  const table = SEASON_WEIGHTS[seasonOf(week)];
  const picked = weightedPick(rng, Object.entries(table).map(([id, weight]) => ({ id, weight })));
  return picked ? picked.id : 'clear';
}

/**
 * Итоговые множители недели с учётом надбавки курьерам за плохую погоду.
 *
 * Надбавка — условный расход: в ясную погоду она не стоит ничего, потому что
 * severity = 0. В шторм она возвращает часть сорванных смен и удерживает людей.
 */
function weatherEffect(type, weatherBonus = 0) {
  const w = WEATHER[type] ?? WEATHER.clear;
  // Полное покрытие — 80 ₽ надбавки в самую скверную погоду
  const coverage = Math.min(1, Math.max(0, weatherBonus) / 80);

  return {
    ...w,
    // Надбавка платится пропорционально тяжести погоды и лишь за ту часть недели,
    // когда она реально держится: даже сильный шторм редко стоит все семь дней.
    payPerOrder: weatherBonus * w.severity * 0.4,
    // Деньги возвращают до 70% потерянной пропускной способности:
    // курьеры выходят на смену, но физику дороги надбавкой не отменишь
    capacityMult: w.capacity + (1 - w.capacity) * 0.70 * coverage,
    churnAdd: w.churn * (1 - 0.85 * coverage),
    demandMult: w.demand,
  };
}
