<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>КИНОПОТОК · streaming economics simulator</title>
  <style>
:root {
  --bg: #0b1120;
  --panel: #111a2e;
  --panel-2: #16213a;
  --line: rgba(148, 163, 184, 0.16);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #4ade80;
  --accent-2: #60a5fa;
  --warn: #fbbf24;
  --bad: #f87171;
  --good: #4ade80;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: radial-gradient(1200px 600px at 20% -10%, #16233d 0%, var(--bg) 55%);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  min-height: 100%;
}

button { font-family: inherit; }

/* ------------------------------- Шапка ---------------------------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(11, 17, 32, 0.9);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 26px; }
.brand-title { font-weight: 800; letter-spacing: 0.14em; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 11px; }

.kpis { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px 10px;
  min-width: 96px;
}
.kpi .k-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.kpi .k-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.kpi .k-delta { font-size: 10px; font-variant-numeric: tabular-nums; }
.up { color: var(--good); }
.down { color: var(--bad); }
.neutral { color: var(--muted); }

.topbar-actions { display: flex; gap: 8px; }

.btn {
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.15s;
}
.btn:hover { border-color: rgba(148, 163, 184, 0.4); }
.btn.primary { background: linear-gradient(180deg, #22c55e, #16a34a); border-color: #16a34a; color: #04240f; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 9px; font-size: 12px; font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ------------------------------- Сетка ---------------------------------- */
.layout {
  display: grid;
  grid-template-columns: 340px minmax(420px, 1fr) 360px;
  gap: 14px;
  padding: 14px;
  align-items: start;
}
/* На средних экранах правая колонка уходит под центральную, но остаётся во
   ВТОРОЙ колонке. Растягивать её на всю ширину нельзя: липкая левая колонка
   не ограничена своей строкой грида и накрывала бы её левый край. */
@media (max-width: 1400px) {
  .layout { grid-template-columns: 320px minmax(0, 1fr); }
  .col-right { grid-column: 2; }
}
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col-right { grid-column: auto; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.col-center { display: flex; flex-direction: column; gap: 14px; }
.col-left { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 74px; }
.col-right { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 74px; }
@media (max-width: 1400px) { .col-right { position: static; max-height: none; } }
@media (max-width: 980px) { .col-left { position: static; max-height: none; } }

.panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 4px 0 10px;
  font-weight: 700;
}
.panel-title.inline { margin: 0; }

/* ------------------------------- Рычаги --------------------------------- */
.lever { margin-bottom: 14px; }
.lever-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lever-label { font-weight: 600; font-size: 13px; }
.lever-value { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 700; font-size: 13px; }
.lever input[type="range"] { width: 100%; margin: 6px 0 2px; accent-color: var(--accent); }
.lever-tip { color: var(--muted); font-size: 11px; line-height: 1.4; display: none; }
.lever.open .lever-tip { display: block; }
.lever-why {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 11px; padding: 0; text-decoration: underline dotted;
}

/* ------------------------------- Районы --------------------------------- */
.districts { display: flex; flex-direction: column; gap: 8px; }
.district {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  background: var(--panel-2);
  cursor: pointer;
  transition: 0.15s;
}
.district:hover { border-color: rgba(148, 163, 184, 0.35); }
.district.active { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.07); }
.district-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.district-name { font-weight: 700; font-size: 13px; }
.district-meta { color: var(--muted); font-size: 11px; margin-top: 3px; line-height: 1.45; }
.badge {
  font-size: 10px; padding: 2px 6px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.badge.on { color: var(--good); border-color: rgba(74, 222, 128, 0.4); }

/* ------------------------------ Инвестиции ------------------------------ */
.funding { display: flex; flex-direction: column; gap: 8px; }
.funding-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2);
}
.funding-note { color: var(--muted); font-size: 11px; line-height: 1.45; }

/* ------------------------------- Событие -------------------------------- */
.event {
  border-left: 3px solid var(--warn);
  background: linear-gradient(90deg, rgba(251, 191, 36, 0.09), transparent 60%);
}
.event h3 { margin: 0 0 6px; font-size: 15px; }
.event p { margin: 0 0 10px; color: #cbd5e1; line-height: 1.5; }
.event-options { display: flex; gap: 8px; flex-wrap: wrap; }
.event-option {
  flex: 1 1 200px; text-align: left; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 11px; background: var(--panel-2); cursor: pointer; color: var(--text);
}
.event-option:hover { border-color: var(--warn); }
.event-option.selected { border-color: var(--warn); background: rgba(251, 191, 36, 0.12); }
.event-option b { display: block; margin-bottom: 3px; font-size: 13px; }
.event-option span { color: var(--muted); font-size: 11px; }
.lesson {
  margin-top: 10px; font-size: 11px; color: var(--muted);
  border-top: 1px dashed var(--line); padding-top: 8px;
}
.lesson b { color: var(--warn); }

/* ------------------------------- Отчёт ---------------------------------- */
.report-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.report-head h3 { margin: 0; font-size: 15px; }
.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat .s-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat .s-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .s-sub { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

.drivers { margin-top: 12px; }
.driver { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
.driver .d-name { width: 150px; color: var(--muted); flex-shrink: 0; }
.driver .d-bar { flex: 1; height: 8px; background: rgba(148, 163, 184, 0.1); border-radius: 4px; position: relative; }
.driver .d-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.driver .d-val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

.alerts { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.alert { font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); line-height: 1.45; }
.alert.bad { border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.08); }
.alert.warn { border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.08); }
.alert.good { border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.08); }

/* ------------------------------- Графики -------------------------------- */
.charts-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chart-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.chart-tabs button {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.chart-tabs button.active { color: var(--text); border-color: var(--accent-2); background: rgba(96, 165, 250, 0.12); }
#chart { width: 100%; height: 230px; margin-top: 6px; }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-item i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.chart-caption { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.45; }

/* -------------------------------- Табы ---------------------------------- */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer;
}
.tab.active { color: var(--text); border-color: var(--accent); background: rgba(74, 222, 128, 0.1); }
.tab-content { font-size: 12px; line-height: 1.5; }

table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
table.data tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
table.data tr.sub td:first-child { padding-left: 16px; color: var(--muted); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.help h4 { margin: 14px 0 6px; font-size: 13px; }
.help p, .help li { color: #cbd5e1; }
.help ul { padding-left: 18px; margin: 6px 0; }
.help code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
.formula {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; margin: 6px 0; font-family: ui-monospace, monospace; font-size: 11px; color: #cbd5e1;
  overflow-x: auto; white-space: pre-wrap;
}

/* ------------------------------- Модалка -------------------------------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(2, 6, 16, 0.8);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; max-width: 620px; width: 100%; max-height: 86vh; overflow-y: auto;
}
.modal h2 { margin: 0 0 10px; font-size: 20px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 14px 0; }
.hint-box {
  border: 1px dashed rgba(96, 165, 250, 0.45); background: rgba(96, 165, 250, 0.07);
  border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #cbd5e1;
}
.hint-box b { color: var(--accent-2); }

/* ------------------------------ Алгоритмы ------------------------------- */
.quality-box { margin-bottom: 10px; }
.quality-row { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px; }
.quality-row .q-name { width: 74px; color: var(--muted); flex-shrink: 0; }
.quality-row .q-bar { flex: 1; height: 6px; background: rgba(148, 163, 184, 0.12); border-radius: 3px; overflow: hidden; }
.quality-row .q-fill { height: 100%; border-radius: 3px; background: var(--accent-2); }
.quality-row .q-val { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

.algo {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
  background: var(--panel-2); margin-bottom: 8px;
}
.algo.locked { opacity: 0.5; }
.algo.on { border-color: rgba(96, 165, 250, 0.5); background: rgba(96, 165, 250, 0.07); }
.algo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.algo-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; cursor: pointer; }
.algo-title input { accent-color: var(--accent-2); cursor: pointer; }
.algo-what { color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 4px; }
.algo-tradeoff { color: #cbd5e1; font-size: 11px; line-height: 1.45; margin-top: 5px;
  border-left: 2px solid rgba(251, 191, 36, 0.5); padding-left: 7px; }
.algo-param { margin-top: 7px; }
.algo-param input[type="range"] { width: 100%; accent-color: var(--accent-2); margin: 3px 0 0; }
.algo-param-head { display: flex; justify-content: space-between; font-size: 11px; }
.algo-param-head b { color: var(--accent-2); font-variant-numeric: tabular-nums; }

/* ------------------------------- Погода --------------------------------- */
.weather { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.weather-now, .weather-next {
  flex: 1 1 220px; display: flex; gap: 10px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--panel-2);
}
.weather-next.alarm { border-color: rgba(251, 191, 36, 0.55); background: rgba(251, 191, 36, 0.09); }
.weather-icon { font-size: 26px; line-height: 1; }
.weather-body { min-width: 0; }
.weather-when { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.weather-name { font-weight: 700; font-size: 14px; }
.weather-fx { color: var(--muted); font-size: 11px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.weather-fx b.up { color: var(--good); }
.weather-fx b.down { color: var(--bad); }

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎬</span>
      <div>
        <div class="brand-title" id="brand-title"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="topbar-actions">
      <button id="btn-lang" class="btn ghost"></button>
      <button id="btn-help" class="btn ghost">?</button>
      <button id="btn-restart" class="btn ghost"></button>
      <button id="btn-next" class="btn primary"></button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel col-left">
      <h2 class="panel-title" id="title-levers"></h2>
      <div id="levers"></div>
      <div id="ops-readout"></div>

      <h2 class="panel-title" id="title-studio"></h2>
      <div id="studio"></div>

      <h2 class="panel-title" id="title-algos"></h2>
      <div id="algos"></div>

      <h2 class="panel-title" id="title-funding"></h2>
      <div id="funding" class="funding"></div>
    </aside>

    <section class="col-center">
      <div id="rival-slot"></div>
      <div id="event-slot"></div>
      <div id="report-slot"></div>
      <div class="panel charts">
        <div class="charts-head">
          <h2 class="panel-title inline" id="title-dynamics"></h2>
          <div class="chart-tabs" id="chart-tabs"></div>
        </div>
        <div class="chart-legend" id="chart-legend"></div>
        <canvas id="chart" height="230"></canvas>
        <div class="chart-caption" id="chart-caption"></div>
      </div>
    </section>

    <aside class="panel col-right">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="unit"></button>
        <button class="tab" data-tab="pnl"></button>
        <button class="tab" data-tab="algos"></button>
        <button class="tab" data-tab="segments"></button>
        <button class="tab" data-tab="help"></button>
      </div>
      <div id="tab-content" class="tab-content"></div>
    </aside>
  </main>

  <div id="modal-root"></div>

  <script>
(function () {
'use strict';
// ===== ../../shared/i18n.js ========================================
// ============================================================================
// Ядро локализации, общее для всех игр. Два языка: ru (по умолчанию) и en.
//
// Словарь строк живёт в самой игре (games/<игра>/src/strings.js) и передаётся
// сюда через setStrings(). Строки хранятся парами { ru, en } рядом друг с
// другом — так переводчик видит оригинал и перевод вместе, и невозможно
// потерять одну из версий незаметно.
//
// t(key, vars) — строка интерфейса с подстановкой {переменных}.
// tx(obj)      — двуязычное поле из модели (район, рычаг, событие, алгоритм).
// ============================================================================

const LANGS = ['ru', 'en'];
const STORAGE_KEY = 'game-lang';

let current = 'ru';
let dictionary = {};

// Игра регистрирует свой словарь при старте
function setStrings(dict) {
  dictionary = dict ?? {};
}

function getStrings() {
  return dictionary;
}

function getLang() {
  return current;
}

function setLang(lang) {
  if (!LANGS.includes(lang)) return;
  current = lang;
  try { localStorage.setItem(STORAGE_KEY, lang); } catch { /* приватный режим */ }
  if (typeof document !== 'undefined') document.documentElement.lang = lang;
}

function detectLang() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch { /* приватный режим */ }
  if (typeof navigator !== 'undefined' && !/^ru\b/i.test(navigator.language ?? '')) return 'en';
  return 'ru';
}

// Двуязычное поле модели: { ru: '…', en: '…' }
function tx(field) {
  if (field == null) return '';
  if (typeof field === 'string') return field;
  return field[current] ?? field.ru ?? '';
}

function t(key, vars) {
  const entry = dictionary[key];
  if (!entry) return key;
  let out = entry[current] ?? entry.ru ?? key;
  if (vars) {
    for (const [name, value] of Object.entries(vars)) {
      out = out.replaceAll(`{${name}}`, String(value));
    }
  }
  return out;
}


// ===== src/strings.js ==============================================
// ============================================================================
// Строки интерфейса игры «КИНОПОТОК». Пары { ru, en }.
// Регистрируются в ядре локализации вызовом setStrings() при старте.
// ============================================================================

const STRINGS = {
  // --- шапка ---
  brandTitle: { ru: 'КИНОПОТОК', en: 'KINOPOTOK' },
  brandSub: { ru: 'экономический симулятор онлайн-кинотеатра', en: 'streaming service economics simulator' },
  btnRestart: { ru: 'Заново', en: 'Restart' },
  btnHelpTitle: { ru: 'Как играть', en: 'How to play' },
  btnNext: { ru: 'Прожить месяц {month} →', en: 'Run month {month} →' },
  btnResults: { ru: 'Итоги партии', en: 'Final results' },
  langToggle: { ru: 'EN', en: 'RU' },
  langTitle: { ru: 'Switch to English', en: 'Переключить на русский' },

  // --- KPI ---
  kpiMonth: { ru: 'Месяц', en: 'Month' },
  kpiMonthEvent: { ru: '⚡ событие', en: '⚡ event' },
  kpiMonthCalm: { ru: 'обычный месяц', en: 'a quiet month' },
  kpiCash: { ru: 'Касса', en: 'Cash' },
  kpiCashOut: { ru: 'деньги кончились', en: 'out of money' },
  kpiRunway: { ru: 'хватит на {months} мес.', en: '{months} months of runway' },
  kpiProfitable: { ru: 'операционно прибыльны', en: 'operationally profitable' },
  kpiSubs: { ru: 'Подписчики', en: 'Subscribers' },
  kpiSubsSub: { ru: '{premium} платных · {ads} с рекламой', en: '{premium} ad-free · {ads} on ads' },
  kpiRevenue: { ru: 'Выручка / мес', en: 'Revenue / mo' },
  kpiRevenueSub: { ru: 'ARPU {value}', en: 'ARPU {value}' },
  kpiProfit: { ru: 'Прибыль / мес', en: 'Profit / mo' },
  kpiProfitSub: { ru: 'вклад {value}', en: 'contribution {value}' },
  kpiChurn: { ru: 'Отток', en: 'Churn' },
  kpiChurnSub: { ru: 'жизнь подписки {months} мес.', en: 'subscription lasts {months} mo.' },
  kpiHours: { ru: 'Часов на подписчика', en: 'Hours per subscriber' },
  kpiHoursSub: { ru: 'трафик {value}', en: 'bandwidth {value}' },

// ===== ../../shared/rng.js =========================================
// Детерминированный генератор псевдослучайных чисел (mulberry32).
// Нужен, чтобы одна и та же игра с одним и тем же seed воспроизводилась точно:
// это важно и для тестов, и для учебных сценариев («у всей группы одинаковый город»).

function hashSeed(str) {
  const s = String(str);
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}

function createRng(seed) {
  let a = typeof seed === 'number' ? seed >>> 0 : hashSeed(seed);
  const rng = () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.state = () => a >>> 0;
  rng.restore = (s) => { a = s >>> 0; };
  return rng;
}

// Случайное число из диапазона
function between(rng, min, max) {
  return min + rng() * (max - min);
}

// Выбор элемента с весами: items = [{weight, ...}]
function weightedPick(rng, items) {
  const total = items.reduce((s, i) => s + (i.weight ?? 1), 0);
  if (total <= 0) return null;
  let r = rng() * total;
  for (const item of items) {
    r -= item.weight ?? 1;
    if (r <= 0) return item;
  }
  return items[items.length - 1];
}

// ============================================================================
// Внешний фон месяца: сезон просмотра и афиша конкурента.
//
// В стриминге роль погоды играет чужой релиз. Он бьёт с двух сторон сразу:
// забирает часть новых подписок и вытягивает часть ваших зрителей — ровно
// тогда, когда вы могли бы расти. Афиша известна на месяц вперёд: даты чужих
// премьер публикуются задолго до выхода. Ценность не в информации, а в
// реакции — успеть выпустить своё, поднять маркетинг или переждать.
// ============================================================================


// pull — сила оттягивания аудитории, 0 = ничего не происходит
const RIVAL_RELEASES = {
  none:    { id: 'none',    icon: '·',  pull: 0,    acquisition: 1.00, churnAdd: 0,     hours: 1.00 },
  small:   { id: 'small',   icon: '▫',  pull: 0.25, acquisition: 0.93, churnAdd: 0.004, hours: 0.98 },
  notable: { id: 'notable', icon: '◆',  pull: 0.55, acquisition: 0.84, churnAdd: 0.012, hours: 0.95 },
  major:   { id: 'major',   icon: '★',  pull: 0.80, acquisition: 0.72, churnAdd: 0.024, hours: 0.91 },
  mega:    { id: 'mega',    icon: '★★', pull: 1.00, acquisition: 0.58, churnAdd: 0.040, hours: 0.86 },
};

// Месяц 1 — январь
function seasonOf(month) {
  const m = ((Math.max(1, month) - 1) % 12) + 1;
  if (m <= 2 || m === 12) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  return 'autumn';
}

// Зимой смотрят заметно больше, летом — заметно меньше. Это касается и вас,
// и конкурента: в высокий сезон и премьер больше, и борьба за внимание острее.
const SEASON = {
  winter: { hours: 1.18, weights: { none: 28, small: 24, notable: 24, major: 16, mega: 8 } },
  spring: { hours: 1.00, weights: { none: 42, small: 26, notable: 20, major: 10, mega: 2 } },
  summer: { hours: 0.84, weights: { none: 52, small: 26, notable: 16, major: 6 } },
  autumn: { hours: 1.06, weights: { none: 34, small: 26, notable: 22, major: 14, mega: 4 } },
};

function seasonHours(month) {
  return SEASON[seasonOf(month)].hours;
}

function rollRivalRelease(rng, month) {
  const table = SEASON[seasonOf(month)].weights;
  const picked = weightedPick(rng, Object.entries(table).map(([id, weight]) => ({ id, weight })));
  return picked ? picked.id : 'none';
}

/**
 * Итоговые множители месяца с учётом контрпрограммирования — вашего решения
 * ответить на чужую премьеру своей или, наоборот, не мешать ей.
 *
 * Собственная громкая премьера в тот же месяц частично гасит чужую: зритель
 * выбирает, а не уходит совсем.
 */
function rivalEffect(type, ownBuzz = 0) {
  const r = RIVAL_RELEASES[type] ?? RIVAL_RELEASES.none;
  // Свой релиз перебивает чужой тем сильнее, чем он громче
  const counter = Math.min(0.65, ownBuzz * 0.45);

  return {
    ...r,
    acquisitionMult: r.acquisition + (1 - r.acquisition) * counter,
    churnAdd: r.churnAdd * (1 - counter),
    hoursMult: r.hours + (1 - r.hours) * counter,
  };
}

function eventById(id) {
  return EVENTS.find((e) => e.id === id) ?? null;
}

// Вероятность события ~30% в месяц
function rollEvent(rng, month, flags = {}) {
  if (month < 3) return null;
  if (rng() > 0.30) return null;
  const pool = EVENTS.filter((e) => month >= (e.minMonth ?? 0));
  const picked = weightedPick(rng, pool);
  return picked ? { ...picked } : null;
}

function applyEvent(mods, event, optionIndex) {
  if (!event) return mods;
  const effects = { ...(event.effects ?? {}) };
  if (event.options && event.options[optionIndex]) {
    Object.assign(effects, event.options[optionIndex].effects);
  }
  for (const [key, value] of Object.entries(effects)) {
    if (key === 'demandMult' || key === 'hoursMult' || key === 'cdnMult') {
      mods[key] = (mods[key] ?? 1) * value;
    } else if (key === 'notes') {
      continue;
    } else if (typeof value === 'number' && key in mods) {
      mods[key] += value;
    } else {
      mods[key] = value;
    }
  }
  mods.notes.push(event.id);
  return mods;
}


// ===== src/model/engine.js =========================================
// ============================================================================
// Ядро симуляции онлайн-кинотеатра. Чистые функции: step(state) -> {state, report}.
// Никакой работы с DOM — модуль можно гонять в тестах и в скриптах.
//
// Смысловая структура модели:
//
//   деньги -> лицензии (сразу) ─┐
//   деньги -> производство ─────┼─► КАТАЛОГ: глубина + свежесть
//             (лаг 6 месяцев)   ┘         │
//                                         ▼
//   маркетинг -> узнаваемость -> пробные подписки -> ПОДПИСЧИКИ (запас)
//                                         │                   │
//                    цена, реклама, каталог -> отток           ▼
//                                                        часы просмотра
//                                                             │
//                                        выручка (подписка + реклама)
//                                        минус трафик (растёт с часами!)
//                                                             │
//                                                        P&L -> касса
//
// Главная особенность жанра: чем больше зритель смотрит, тем он лояльнее —
// и тем дороже обходится. Трафик здесь единственная крупная переменная
// статья, и она растёт вместе с любовью аудитории к сервису.
// ============================================================================


const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

function segmentById(id) {
  return SEGMENTS.find((s) => s.id === id);
}

function genreById(id) {
  return GENRES.find((g) => g.id === id);
}

// Во сколько обходится один проект выбранного жанра
function projectCost(genre) {
  return genre.hours * CONFIG.originalCostPerHour * genre.costPerHour;
}

// ----------------------------------------------------------------------------
// Начальное состояние
// ----------------------------------------------------------------------------
function createInitialState(seed = 'kinopotok') {
  const rng = createRng(seed);
  const rival = rollRivalRelease(rng, 1);
  const rivalNext = rollRivalRelease(rng, 2);
  return {
    seed,
    rngState: rng.state(),
    month: 0,
    cash: CONFIG.startCash,
    equity: 1,
    raisedTotal: 0,
    techStock: 0,
    rndStock: 0,
    dataStock: 0,          // накопленные часы просмотра — обучающая выборка
    installed: {},
    catalogLicensed: 900,  // стартовая библиотека, доставшаяся от прежнего владельца
    catalogOriginal: 0,
    freshHours: 0,         // «новинки»: стареют каждый месяц
    studioFund: 0,         // деньги, накопленные на текущий проект
    pipeline: [],          // проекты в производстве
    lastBuzz: 0,           // остаточный шум прошлой премьеры (для календаря релизов)
    hangover: 0,           // сколько зрителей досмотрели премьеру и готовы уйти
    segments: Object.fromEntries(SEGMENTS.map((s) => [s.id, {
      id: s.id,
      awareness: 0.03,
      premium: 0,
      ads: 0,
    }])),
    rival,
    rivalNext,
    decisions: structuredClone(DEFAULT_DECISIONS),
    flags: { valuationBonus: 0 },
    pendingEvent: null,
    pendingChoice: null,
    history: [],
    lastSnapshot: null,
    over: null,
  };
}

// ----------------------------------------------------------------------------
// Производные показатели
// ----------------------------------------------------------------------------
function techLevel(state) {
  return state.techStock / (state.techStock + CONFIG.techSaturation);
}
function dataLevel(state) {
  return (state.dataStock ?? 0) / ((state.dataStock ?? 0) + CONFIG.dataSaturation);
}
function rndLevel(state) {
  return (state.rndStock ?? 0) / ((state.rndStock ?? 0) + CONFIG.rndSaturation);
}
// Ни данные, ни команда по отдельности не работают
function algoQuality(state) {
  return Math.sqrt(dataLevel(state) * rndLevel(state));
}

// Глубина каталога: насыщающаяся функция, нормированная так, что эталон даёт 1.0
function catalogDepth(hours) {
  const raw = hours / (hours + CONFIG.refCatalogHours);
  const ref = CONFIG.refCatalogHours / (CONFIG.refCatalogHours + CONFIG.refCatalogHours);
  return clamp(raw / ref, 0, 1.6);
}

// Свежесть: сколько новинок вышло относительно эталона
function catalogFreshness(freshHours) {
  return clamp(Math.pow(Math.max(0, freshHours) / CONFIG.refFreshHours, 0.5), 0, 1.7);
}

// ----------------------------------------------------------------------------
// Главный шаг симуляции
// ----------------------------------------------------------------------------
function step(prevState, input = {}) {
  const state = structuredClone(prevState);
  if (state.over) return { state, report: state.history[state.history.length - 1] ?? null };

  const snapshot = structuredClone({
    ...prevState,
    history: prevState.history.slice(-2),
    lastSnapshot: null,
  });

  const decisions = { ...state.decisions, ...(input.decisions ?? {}) };
  state.decisions = decisions;

  const rng = createRng(state.seed);
  rng.restore(state.rngState);

  const month = state.month + 1;

  // --- 1. Событие месяца ---
  const mods = neutralModifiers();
  const event = state.pendingEvent;
  const choice = input.eventChoice ?? state.pendingChoice ?? 0;
  applyEvent(mods, event, choice);
  if (mods.valuationBonus) state.flags.valuationBonus += mods.valuationBonus;

  // --- 2. Алгоритмы: доступность, внедрение, настройки ---
  const quality = algoQuality(state);
  let installCost = 0;
  const installedNow = [];
  for (const a of ALGORITHMS) {
    if (decisions.algoOn?.[a.key] && !state.installed[a.key] && quality >= a.unlock) {
      state.installed[a.key] = true;
      installCost += a.install;
      installedNow.push(a.key);
    }
  }
  const algo = (key) => (decisions.algoOn?.[key] && state.installed[key]
    ? clamp(decisions.algoParam?.[key] ?? 0, 0, 1) : 0);

  const recoStrength = algo('recommendations');
  const forecastTrust = algo('contentForecast');
  const winbackDiscount = algo('winback');
  const adSpread = algo('adaptiveAds');
  const compression = algo('encoding');
  const pacing = algo('pacing');

  // --- 3. Производство: копилка, старт проектов, премьеры ---
  const genre = genreById(decisions.genre) ?? GENRES[0];
  state.studioFund += decisions.originals;
  const started = [];
  // Копилка может дать сразу несколько проектов, если бюджет большой
  while (state.studioFund >= projectCost(genre)) {
    state.studioFund -= projectCost(genre);
    // Качество зависит от команды, технологий и удачи: кино — рискованный бизнес
    const luck = rng();
    const projectQuality = clamp(0.55 + 0.5 * luck + 0.25 * techLevel(state), 0.25, 1.45);
    state.pipeline.push({
      genre: genre.id,
      monthsLeft: CONFIG.originalLeadMonths,
      hours: genre.hours,
      quality: projectQuality,
    });
    started.push({ genre: genre.id, quality: projectQuality });
  }

  const premieres = [];
  for (const project of state.pipeline) project.monthsLeft -= 1;
  for (const project of state.pipeline.filter((p) => p.monthsLeft <= 0)) {
    const g = genreById(project.genre);
    state.catalogOriginal += project.hours;
    state.freshHours += project.hours;
    premieres.push({ genre: project.genre, quality: project.quality, hours: project.hours, buzz: g.buzz * project.quality });
  }
  state.pipeline = state.pipeline.filter((p) => p.monthsLeft > 0);

  // Календарь релизов растягивает премьеру: часть шума переносится на следующий
  // месяц, зато пик ниже. Отток после «досмотрел всё» сглаживается.
  const rawBuzz = premieres.reduce((s, p) => s + p.buzz, 0);
  const heldBuzz = rawBuzz * pacing * 0.45;
  const buzz = rawBuzz - heldBuzz + (state.lastBuzz ?? 0);
  state.lastBuzz = heldBuzz;

  // Волна отписок от тех, кто досмотрел прошлую премьеру и больше не видит
  // причин платить. Растянутый по неделям релиз её заметно сглаживает.
  const hangover = state.hangover ?? 0;
  state.hangover = premieres.reduce(
    (s, p) => s + p.buzz * (genreById(p.genre)?.hangover ?? 0.4), 0) * (1 - 0.55 * pacing);

  // --- 4. Каталог ---
  // Прогноз спроса делает тот же бюджет эффективнее, но тянет закупку
  // к уже известному: глубина растёт медленнее, чем просмотры.
  const licensingEfficiency = 1 + 0.45 * forecastTrust * quality;
  const boughtHours = (decisions.licensing / CONFIG.licenseCostPerHour) * licensingEfficiency;
  state.catalogLicensed = state.catalogLicensed * (1 - CONFIG.licenseDecay) + boughtHours;
  // Лицензии почти не считаются новинками: это чужое и часто не первой свежести.
  // Ощущение «тут появилось что-то новое» создают премьеры собственных проектов.
  state.freshHours = state.freshHours * (1 - CONFIG.freshDecay) + boughtHours * CONFIG.licenseFreshShare;

  const catalogHours = state.catalogLicensed + state.catalogOriginal;
  // Чужой каталог хуже удерживает: он есть и у конкурентов
  const weightedLicensed = state.catalogLicensed * CONFIG.licenseDepthWeight;
  const weightedOriginal = state.catalogOriginal * CONFIG.originalDepthWeight;
  const effectiveCatalog = weightedLicensed + weightedOriginal;
  const originalShare = effectiveCatalog > 0 ? weightedOriginal / effectiveCatalog : 0;
  const depth = catalogDepth(effectiveCatalog) * (1 - 0.10 * forecastTrust * quality);
  const freshness = catalogFreshness(state.freshHours);

  // Рекомендации достают контент с полки: воспринимаемый каталог больше
  // реального. Но при слабой модели лента схлопывается в пузырь.
  //
  // Польза линейна по силе персонализации, вред — квадратичен. Поэтому у
  // ползунка всегда есть безопасное положение, и оно тем правее, чем лучше
  // модель: осторожная лента помогает даже на слабых данных, агрессивная
  // на них же схлопывает каталог в десяток одинаковых карточек.
  const recoLift = 1 + 0.35 * recoStrength * quality;
  const bubble = 1 - 0.30 * recoStrength ** 2 * (1 - quality);
  const perceivedDepth = depth * recoLift * bubble;

  // --- 5. Внешний фон ---
  const rivalType = state.rival ?? 'none';
  const rival = rivalEffect(rivalType, buzz);
  const season = seasonHours(month);

  // --- 6. Подписчики по сегментам ---
  const refPrice = 399;
  let newSubs = 0;
  let lostSubs = 0;
  let trialsTotal = 0;
  let winbackCost = 0;
  const perSegment = [];

  for (const def of SEGMENTS) {
    const seg = state.segments[def.id];

    // Выбор тарифа: чем больше экономия и чем терпимее сегмент к рекламе,
    // тем охотнее он идёт на дешёвый тариф с рекламой.
    const saving = decisions.pricePremium > 0
      ? clamp((decisions.pricePremium - decisions.priceAds) / decisions.pricePremium, 0, 1) : 0;
    const adLoadPain = clamp((decisions.adLoad / CONFIG.refAdLoad) / Math.max(0.2, def.adTolerance), 0, 3);
    const adShare = clamp(0.12 + 0.85 * saving * def.adTolerance - 0.12 * adLoadPain, 0.02, 0.94);

    // Цена, которую сегмент фактически платит в среднем
    const blendedPrice = decisions.pricePremium * (1 - adShare) + decisions.priceAds * adShare;
    const priceFactor = clamp(Math.pow(refPrice / Math.max(30, blendedPrice), def.elasticity), 0.15, 2.6);

    // Ценность каталога для сегмента: глубина и свежесть весят по-разному
    const appeal = clamp(
      Math.pow(Math.max(0.05, perceivedDepth), def.depthWeight * 0.6)
      * Math.pow(Math.max(0.05, freshness), def.freshnessWeight * 0.5),
      0, 2.2
    );

    // Реклама раздражает тем сильнее, чем меньше её терпит сегмент.
    // Адаптивная реклама перераспределяет нагрузку и снимает часть раздражения.
    const adRelief = 1 - 0.45 * adSpread * quality;
    const adPenalty = clamp(1 - 0.16 * adLoadPain * adShare * adRelief, 0.45, 1);

    // Премьера тянет к себе именно свой сегмент
    const premiereAppeal = premieres.reduce(
      (s, p) => s + p.buzz * (genreById(p.genre)?.appeal[def.id] ?? 1), 0);

    // Узнаваемость — накопительный запас
    const shareOfMarket = def.potential / SEGMENTS.reduce((s, x) => s + x.potential, 0);
    const spendPerViewer = (decisions.marketing * shareOfMarket) / def.potential;
    const gain = clamp(
      0.28 * Math.pow(spendPerViewer / CONFIG.refMarketingPerViewer, 0.55),
      0, CONFIG.awarenessMaxGain);
    seg.awareness = clamp(
      seg.awareness + (1 - seg.awareness) * gain - seg.awareness * CONFIG.awarenessDecay
      + (mods.awarenessAdd ?? 0) + premiereAppeal * 0.02,
      0, 1);

    // Пробные подписки → платящие
    const subs = seg.premium + seg.ads;
    const untapped = Math.max(0, def.potential - subs);
    const trialFactor = clamp(0.55 + 0.45 * (decisions.trialDays / CONFIG.refTrialDays), 0.5, 1.45);
    const trials = untapped * seg.awareness * 0.055 * priceFactor * appeal * adPenalty
      * rival.acquisitionMult * mods.demandMult * (1 + premiereAppeal * 0.6);
    const converted = trials * CONFIG.trialConversion * trialFactor;

    // Отток: скучный каталог, дорогая подписка, назойливая реклама, чужая премьера
    const boredom = Math.max(0, 1 - freshness) * def.freshnessWeight * 0.055;
    const priceAnger = Math.max(0, 1 - priceFactor) * 0.045;
    const adAnger = (1 - adPenalty) * 0.25;
    const techAnnoyance = Math.max(0, 1 - decisions.bitrate / CONFIG.refBitrate) * 0.03
      + compression * (1 - quality) * 0.02 / Math.max(0.3, def.adTolerance);
    // Персональное удержание: скидка тем, кто уже собрался уходить
    const winbackPower = winbackDiscount > 0
      ? clamp(0.55 * quality + 0.2, 0, 0.75) * clamp(winbackDiscount / 0.4, 0, 1) : 0;

    // Эксклюзив держит: уйти от того, чего больше нигде нет, труднее.
    // Зато после того, как громкую премьеру досмотрели, уходят волной —
    // и чем громче была премьера, тем выше волна.
    const exclusiveHold = 1 - CONFIG.exclusiveRetention * originalShare;
    let churnRate = clamp(
      (CONFIG.baseChurn * def.loyalty + boredom + priceAnger + adAnger + techAnnoyance) * exclusiveHold
      + rival.churnAdd + (mods.churnAdd ?? 0)
      + hangover * 0.018 * def.freshnessWeight
      - buzz * 0.030,
      0.005, 0.5);
    const savedShare = winbackPower * 0.45;
    churnRate = churnRate * (1 - savedShare);

    const leaving = subs * churnRate;
    // Скидку получают удержанные и часть тех, кто и так остался бы (промахи модели)
    const discounted = subs * churnRate * savedShare / Math.max(0.05, 1 - savedShare)
      + subs * (1 - quality) * winbackDiscount * 0.03;
    winbackCost += discounted * decisions.pricePremium * winbackDiscount;

    // Обновляем запасы по тарифам
    const survivors = subs - leaving;
    const survivorAdShare = subs > 0 ? seg.ads / subs : adShare;
    seg.ads = Math.max(0, survivors * survivorAdShare + converted * adShare);
    seg.premium = Math.max(0, survivors * (1 - survivorAdShare) + converted * (1 - adShare));

    newSubs += converted;
    lostSubs += leaving;
    trialsTotal += trials;

    perSegment.push({
      def, seg, adShare, blendedPrice, priceFactor, appeal, adPenalty,
      churnRate, converted, leaving, subs: seg.premium + seg.ads,
    });
  }

  // --- 7. Часы просмотра и трафик ---
  let hours = 0;
  let adHours = 0;
  for (const p of perSegment) {
    const segHours = p.subs * CONFIG.baseHoursPerSub * p.def.baseHours
      * season * Math.pow(Math.max(0.1, perceivedDepth), 0.35)
      * (1 + 0.22 * recoStrength * quality)
      * rival.hoursMult * (mods.hoursMult ?? 1);
    p.hours = segHours;
    p.adHours = segHours * (p.seg.ads / Math.max(1, p.subs));
    hours += segHours;
    adHours += p.adHours;
  }

  // Трафик — крупнейшая переменная статья, и она растёт вместе с лояльностью
  const encodingSaving = 0.35 * compression * (0.4 + 0.6 * quality);
  const cdnPerHour = CONFIG.cdnCostPerHour * (decisions.bitrate / CONFIG.refBitrate)
    * (1 - 0.30 * techLevel(state)) * (1 - encodingSaving) * (mods.cdnMult ?? 1);
  const cdnCost = hours * cdnPerHour;

  const totalSubs = perSegment.reduce((s, p) => s + p.subs, 0);
  const premiumSubs = perSegment.reduce((s, p) => s + p.seg.premium, 0);
  const adSubs = perSegment.reduce((s, p) => s + p.seg.ads, 0);
  const supportCost = totalSubs * CONFIG.supportCostPerSub;

  // --- 8. Выручка ---
  const subscriptionRevenue = premiumSubs * decisions.pricePremium + adSubs * decisions.priceAds;
  // Адаптивная реклама даёт больше показов при том же среднем раздражении
  const adYield = 1 + 0.25 * adSpread * quality;
  const impressions = adHours * decisions.adLoad * 2 * adYield;   // ролик — 30 секунд
  const adRevenue = (impressions / 1000) * CONFIG.cpm;
  const revenue = subscriptionRevenue + adRevenue;

  const variableCost = cdnCost + supportCost + winbackCost;
  const contribution = revenue - variableCost;

  const contentSpend = decisions.licensing + decisions.originals;
  const fixed = CONFIG.hqMonthly + decisions.licensing + decisions.originals
    + decisions.marketing + decisions.tech + decisions.rnd;
  const oneOff = installCost + (mods.oneOffCost ?? 0);
  const profit = contribution - fixed;

  state.cash += profit - oneOff;
  state.techStock += decisions.tech;
  state.rndStock += decisions.rnd;
  state.dataStock += hours;

  // --- 9. Метрики ---
  const arpu = totalSubs > 0 ? revenue / totalSubs : 0;
  const cmPerSub = totalSubs > 0 ? contribution / totalSubs : 0;
  const hoursPerSub = totalSubs > 0 ? hours / totalSubs : 0;
  const avgChurn = totalSubs > 0
    ? perSegment.reduce((s, p) => s + p.churnRate * p.subs, 0) / totalSubs
    : CONFIG.baseChurn;
  const cac = newSubs > 0 ? decisions.marketing / newSubs : 0;
  const ltv = cmPerSub / Math.max(0.005, avgChurn);
  const marketShare = totalSubs / SEGMENTS.reduce((s, x) => s + x.potential, 0);

  const wGeo = (key) => {
    if (!perSegment.length || totalSubs <= 0) return 1;
    let acc = 0;
    for (const p of perSegment) acc += Math.log(Math.max(1e-6, p[key])) * (p.subs / totalSubs);
    return Math.exp(acc);
  };

  const report = {
    month,
    season: seasonOf(month),
    subs: totalSubs,
    premiumSubs,
    adSubs,
    newSubs,
    lostSubs,
    trials: trialsTotal,
    churnRate: avgChurn,

    hours,
    adHours,
    hoursPerSub,
    catalogHours,
    catalogLicensed: state.catalogLicensed,
    catalogOriginal: state.catalogOriginal,
    freshHours: state.freshHours,
    depth,
    perceivedDepth,
    freshness,

    revenue,
    subscriptionRevenue,
    adRevenue,
    arpu,
    cdnCost,
    cdnPerHour,
    supportCost,
    winbackCost,
    variableCost,
    contribution,
    cmPerSub,
    fixed,
    contentSpend,
    oneOff,
    installCost,
    installedNow,
    profit,
    cash: state.cash,

    rival: rivalType,
    rivalNext: state.rivalNext ?? 'none',
    rivalAcquisition: rival.acquisitionMult,
    rivalChurnAdd: rival.churnAdd,
    seasonHours: season,

    buzz,
    heldBuzz,
    hangover,
    originalShare,
    effectiveCatalog,
    premieres,
    started,
    pipeline: state.pipeline.map((p) => ({ genre: p.genre, monthsLeft: p.monthsLeft, quality: p.quality })),
    studioFund: state.studioFund,
    projectCost: projectCost(genre),

    cac,
    ltv,
    ltvCac: cac > 0 ? ltv / cac : null,
    marketShare,
    algoQuality: quality,
    dataLevel: dataLevel(state),
    rndLevel: rndLevel(state),
    techLevel: techLevel(state),
    algoActive: Object.fromEntries(ALGORITHMS.map((a) => [a.key, Boolean(decisions.algoOn?.[a.key] && state.installed[a.key])])),

    avgPriceFactor: wGeo('priceFactor'),
    avgAppeal: wGeo('appeal'),
    avgAdPenalty: wGeo('adPenalty'),

    event: event ? { id: event.id, choice } : null,
    segments: perSegment.map((p) => ({
      id: p.def.id,
      subs: p.subs,
      premium: p.seg.premium,
      ads: p.seg.ads,
      adShare: p.adShare,
      penetration: p.subs / p.def.potential,
      awareness: p.seg.awareness,
      churnRate: p.churnRate,
      hours: p.hours,
      priceFactor: p.priceFactor,
      appeal: p.appeal,
      adPenalty: p.adPenalty,
      arpu: p.subs > 0
        ? (p.seg.premium * decisions.pricePremium + p.seg.ads * decisions.priceAds
           + (p.adHours * decisions.adLoad * 2 * adYield / 1000) * CONFIG.cpm) / p.subs
        : 0,
    })),
    decisions: structuredClone(decisions),
  };

  // --- 10. Завершение месяца ---
  state.month = month;
  state.lastSnapshot = snapshot;
  state.history.push(report);
  state.pendingChoice = null;
  state.pendingEvent = rollEvent(rng, month + 1, state.flags);
  state.rival = state.rivalNext ?? 'none';
  state.rivalNext = rollRivalRelease(rng, month + 2);
  state.rngState = rng.state();

  if (state.cash < 0) state.over = 'bankrupt';
  else if (month >= CONFIG.monthsTotal) state.over = 'finished';

  report.valuation = valuation(state);
  report.equityValue = report.valuation * state.equity;

  return { state, report };
}

// ----------------------------------------------------------------------------
// Экономика одного подписчика — считается мгновенно, до расчёта месяца
// ----------------------------------------------------------------------------
function unitEconomics(state, decisions) {
  const last = state.history[state.history.length - 1];
  const hoursPerSub = last ? last.hoursPerSub : CONFIG.baseHoursPerSub;
  const adShare = last && last.subs > 0 ? last.adSubs / last.subs : 0.35;

  const subscription = decisions.pricePremium * (1 - adShare) + decisions.priceAds * adShare;
  const impressions = hoursPerSub * adShare * decisions.adLoad * 2;
  const advertising = (impressions / 1000) * CONFIG.cpm;
  const revenue = subscription + advertising;

  const compression = decisions.algoOn?.encoding && state.installed?.encoding
    ? clamp(decisions.algoParam?.encoding ?? 0, 0, 1) : 0;
  const encodingSaving = 0.35 * compression * (0.4 + 0.6 * algoQuality(state));
  const cdnPerHour = CONFIG.cdnCostPerHour * (decisions.bitrate / CONFIG.refBitrate)
    * (1 - 0.30 * techLevel(state)) * (1 - encodingSaving);
  const cdn = hoursPerSub * cdnPerHour;
  const support = CONFIG.supportCostPerSub;

  return {
    hoursPerSub, adShare,
    subscription, advertising, revenue,
    cdn, support, cdnPerHour,
    variable: cdn + support,
    contribution: revenue - cdn - support,
  };
}

// ----------------------------------------------------------------------------
// Контрфактический разбор: сколько на самом деле принёс каждый алгоритм
// ----------------------------------------------------------------------------
function algorithmImpact(state) {
  const snap = state.lastSnapshot;
  const actual = state.history[state.history.length - 1];
  if (!snap || !actual) return [];

  const out = [];
  for (const a of ALGORITHMS) {
    if (!actual.algoActive?.[a.key]) continue;
    const decisions = structuredClone(actual.decisions);
    decisions.algoOn = { ...decisions.algoOn, [a.key]: false };
    let alt;
    try {
      alt = step(snap, { decisions, eventChoice: actual.event?.choice ?? 0 }).report;
    } catch { continue; }
    if (!alt) continue;
    out.push({
      key: a.key,
      profit: actual.profit - alt.profit,
      subs: actual.subs - alt.subs,
      hours: actual.hours - alt.hours,
      churnRate: actual.churnRate - alt.churnRate,
    });
  }
  return out.sort((x, y) => y.profit - x.profit);
}

// ----------------------------------------------------------------------------
// Оценка компании и раунды
// ----------------------------------------------------------------------------
function valuation(state) {
  const h = state.history;
  if (!h.length) return 300_000_000;
  const last = h[h.length - 1];
  const runRate = last.revenue * 12;

  const tail = h.slice(-3).reduce((s, r) => s + r.subs, 0);
  const prev = h.slice(-6, -3).reduce((s, r) => s + r.subs, 0);
  const growth = prev > 0 ? tail / prev : (tail > 0 ? 1.4 : 1);
  const growthScore = clamp(growth - 1, 0, 1);

  const margin = last.revenue > 0 ? last.profit / last.revenue : -0.5;
  const marginScore = clamp(margin, -0.4, 0.25) / 0.25;

  // Собственная библиотека — актив, лицензии — аренда. Рынок это видит.
  const libraryValue = state.catalogOriginal * CONFIG.originalCostPerHour * 0.35;

  const multiple = clamp(2.2 + 5 * growthScore + 4 * Math.max(0, marginScore) + 1.5 * Math.min(0, marginScore), 0.5, 12);
  const base = runRate * multiple + libraryValue;
  const bonus = 1 + clamp(state.flags.valuationBonus, -0.4, 0.6);
  return Math.max(300_000_000, base * bonus);
}

function fundingOffer(state, amount) {
  const pre = valuation(state);
  const dilution = amount / (pre + amount);
  return { pre, post: pre + amount, amount, dilution, newEquity: state.equity * (1 - dilution) };
}

function raise(state, amount) {
  const offer = fundingOffer(state, amount);
  const next = structuredClone(state);
  next.cash += amount;
  next.equity = offer.newEquity;
  next.raisedTotal += amount;
  return { state: next, offer };
}

// ----------------------------------------------------------------------------
// Разбор месяца: раскладываем изменение числа подписчиков на факторы
// ----------------------------------------------------------------------------
function explain(prev, cur) {
  if (!prev || !cur) return [];
  const parts = [
    ['driverPrice', prev.avgPriceFactor, cur.avgPriceFactor],
    ['driverCatalog', prev.avgAppeal, cur.avgAppeal],
    ['driverAds', prev.avgAdPenalty, cur.avgAdPenalty],
    ['driverRival', prev.rivalAcquisition, cur.rivalAcquisition],
    ['driverRetention', 1 - prev.churnRate, 1 - cur.churnRate],
    ['driverAwareness',
      Math.max(1e-6, prev.trials / Math.max(1, prev.subs)),
      Math.max(1e-6, cur.trials / Math.max(1, cur.subs))],
  ];
  return parts
    .map(([key, a, b]) => ({
      key,
      effect: a > 0 && b > 0 ? Math.exp(Math.log(b) - Math.log(a)) - 1 : 0,
    }))
    .filter((p) => Math.abs(p.effect) > 0.002)
    .sort((a, b) => Math.abs(b.effect) - Math.abs(a.effect));
}

function finalScore(state) {
  const v = valuation(state);
  return {
    valuation: v,
    equity: state.equity,
    equityValue: v * state.equity,
    raised: state.raisedTotal,
    cash: state.cash,
    months: state.month,
    bankrupt: state.over === 'bankrupt',
  };
}


// ===== ../../shared/format.js ======================================
// Форматирование чисел для интерфейса.
// Разделители разрядов и суффиксы («млн» / «M») зависят от языка.


const LOCALE = { ru: 'ru-RU', en: 'en-US' };
const SUFFIX = {
  ru: { thousand: 'тыс', million: 'млн', billion: 'млрд', k: 'к', m: 'м' },
  en: { thousand: 'K', million: 'M', billion: 'B', k: 'K', m: 'M' },
};

const locale = () => LOCALE[getLang()] ?? 'ru-RU';
const suffix = () => SUFFIX[getLang()] ?? SUFFIX.ru;
const group = (x) => Math.round(x).toLocaleString(locale());

function num(x, digits = 0) {
  if (!Number.isFinite(x)) return '—';
  return x.toLocaleString(locale(), { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function money(x) {
  if (!Number.isFinite(x)) return '—';
  const abs = Math.abs(x);
  const sign = x < 0 ? '−' : '';
  const s = suffix();
  if (abs >= 1e9) return `${sign}${(abs / 1e9).toFixed(2)} ${s.billion} ₽`;
  if (abs >= 1e6) return `${sign}${(abs / 1e6).toFixed(abs >= 1e7 ? 1 : 2)} ${s.million} ₽`;
  if (abs >= 1e3) return `${sign}${group(abs)} ₽`;
  return `${sign}${abs.toFixed(0)} ₽`;
}

function moneyExact(x) {
  if (!Number.isFinite(x)) return '—';
  return `${x < 0 ? '−' : ''}${group(Math.abs(x))} ₽`;
}

// Короткие подписи на осях графиков
function axisNum(v) {
  const s = suffix();
  if (Math.abs(v) >= 1e6) return `${(v / 1e6).toFixed(1)}${s.m}`;
  if (Math.abs(v) >= 1000) return `${Math.round(v / 1000)}${s.k}`;
  return String(Math.round(v));
}

function pct(x, digits = 1) {
  if (!Number.isFinite(x)) return '—';
  return `${(x * 100).toFixed(digits)}%`;
}

function signedPct(x, digits = 1) {
  if (!Number.isFinite(x)) return '—';
  return `${x > 0 ? '+' : ''}${(x * 100).toFixed(digits)}%`;
}

function compact(x) {
  if (!Number.isFinite(x)) return '—';
  const abs = Math.abs(x);
  const s = suffix();
  if (abs >= 1e6) return `${(x / 1e6).toFixed(1)} ${s.million}`;
  if (abs >= 1e3) return `${(x / 1e3).toFixed(1)} ${s.thousand}`;
  return group(x);
}


// ===== ../../shared/charts.js ======================================
// Минималистичные графики на canvas — без внешних библиотек,
// чтобы игра открывалась одним файлом и работала офлайн.

const PALETTE = ['#4ade80', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa', '#22d3ee'];

function niceTicks(min, max, count = 4) {
  if (!Number.isFinite(min) || !Number.isFinite(max) || min === max) {
    return [min || 0, (min || 0) + 1];
  }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) ?? mag * 10;
  const start = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = start; v <= max + step * 0.5; v += step) ticks.push(v);
  return ticks;
}

/**
 * series: [{ label, color?, data: number[] }]
 * opts: { format?: (v)=>string, zeroLine?: boolean, title?: string }
 */
function drawLineChart(canvas, series, opts = {}) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 320;
  const cssH = canvas.clientHeight || 180;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const fmt = opts.format ?? ((v) => (Math.abs(v) >= 1000 ? `${Math.round(v / 1000)}к` : String(Math.round(v))));
  const padL = 52, padR = 10, padT = 16, padB = 22;
  const w = cssW - padL - padR;
  const h = cssH - padT - padB;

  const visible = series.filter((s) => s.data && s.data.length);
  if (!visible.length || visible.every((s) => s.data.length < 1)) {
    ctx.fillStyle = 'rgba(226,232,240,0.35)';
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(opts.emptyText ?? '', cssW / 2, cssH / 2);
    return;
  }

  const n = Math.max(...visible.map((s) => s.data.length));
  let min = Infinity, max = -Infinity;
  for (const s of visible) for (const v of s.data) {
    if (!Number.isFinite(v)) continue;
    min = Math.min(min, v); max = Math.max(max, v);
  }
  if (!Number.isFinite(min)) { min = 0; max = 1; }
  if (opts.zeroLine) { min = Math.min(min, 0); max = Math.max(max, 0); }
  if (min === max) { max = min + Math.abs(min || 1) * 0.2 + 1; }
  const pad = (max - min) * 0.08;
  min -= pad; max += pad;

  const x = (i) => padL + (n <= 1 ? w / 2 : (i / (n - 1)) * w);
  const y = (v) => padT + h - ((v - min) / (max - min)) * h;

  // сетка
  const ticks = niceTicks(min, max, 4);
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const t of ticks) {
    if (t < min || t > max) continue;
    const py = y(t);
    ctx.strokeStyle = Math.abs(t) < 1e-9 ? 'rgba(148,163,184,0.35)' : 'rgba(148,163,184,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, py + 0.5);
    ctx.lineTo(padL + w, py + 0.5);
    ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.7)';
    ctx.fillText(fmt(t), padL - 6, py);
  }

  // ось X — номера недель
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const labelEvery = Math.max(1, Math.ceil(n / 8));
  for (let i = 0; i < n; i += labelEvery) {
    ctx.fillStyle = 'rgba(148,163,184,0.6)';
    ctx.fillText(String(i + 1), x(i), padT + h + 6);
  }

  // линии
  visible.forEach((s, si) => {
    ctx.strokeStyle = s.color ?? PALETTE[si % PALETTE.length];
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let started = false;
    s.data.forEach((v, i) => {
      if (!Number.isFinite(v)) return;
      const px = x(i), py = y(v);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    });
    ctx.stroke();

    // последняя точка
    const lastIdx = s.data.length - 1;
    if (lastIdx >= 0 && Number.isFinite(s.data[lastIdx])) {
      ctx.fillStyle = s.color ?? PALETTE[si % PALETTE.length];
      ctx.beginPath();
      ctx.arc(x(lastIdx), y(s.data[lastIdx]), 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function legendHtml(series) {
  return series.map((s, i) => `<span class="legend-item"><i style="background:${s.color ?? PALETTE[i % PALETTE.length]}"></i>${s.label}</span>`).join('');
}

// Текст берётся из src/strings.js через t() и tx().

const SAVE_KEY = 'kinopotok-save-v1';
const el = (id) => document.getElementById(id);

let state = null;
let chartTab = 'subs';
let rightTab = 'unit';
let leversBuilt = false;

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch { /* приватный режим */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return s && s.segments && Array.isArray(s.history) ? s : null;
  } catch { return null; }
}

const last = () => state.history[state.history.length - 1] ?? null;
const prev = () => state.history[state.history.length - 2] ?? null;
const algoByKey = (key) => ALGORITHMS.find((a) => a.key === key);
const rivalName = (type) => t(`rival${type.charAt(0).toUpperCase()}${type.slice(1)}`);
const seasonName = (season) => t(`season${season.charAt(0).toUpperCase()}${season.slice(1)}`);

// ----------------------------------------------------------------------------
// KPI
// ----------------------------------------------------------------------------
function kpi(label, value, sub, cls = 'neutral') {
  return `<div class="kpi"><div class="k-label">${label}</div>
    <div class="k-value">${value}</div><div class="k-delta ${cls}">${sub ?? ''}</div></div>`;
}

function delta(cur, before) {
  if (!Number.isFinite(cur) || !Number.isFinite(before) || before === 0) return ['', 'neutral'];
  const d = cur / before - 1;
  return [signedPct(d), d > 0.001 ? 'up' : d < -0.001 ? 'down' : 'neutral'];
}

function renderKpis() {
  const r = last();
  const p = prev();
  const burn = r ? r.fixed + r.oneOff - r.contribution : 0;
  const runway = burn > 0 ? state.cash / burn : Infinity;

  const parts = [
    kpi(t('kpiMonth'), `${state.month} / ${CONFIG.monthsTotal}`,
      state.pendingEvent ? t('kpiMonthEvent') : t('kpiMonthCalm')),
    kpi(t('kpiCash'), money(state.cash),
      state.cash < 0 ? t('kpiCashOut')
        : Number.isFinite(runway) ? t('kpiRunway', { months: runway.toFixed(0) })
        : t('kpiProfitable'),
      state.cash < 0 ? 'down' : runway < 5 ? 'down' : runway < 12 ? 'neutral' : 'up'),
  ];

  if (r) {
    const [dSubs, cSubs] = delta(r.subs, p?.subs);
    parts.push(
      kpi(t('kpiSubs'), compact(r.subs),
        t('kpiSubsSub', { premium: compact(r.premiumSubs), ads: compact(r.adSubs) }), cSubs || 'neutral'),
      kpi(t('kpiRevenue'), money(r.revenue), t('kpiRevenueSub', { value: `${num(r.arpu)} ₽` }), 'neutral'),
      kpi(t('kpiProfit'), money(r.profit), t('kpiProfitSub', { value: money(r.contribution) }),
        r.profit >= 0 ? 'up' : 'down'),
      kpi(t('kpiChurn'), pct(r.churnRate, 1),
        t('kpiChurnSub', { months: (1 / Math.max(0.005, r.churnRate)).toFixed(0) }),
        r.churnRate <= 0.05 ? 'up' : r.churnRate <= 0.09 ? 'neutral' : 'down'),
      kpi(t('kpiHours'), num(r.hoursPerSub, 1),
        t('kpiHoursSub', { value: money(r.cdnCost) }),
        'neutral'),
      kpi(t('kpiEquity'), money(r.equityValue ?? 0),
        t('kpiEquitySub', { value: pct(state.equity, 1) }), 'neutral'),
      kpi('', dSubs, '', cSubs),
    );
    parts.pop();
  } else {
    parts.push(kpi(t('kpiStart'), money(CONFIG.startCash), t('kpiStartSub'), 'up'));
  }
  el('kpis').innerHTML = parts.join('');
}

function buildLevers() {
  el('levers').innerHTML = LEVERS.map((l) => `
    <div class="lever" data-key="${l.key}">
      <div class="lever-head">
        <span class="lever-label">${tx(l.label)}</span>
        <span class="lever-value" id="val-${l.key}"></span>
      </div>
      <input type="range" id="in-${l.key}" min="${l.min}" max="${l.max}" step="${l.step}" />
      <button class="lever-why" type="button">${t('leverWhy')}</button>
      <div class="lever-tip">${tx(l.tip)}</div>
    </div>`).join('');

  for (const l of LEVERS) {
    el(`in-${l.key}`).addEventListener('input', (e) => {
      state.decisions[l.key] = Number(e.target.value) * (l.scale ?? 1);
      syncLevers();
      renderOpsReadout();
      renderRightTab();
      save();
    });
  }
  el('levers').querySelectorAll('.lever-why').forEach((b) => {
    b.addEventListener('click', () => b.closest('.lever').classList.toggle('open'));
  });
  leversBuilt = true;
}

function leverDisplay(l, raw) {
  const unit = tx(l.unit);
  if (l.key === 'licensing' || l.key === 'originals' || l.key === 'marketing'
      || l.key === 'tech' || l.key === 'rnd') return money(raw);
  return `${num(raw)} ${unit}`;
}

function syncLevers() {
  for (const l of LEVERS) {
    const raw = state.decisions[l.key] / (l.scale ?? 1);
    const input = el(`in-${l.key}`);
    if (input) input.value = String(raw);
    el(`val-${l.key}`).textContent = leverDisplay(l, raw);
  }
}

function rivalCard(type, when, cls = '') {
  const fx = rivalEffect(type, 0);
  const effects = type === 'none'
    ? t('rivalNoEffect')
    : t('rivalEffects', {
        acq: signedPct(fx.acquisitionMult - 1, 0),
        churn: (fx.churnAdd * 100).toFixed(1),
        hours: signedPct(fx.hoursMult - 1, 0),
      });
  return `<div class="${cls}">
    <span class="weather-icon">${RIVAL_RELEASES[type]?.icon ?? '·'}</span>
    <span class="weather-body">
      <span class="weather-when">${when}</span>
      <div class="weather-name">${rivalName(type)}</div>
      <div class="weather-fx">${effects}</div>
    </span>
  </div>`;
}

function renderRival() {
  if (state.over) { el('rival-slot').innerHTML = ''; return; }
  const now = state.rival ?? 'none';
  const next = state.rivalNext ?? 'none';
  const alarm = (RIVAL_RELEASES[next]?.pull ?? 0) >= 0.7;

  el('rival-slot').innerHTML = `<div class="panel">
    <h2 class="panel-title">${t('rivalPanel', {
      season: seasonName(seasonOf(state.month + 1)), month: state.month + 1,
    })}</h2>
    <div class="weather">
      ${rivalCard(now, t('rivalNow'), 'weather-now')}
      ${rivalCard(next, t('rivalNext'), `weather-next ${alarm ? 'alarm' : ''}`)}
      ${alarm ? `<div class="funding-note" style="flex-basis:100%">${t('rivalAdvice')}</div>` : ''}

  </div>`;
}

function renderAlgos() {
  const q = algoQuality(state);
  const head = `<div class="quality-box">
    ${qualityBar(t('algoData'), dataLevel(state), t('algoDataHint'))}
    ${qualityBar(t('algoTeam'), rndLevel(state), t('algoTeamHint'))}
    ${qualityBar(t('algoQuality'), q, t('algoQualityHint'))}
    <div class="funding-note">${t('algoIntro')}</div>
  </div>`;

  const cards = ALGORITHMS.map((a) => {
    const installed = Boolean(state.installed?.[a.key]);
    const unlocked = installed || q >= a.unlock;
    const on = Boolean(state.decisions.algoOn?.[a.key]);
    const raw = (state.decisions.algoParam?.[a.key] ?? a.param.def * (a.param.scale ?? 1)) / (a.param.scale ?? 1);

    const badge = installed
      ? `<span class="badge on">${t('algoInstalled')}</span>`
      : unlocked
        ? `<span class="badge">${t('algoInstallCost', { cost: money(a.install) })}</span>`
        : `<span class="badge">${t('algoNeedQuality', { value: pct(a.unlock, 0) })}</span>`;

    const slider = installed && on ? `<div class="algo-param">
        <div class="algo-param-head"><span>${tx(a.param.label)}</span><b>${raw}${tx(a.param.unit)}</b></div>
        <input type="range" data-algo-param="${a.key}"
          min="${a.param.min}" max="${a.param.max}" step="${a.param.step}" value="${raw}" />
      </div>` : '';

    const pending = on && !installed && unlocked
      ? `<div class="algo-tradeoff">${t('algoPending', { cost: money(a.install) })}</div>` : '';

    return `<div class="algo ${!unlocked ? 'locked' : ''} ${on && installed ? 'on' : ''}">
      <div class="algo-head">
        <label class="algo-title">
          <input type="checkbox" data-algo="${a.key}" ${on ? 'checked' : ''} ${unlocked ? '' : 'disabled'} />
          ${tx(a.name)}
        </label>
        ${badge}
      </div>
      <div class="algo-what">${tx(a.what)}</div>
      ${slider}
      ${installed && on ? `<div class="algo-tradeoff">${tx(a.tradeoff)}</div>` : pending}
    </div>`;
  }).join('');

  el('algos').innerHTML = head + cards;

  el('algos').querySelectorAll('[data-algo]').forEach((box) => {
    box.addEventListener('change', () => {
      state.decisions.algoOn = { ...state.decisions.algoOn, [box.dataset.algo]: box.checked };
      renderAlgos(); renderOpsReadout(); renderRightTab(); save();
    });
  });
  el('algos').querySelectorAll('[data-algo-param]').forEach((input) => {
    input.addEventListener('input', () => {
      const a = algoByKey(input.dataset.algoParam);
      state.decisions.algoParam = {
        ...state.decisions.algoParam,
        [a.key]: Number(input.value) * (a.param.scale ?? 1),
      };
      const head = input.parentElement.querySelector('b');
      if (head) head.textContent = `${input.value}${tx(a.param.unit)}`;
      renderOpsReadout(); renderRightTab(); save();
    });
  });
}

// ----------------------------------------------------------------------------
// Отчёт месяца
// ----------------------------------------------------------------------------
function stat(label, value, sub) {
  return `<div class="stat"><div class="s-label">${label}</div>
    <div class="s-value">${value}</div><div class="s-sub">${sub ?? ''}</div></div>`;
}

function buildAlerts(r) {
  const alerts = [];
  const burn = r.fixed + r.oneOff - r.contribution;
  const runway = burn > 0 ? state.cash / burn : Infinity;

  if (r.depth < 0.35) {
    alerts.push(['bad', t('alertNoCatalog', { depth: r.depth.toFixed(2) })]);
  }
  if (r.freshness < 0.6 && r.subs > 1000) {
    alerts.push(['warn', t('alertStale', { fresh: r.freshness.toFixed(2), lost: compact(r.lostSubs) })]);
  }
  if (!r.pipeline.length) {
    alerts.push(['bad', t('alertNoPipeline')]);
  }
  if (r.cmPerSub < 0) {
    alerts.push(['bad', t('alertNegativeCm', { value: `${num(r.cmPerSub)} ₽` })]);
  } else if (r.revenue > 0 && r.cdnCost / r.revenue > 0.30) {
    alerts.push(['warn', t('alertTrafficHeavy', {
      share: pct(r.cdnCost / r.revenue, 0), cost: money(r.cdnCost),
      hours: num(r.hoursPerSub, 1), bitrate: num(r.decisions.bitrate),
    })]);
  }
  if (r.cmPerSub > 0 && r.profit < 0) {
    alerts.push(['warn', t('alertBreakEven', {
      cm: `${num(r.cmPerSub)} ₽`, fixed: money(r.fixed), subs: compact(r.fixed / r.cmPerSub),
    })]);
  }
  if (runway < 5 && state.cash >= 0) {
    alerts.push(['bad', t('alertRunway', { months: runway.toFixed(0), burn: money(burn) })]);
  }
  if (r.hangover > 0.4) {
    alerts.push(['warn', t('alertHangover', { churn: pct(r.churnRate, 1) })]);
  }
  if ((RIVAL_RELEASES[r.rivalNext]?.pull ?? 0) >= 0.7) {
    alerts.push(['warn', t('alertRivalAhead', {
      release: rivalName(r.rivalNext).toLowerCase(),
      acq: pct(rivalEffect(r.rivalNext, 0).acquisitionMult, 0),
    })]);
  }
  if (r.decisions.adLoad >= 8) {
    alerts.push(['warn', t('alertAdHeavy', {
      load: num(r.decisions.adLoad), revenue: money(r.adRevenue),
    })]);
  }
  if (Number.isFinite(r.ltvCac) && r.ltvCac !== null && r.cac > 0) {
    if (r.ltvCac < 1) alerts.push(['bad', t('alertLtvCacBad', { value: r.ltvCac.toFixed(2) })]);
    else if (r.ltvCac > 3) alerts.push(['good', t('alertLtvCacGood', { value: r.ltvCac.toFixed(2) })]);
  }
  const anyAlgoOn = Object.values(r.algoActive ?? {}).some(Boolean);
  if ((r.decisions.rnd ?? 0) > 0 && !anyAlgoOn) {
    alerts.push(['warn', t('alertRndIdle', {
      cost: money(r.decisions.rnd), quality: pct(r.algoQuality, 0) })]);
  }
  const ready = ALGORITHMS.filter((a) => !state.installed?.[a.key] && r.algoQuality >= a.unlock);
  if (ready.length) {
    alerts.push(['good', t('alertAlgosReady', {
      names: ready.map((a) => tx(a.name)).join(', '), quality: pct(r.algoQuality, 0) })]);
  }
  if (r.profit > 0) alerts.push(['good', t('alertProfit', { value: money(r.profit) })]);
  return alerts;
}

function renderReport() {
  const r = last();
  if (!r) { el('report-slot').innerHTML = renderStartHint(); return; }

  const drivers = explain(prev(), r);
  const maxAbs = Math.max(0.02, ...drivers.map((d) => Math.abs(d.effect)));
  const driversHtml = drivers.length ? `
    <div class="drivers">
      <div class="panel-title">${t('driversTitle', {
        delta: signedPct(r.subs / Math.max(1e-9, prev().subs) - 1) })}</div>
      ${drivers.slice(0, 6).map((d) => {
        const w = (Math.abs(d.effect) / maxAbs) * 50;
        const pos = d.effect > 0;
        return `<div class="driver">
          <span class="d-name">${t(d.key)}</span>
          <span class="d-bar"><span class="d-fill" style="${pos ? `left:50%;width:${w}%` : `right:50%;width:${w}%`};background:${pos ? 'var(--good)' : 'var(--bad)'}"></span></span>
          <span class="d-val ${pos ? 'pos' : 'neg'}">${signedPct(d.effect)}</span>
        </div>`;
      }).join('')}
    </div>` : '';

  const alerts = buildAlerts(r);
  const alertsHtml = alerts.length
    ? `<div class="alerts">${alerts.map(([k, text]) => `<div class="alert ${k}">${text}</div>`).join('')}</div>` : '';

  const ev = r.event ? eventById(r.event.id) : null;
  const eventNote = ev ? `<div class="lesson"><b>${tx(ev.title)}.</b> ${tx(ev.lesson)}</div>` : '';

  const premiereNote = r.premieres.length
    ? `<div class="alert good" style="margin-top:8px">${t('premiereNote', {
        list: r.premieres.map((p) => t('premiereItem', {
          genre: tx(genreById(p.genre)?.name), quality: p.quality.toFixed(2) })).join(', '),
      })}</div>` : '';
  const startedNote = r.started.length
    ? `<div class="alert warn" style="margin-top:8px">${t('startedNote', {
        list: r.started.map((p) => tx(genreById(p.genre)?.name)).join(', '),
        months: CONFIG.originalLeadMonths,
      })}</div>` : '';
  const installNote = r.installedNow?.length
    ? `<div class="alert good" style="margin-top:8px">${t('installNote', {
        names: r.installedNow.map((k) => tx(algoByKey(k)?.name)).join(', '),
        cost: money(r.installCost) })}</div>` : '';

  el('report-slot').innerHTML = `<div class="panel">
    <div class="report-head">
      <h3>${t('reportTitle', { month: r.month })}</h3>
      <span class="funding-note">${t('reportHeadStats', {
        revenue: money(r.revenue), subscription: money(r.subscriptionRevenue), ads: money(r.adRevenue) })}</span>
    </div>
    <div class="report-grid">
      ${stat(t('statSubs'), compact(r.subs), t('statSubsSub', {
        gained: compact(r.newSubs), lost: compact(r.lostSubs) }))}
      ${stat(t('statHours'), compact(r.hours), t('statHoursSub', { perSub: num(r.hoursPerSub, 1) }))}
      ${stat(t('statCatalog'), `${compact(r.catalogHours)} ${t('unitHours')}`, t('statCatalogSub', {
        original: compact(r.catalogOriginal), share: pct(r.originalShare, 0) }))}
      ${stat(t('statFresh'), `×${r.freshness.toFixed(2)}`, t('statFreshSub', { depth: r.depth.toFixed(2) }))}
      ${stat(t('statChurn'), pct(r.churnRate, 1), t('statChurnSub', { hangover: r.hangover.toFixed(2) }))}
      ${stat(t('statArpu'), `${num(r.arpu)} ₽`, t('statArpuSub', { value: `${num(r.cmPerSub)} ₽` }))}
      ${stat(t('statTraffic'), money(r.cdnCost), t('statTrafficSub', { perHour: num(r.cdnPerHour, 2) }))}
      ${stat(t('statProfit'), money(r.profit), t('statProfitSub', { value: money(r.fixed) }))}
      ${stat(t('statCacLtv'), r.cac > 0 ? `${num(r.cac)} ₽` : '—',
        r.ltvCac ? `LTV/CAC ${r.ltvCac.toFixed(2)}` : t('statCacOff'))}
    </div>
    ${premiereNote}${startedNote}${installNote}
    ${driversHtml}${alertsHtml}${eventNote}
  </div>`;
}

      { label: t('seriesContribution'), data: h.map((r) => r.contribution), color: PALETTE[0] },

function renderChart() {
  el('chart-tabs').innerHTML = Object.entries(CHART_TABS)
    .map(([k, v]) => `<button data-chart="${k}" class="${k === chartTab ? 'active' : ''}">${t(v.label)}</button>`).join('');
  el('chart-tabs').querySelectorAll('[data-chart]').forEach((b) => {
    b.addEventListener('click', () => { chartTab = b.dataset.chart; renderChart(); });
  });

  const conf = CHART_TABS[chartTab];
  const series = conf.series(state.history);
  el('chart-legend').innerHTML = legendHtml(series);
  el('chart-caption').textContent = t(conf.caption);
  drawLineChart(el('chart'), series, {
    zeroLine: conf.zeroLine, format: conf.format ?? axisNum, emptyText: t('pnlEmpty'),
  });
}
