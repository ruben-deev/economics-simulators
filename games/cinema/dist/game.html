<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>КИНОПОТОК · streaming economics simulator</title>
  <style>
:root {
  --bg: #0b1120;
  --panel: #111a2e;
  --panel-2: #16213a;
  --line: rgba(148, 163, 184, 0.16);
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #4ade80;
  --accent-2: #60a5fa;
  --warn: #fbbf24;
  --bad: #f87171;
  --good: #4ade80;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: radial-gradient(1200px 600px at 20% -10%, #16233d 0%, var(--bg) 55%);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  min-height: 100%;
}

button { font-family: inherit; }

/* ------------------------------- Шапка ---------------------------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(11, 17, 32, 0.9);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 26px; }
.brand-title { font-weight: 800; letter-spacing: 0.14em; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 11px; }

.kpis { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px 10px;
  min-width: 96px;
}
.kpi .k-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.kpi .k-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.kpi .k-delta { font-size: 10px; font-variant-numeric: tabular-nums; }
.up { color: var(--good); }
.down { color: var(--bad); }
.neutral { color: var(--muted); }

.topbar-actions { display: flex; gap: 8px; }

.btn {
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.15s;
}
.btn:hover { border-color: rgba(148, 163, 184, 0.4); }
.btn.primary { background: linear-gradient(180deg, #22c55e, #16a34a); border-color: #16a34a; color: #04240f; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 9px; font-size: 12px; font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ------------------------------- Сетка ---------------------------------- */
.layout {
  display: grid;
  grid-template-columns: 340px minmax(420px, 1fr) 360px;
  gap: 14px;
  padding: 14px;
  align-items: start;
}
/* На средних экранах правая колонка уходит под центральную, но остаётся во
   ВТОРОЙ колонке. Растягивать её на всю ширину нельзя: липкая левая колонка
   не ограничена своей строкой грида и накрывала бы её левый край. */
@media (max-width: 1400px) {
  .layout { grid-template-columns: 320px minmax(0, 1fr); }
  .col-right { grid-column: 2; }
}
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col-right { grid-column: auto; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.col-center { display: flex; flex-direction: column; gap: 14px; }
.col-left { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 74px; }
.col-right { max-height: calc(100vh - 90px); overflow-y: auto; position: sticky; top: 74px; }
@media (max-width: 1400px) { .col-right { position: static; max-height: none; } }
@media (max-width: 980px) { .col-left { position: static; max-height: none; } }

.panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 4px 0 10px;
  font-weight: 700;
}
.panel-title.inline { margin: 0; }

/* ------------------------------- Рычаги --------------------------------- */
.lever { margin-bottom: 14px; }
.lever-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lever-label { font-weight: 600; font-size: 13px; }
.lever-value { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 700; font-size: 13px; }
.lever input[type="range"] { width: 100%; margin: 6px 0 2px; accent-color: var(--accent); }
.lever-tip { color: var(--muted); font-size: 11px; line-height: 1.4; display: none; }
.lever.open .lever-tip { display: block; }
.lever-why {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 11px; padding: 0; text-decoration: underline dotted;
}

/* ------------------------------- Районы --------------------------------- */
.districts { display: flex; flex-direction: column; gap: 8px; }
.district {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  background: var(--panel-2);
  cursor: pointer;
  transition: 0.15s;
}
.district:hover { border-color: rgba(148, 163, 184, 0.35); }
.district.active { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.07); }
.district-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.district-name { font-weight: 700; font-size: 13px; }
.district-meta { color: var(--muted); font-size: 11px; margin-top: 3px; line-height: 1.45; }
.badge {
  font-size: 10px; padding: 2px 6px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.badge.on { color: var(--good); border-color: rgba(74, 222, 128, 0.4); }

/* ------------------------------ Инвестиции ------------------------------ */
.funding { display: flex; flex-direction: column; gap: 8px; }
.funding-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel-2);
}
.funding-note { color: var(--muted); font-size: 11px; line-height: 1.45; }

/* ------------------------------- Событие -------------------------------- */
.event {
  border-left: 3px solid var(--warn);
  background: linear-gradient(90deg, rgba(251, 191, 36, 0.09), transparent 60%);
}
.event h3 { margin: 0 0 6px; font-size: 15px; }
.event p { margin: 0 0 10px; color: #cbd5e1; line-height: 1.5; }
.event-options { display: flex; gap: 8px; flex-wrap: wrap; }
.event-option {
  flex: 1 1 200px; text-align: left; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 11px; background: var(--panel-2); cursor: pointer; color: var(--text);
}
.event-option:hover { border-color: var(--warn); }
.event-option.selected { border-color: var(--warn); background: rgba(251, 191, 36, 0.12); }
.event-option b { display: block; margin-bottom: 3px; font-size: 13px; }
.event-option span { color: var(--muted); font-size: 11px; }
.lesson {
  margin-top: 10px; font-size: 11px; color: var(--muted);
  border-top: 1px dashed var(--line); padding-top: 8px;
}
.lesson b { color: var(--warn); }

/* ------------------------------- Отчёт ---------------------------------- */
.report-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.report-head h3 { margin: 0; font-size: 15px; }
.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat .s-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat .s-value { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .s-sub { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

.drivers { margin-top: 12px; }
.driver { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
.driver .d-name { width: 150px; color: var(--muted); flex-shrink: 0; }
.driver .d-bar { flex: 1; height: 8px; background: rgba(148, 163, 184, 0.1); border-radius: 4px; position: relative; }
.driver .d-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.driver .d-val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

.alerts { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.alert { font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); line-height: 1.45; }
.alert.bad { border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.08); }
.alert.warn { border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.08); }
.alert.good { border-color: rgba(74, 222, 128, 0.4); background: rgba(74, 222, 128, 0.08); }

/* ------------------------------- Графики -------------------------------- */
.charts-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chart-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.chart-tabs button {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; font-size: 11px; cursor: pointer;
}
.chart-tabs button.active { color: var(--text); border-color: var(--accent-2); background: rgba(96, 165, 250, 0.12); }
#chart { width: 100%; height: 230px; margin-top: 6px; }
.chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-item i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.chart-caption { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.45; }

/* -------------------------------- Табы ---------------------------------- */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer;
}
.tab.active { color: var(--text); border-color: var(--accent); background: rgba(74, 222, 128, 0.1); }
.tab-content { font-size: 12px; line-height: 1.5; }

table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
table.data tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
table.data tr.sub td:first-child { padding-left: 16px; color: var(--muted); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.help h4 { margin: 14px 0 6px; font-size: 13px; }
.help p, .help li { color: #cbd5e1; }
.help ul { padding-left: 18px; margin: 6px 0; }
.help code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
.formula {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; margin: 6px 0; font-family: ui-monospace, monospace; font-size: 11px; color: #cbd5e1;
  overflow-x: auto; white-space: pre-wrap;
}

/* ------------------------------- Модалка -------------------------------- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(2, 6, 16, 0.8);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; max-width: 620px; width: 100%; max-height: 86vh; overflow-y: auto;
}
.modal h2 { margin: 0 0 10px; font-size: 20px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 14px 0; }
.hint-box {
  border: 1px dashed rgba(96, 165, 250, 0.45); background: rgba(96, 165, 250, 0.07);
  border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #cbd5e1;
}
.hint-box b { color: var(--accent-2); }

/* ------------------------------ Алгоритмы ------------------------------- */
.quality-box { margin-bottom: 10px; }
.quality-row { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-bottom: 4px; }
.quality-row .q-name { width: 74px; color: var(--muted); flex-shrink: 0; }
.quality-row .q-bar { flex: 1; height: 6px; background: rgba(148, 163, 184, 0.12); border-radius: 3px; overflow: hidden; }
.quality-row .q-fill { height: 100%; border-radius: 3px; background: var(--accent-2); }
.quality-row .q-val { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

.algo {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
  background: var(--panel-2); margin-bottom: 8px;
}
.algo.locked { opacity: 0.5; }
.algo.on { border-color: rgba(96, 165, 250, 0.5); background: rgba(96, 165, 250, 0.07); }
.algo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.algo-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; cursor: pointer; }
.algo-title input { accent-color: var(--accent-2); cursor: pointer; }
.algo-what { color: var(--muted); font-size: 11px; line-height: 1.45; margin-top: 4px; }
.algo-tradeoff { color: #cbd5e1; font-size: 11px; line-height: 1.45; margin-top: 5px;
  border-left: 2px solid rgba(251, 191, 36, 0.5); padding-left: 7px; }
.algo-param { margin-top: 7px; }
.algo-param input[type="range"] { width: 100%; accent-color: var(--accent-2); margin: 3px 0 0; }
.algo-param-head { display: flex; justify-content: space-between; font-size: 11px; }
.algo-param-head b { color: var(--accent-2); font-variant-numeric: tabular-nums; }

/* ------------------------------- Погода --------------------------------- */
.weather { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
.weather-now, .weather-next {
  flex: 1 1 220px; display: flex; gap: 10px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--panel-2);
}
.weather-next.alarm { border-color: rgba(251, 191, 36, 0.55); background: rgba(251, 191, 36, 0.09); }
.weather-icon { font-size: 26px; line-height: 1; }
.weather-body { min-width: 0; }
.weather-when { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.weather-name { font-weight: 700; font-size: 14px; }
.weather-fx { color: var(--muted); font-size: 11px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.weather-fx b.up { color: var(--good); }
.weather-fx b.down { color: var(--bad); }

/* ---------------- Конкурент, цели совета, кризис (КИНОПОТОК) ------------- */
.rival-head {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: flex-start;
  margin-bottom: 10px;
}
.rival-stance { flex: 1 1 220px; }
.rival-stance-hint { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 5px; }
.rival-facts { flex: 1 1 260px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.rival-facts b { color: var(--text); }

.share-bar {
  display: flex;
  height: 22px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 700;
}
.share-bar span {
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  transition: width 0.35s ease;
}
.share-you { background: rgba(74, 222, 128, 0.30); color: var(--good); }
.share-them { background: rgba(248, 113, 113, 0.20); color: var(--bad); flex: 1; }

.goal-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent-2);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.goal-card.done { border-left-color: var(--good); }
.goal-card.urgent { border-left-color: var(--warn); }
.goal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal-year { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.goal-left { color: var(--muted); font-size: 11px; }
.goal-line { margin: 6px 0 8px; line-height: 1.5; font-size: 13px; }
.goal-card .q-bar { display: block; margin-bottom: 6px; }
.q-fill.ok { background: var(--good); }
.goal-past { font-size: 11px; padding: 3px 0; color: var(--muted); }
.goal-past.pos { color: var(--good); }
.goal-past.neg { color: var(--bad); }

.event-card.crisis { border-left: 3px solid var(--bad); }
.event-card.crisis h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.event-option.chosen { border-color: var(--accent); background: rgba(74, 222, 128, 0.12); }

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎬</span>
      <div>
        <div class="brand-title" id="brand-title"></div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="topbar-actions">
      <button id="btn-lang" class="btn ghost"></button>
      <button id="btn-help" class="btn ghost">?</button>
      <button id="btn-restart" class="btn ghost"></button>
      <button id="btn-next" class="btn primary"></button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel col-left">
      <h2 class="panel-title" id="title-levers"></h2>
      <div id="levers"></div>
      <div id="ops-readout"></div>

      <h2 class="panel-title" id="title-studio"></h2>
      <div id="studio"></div>

      <h2 class="panel-title" id="title-algos"></h2>
      <div id="algos"></div>

      <h2 class="panel-title" id="title-board"></h2>
      <div id="board"></div>

      <h2 class="panel-title" id="title-funding"></h2>
      <div id="funding" class="funding"></div>
    </aside>

    <section class="col-center">
      <div id="rival-slot"></div>
      <div id="crisis-slot"></div>
      <div id="event-slot"></div>
      <div id="report-slot"></div>
      <div class="panel charts">
        <div class="charts-head">
          <h2 class="panel-title inline" id="title-dynamics"></h2>
          <div class="chart-tabs" id="chart-tabs"></div>
        </div>
        <div class="chart-legend" id="chart-legend"></div>
        <canvas id="chart" height="230"></canvas>
        <div class="chart-caption" id="chart-caption"></div>
      </div>
    </section>

    <aside class="panel col-right">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="unit"></button>
        <button class="tab" data-tab="pnl"></button>
        <button class="tab" data-tab="algos"></button>
        <button class="tab" data-tab="segments"></button>
        <button class="tab" data-tab="help"></button>
      </div>
      <div id="tab-content" class="tab-content"></div>
    </aside>
  </main>

  <div id="modal-root"></div>

  <script>
(function () {
'use strict';
// ===== ../../shared/i18n.js ========================================
// ============================================================================
// Ядро локализации, общее для всех игр. Два языка: ru (по умолчанию) и en.
//
// Словарь строк живёт в самой игре (games/<игра>/src/strings.js) и передаётся
// сюда через setStrings(). Строки хранятся парами { ru, en } рядом друг с
// другом — так переводчик видит оригинал и перевод вместе, и невозможно
// потерять одну из версий незаметно.
//
// t(key, vars) — строка интерфейса с подстановкой {переменных}.
// tx(obj)      — двуязычное поле из модели (район, рычаг, событие, алгоритм).
// ============================================================================

const LANGS = ['ru', 'en'];
const STORAGE_KEY = 'game-lang';

let current = 'ru';
let dictionary = {};

// Игра регистрирует свой словарь при старте
function setStrings(dict) {
  dictionary = dict ?? {};
}

function getStrings() {
  return dictionary;
}

function getLang() {
  return current;
}

function setLang(lang) {
  if (!LANGS.includes(lang)) return;
  current = lang;
  try { localStorage.setItem(STORAGE_KEY, lang); } catch { /* приватный режим */ }
  if (typeof document !== 'undefined') document.documentElement.lang = lang;
}

function detectLang() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (LANGS.includes(saved)) return saved;
  } catch { /* приватный режим */ }
  if (typeof navigator !== 'undefined' && !/^ru\b/i.test(navigator.language ?? '')) return 'en';
  return 'ru';
}

// Двуязычное поле модели: { ru: '…', en: '…' }
function tx(field) {
  if (field == null) return '';
  if (typeof field === 'string') return field;
  return field[current] ?? field.ru ?? '';
}

function t(key, vars) {
  const entry = dictionary[key];
  if (!entry) return key;
  let out = entry[current] ?? entry.ru ?? key;
  if (vars) {
    for (const [name, value] of Object.entries(vars)) {
      out = out.replaceAll(`{${name}}`, String(value));
    }
  }
  return out;
}

  algosTabQuality: { ru: 'Качество алгоритмов: <b>{quality}</b> (данные {data} × команда {team}).', en: 'Algorithm quality: <b>{quality}</b> (data {data} × team {team}).' },

  algosNet: { ru: 'Чистый эффект', en: 'Net effect' },
  algosCounterfactual: { ru: 'Каждая строка — контрфактический расчёт: прошлый месяц пересчитан заново с выключенным алгоритмом. В реальной компании такой ответ стоит квартала A/B-тестов.', en: 'Every row is a counterfactual: last month was re-simulated with that algorithm switched off. In a real company this answer costs a quarter of A/B testing.' },
  algosNone: { ru: 'Ни один алгоритм не включён — сравнивать нечего. Начните с бюджета на Data Science.', en: 'No algorithm is switched on, so there is nothing to compare. Start with a data science budget.' },
  algosZeroNote: { ru: '{names} сейчас почти ничего не меняет. Это не поломка: часть алгоритмов включается только в своём режиме — календарь релизов бесполезен без премьер, удержание — при низком оттоке.', en: '{names} currently changes almost nothing. That is not a bug: some algorithms only engage in their own regime — pacing is useless without premieres, win-back at low churn.' },
  algosVsSlider: { ru: 'Чем алгоритм отличается от ползунка', en: 'How an algorithm differs from a slider' },
  algosVsSliderText: { ru: 'Ползунок задаёт <b>число</b>: 4 минуты рекламы всем и всегда. Алгоритм задаёт <b>правило</b>: реклама = f(терпимость зрителя), скидка = f(вероятность ухода), битрейт = f(сцены). Правило умеет быть разным для разных людей — поэтому улучшает оба конца компромисса, неразрешимого для одного числа.', en: 'A slider sets a <b>number</b>: four minutes of ads for everyone, always. An algorithm sets a <b>rule</b>: ads = f(viewer tolerance), discount = f(probability of leaving), bitrate = f(scene). A rule can differ between people, which is why it improves both ends of a trade-off a single number cannot resolve.' },

  // --- справка ---
  helpWhatTitle: { ru: 'Что это такое', en: 'What this is' },
  helpWhatText: { ru: 'Вы управляете онлайн-кинотеатром. Один ход — месяц, партия — три года. Цель: построить сервис, который дорого стоит <i>и</i> в котором вам всё ещё принадлежит большая доля.', en: 'You run a streaming service. One turn is a month, a game is three years. The goal: build a service that is worth a lot <i>and</i> in which you still own a large share.' },
  helpCatalogTitle: { ru: 'Каталог: аренда против актива', en: 'Catalogue: renting versus owning' },
  helpCatalogFormula: {
    ru: `лицензии: появляются сразу, истекают 4,5% в месяц, есть у конкурентов
оригиналы: премьера через 6 месяцев, остаются навсегда, только у вас
глубина = насыщение(лицензии × 0.5 + оригиналы × 6)
свежесть = √(новинки / эталон), новинка стареет за ~4 месяца`,
    en: `licences: available at once, expire at 4.5% a month, rivals have them too
originals: premiere in 6 months, stay forever, yours alone
depth = saturation(licensed × 0.5 + originals × 6)
freshness = √(new releases / reference), a release ages out in ~4 months`,
  },
  helpCatalogText: { ru: 'Час собственной премьеры удерживает как несколько часов библиотеки, но стоит в полсотни раз дороже. Ни одна из крайностей не работает: на одних лицензиях нечем удерживать, на одних оригиналах нечего смотреть.', en: 'An hour of your own premiere retains like several hours of library, but costs fifty times more. Neither extreme works: licences alone give you nothing to hold people with, originals alone give them nothing to watch.' },
  helpMoneyTitle: { ru: 'Почему трафик — главное', en: 'Why bandwidth is the thing to watch' },
  helpMoneyText: { ru: 'В подписке выручка с человека фиксирована, а расходы растут вместе с просмотром. Самый лояльный зритель — самый дорогой. Это переворачивает привычную логику: здесь рост вовлечённости надо считать, а не праздновать.', en: 'In a subscription business revenue per person is fixed while cost grows with viewing. Your most loyal viewer is your most expensive one. That inverts the usual logic: here engagement growth is something to calculate, not to celebrate.' },
  helpChurnTitle: { ru: 'Обратные связи, которые вас погубят', en: 'The feedback loops that will kill you' },
  helpSpiralStale: { ru: '<b>Спираль скуки.</b> Нет премьер → растёт отток → падает выручка → режется контентный бюджет → премьер ещё меньше.', en: '<b>The staleness spiral.</b> No premieres → churn rises → revenue falls → the content budget is cut → even fewer premieres.' },
  helpSpiralHangover: { ru: '<b>Синдром сериала.</b> Громкая премьера приводит толпу, которая уходит, досмотрев её. Один хит без продолжения — это заём, а не рост.', en: '<b>The one-show syndrome.</b> A loud premiere brings a crowd that leaves once they have finished it. A single hit with nothing behind it is a loan, not growth.' },
  helpSpiralAds: { ru: '<b>Спираль рекламы.</b> Больше минут → больше выручки сейчас → выше отток → меньше зрителей → меньше показов.', en: '<b>The ad spiral.</b> More minutes → more revenue now → higher churn → fewer viewers → fewer impressions.' },
  helpSpiralTraffic: { ru: '<b>Ловушка вовлечённости.</b> Зритель смотрит больше → лоялен → но трафик дороже подписки, и рост часов съедает маржу.', en: '<b>The engagement trap.</b> Viewers watch more → they are loyal → but bandwidth outruns the subscription and rising hours eat the margin.' },

// ===== ../../shared/rng.js =========================================
// Детерминированный генератор псевдослучайных чисел (mulberry32).
// Нужен, чтобы одна и та же игра с одним и тем же seed воспроизводилась точно:
// это важно и для тестов, и для учебных сценариев («у всей группы одинаковый город»).

function hashSeed(str) {
  const s = String(str);
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}

function createRng(seed) {
  let a = typeof seed === 'number' ? seed >>> 0 : hashSeed(seed);
  const rng = () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.state = () => a >>> 0;
  rng.restore = (s) => { a = s >>> 0; };
  return rng;
}

// Случайное число из диапазона
function between(rng, min, max) {
  return min + rng() * (max - min);
}

// Выбор элемента с весами: items = [{weight, ...}]
function weightedPick(rng, items) {
  const total = items.reduce((s, i) => s + (i.weight ?? 1), 0);
  if (total <= 0) return null;
  let r = rng() * total;
  for (const item of items) {
    r -= item.weight ?? 1;
    if (r <= 0) return item;
  }
  return items[items.length - 1];
}

// ===== src/model/market.js =========================================
// ============================================================================
// Внешний фон месяца: сезон просмотра и афиша конкурента.
//
// Афиша больше не разыгрывается кубиком. Конкурент — живой (см. rival.js),
// у него есть свой производственный пайплайн, и на экране вы видите то, что
// у него действительно выходит. Анонс на следующий месяц честный: это проект,
// которому остался месяц до премьеры.
//
// Здесь остаётся только перевод «шума премьеры» в понятные игроку категории
// и общий сезонный фон, одинаковый для обеих сторон.
// ============================================================================

// pull — сила оттягивания внимания, 0 = ничего не происходит.
// Это не переток базы (он считается в rival.js), а борьба за внимание:
// в месяц чужой громкой премьеры хуже конвертируются новые и меньше смотрят все.
const RIVAL_RELEASES = {
  none:    { id: 'none',    icon: '·',  pull: 0,    acquisition: 1.00, churnAdd: 0,     hours: 1.00 },
  small:   { id: 'small',   icon: '▫',  pull: 0.25, acquisition: 0.94, churnAdd: 0.003, hours: 0.98 },
  notable: { id: 'notable', icon: '◆',  pull: 0.55, acquisition: 0.87, churnAdd: 0.009, hours: 0.96 },
  major:   { id: 'major',   icon: '★',  pull: 0.80, acquisition: 0.78, churnAdd: 0.017, hours: 0.93 },
  mega:    { id: 'mega',    icon: '★★', pull: 1.00, acquisition: 0.68, churnAdd: 0.028, hours: 0.89 },
};

// Месяц 1 — январь
function seasonOf(month) {
  const m = ((Math.max(1, month) - 1) % 12) + 1;
  if (m <= 2 || m === 12) return 'winter';
  if (m <= 5) return 'spring';
  if (m <= 8) return 'summer';
  return 'autumn';
}

// Зимой смотрят заметно больше, летом — заметно меньше. Это касается и вас,
// и конкурента: в высокий сезон и премьер больше, и борьба за внимание острее.
const SEASON = {
  winter: { hours: 1.18 },
  spring: { hours: 1.00 },
  summer: { hours: 0.84 },
  autumn: { hours: 1.06 },
};

function seasonHours(month) {
  return SEASON[seasonOf(month)].hours;
}

/** Во что превращается шум чужой премьеры на экране игрока. */
function classifyRelease(buzz) {
  if (!buzz || buzz <= 0.01) return 'none';
  if (buzz < 0.6) return 'small';
  if (buzz < 1.1) return 'notable';
  if (buzz < 1.9) return 'major';
  return 'mega';
}

/**
 * Итоговые множители месяца с учётом контрпрограммирования — вашего решения
 * ответить на чужую премьеру своей или, наоборот, не мешать ей.
 *
 * Собственная громкая премьера в тот же месяц частично гасит чужую: зритель
 * выбирает, а не уходит совсем.
 */
function rivalEffect(type, ownBuzz = 0) {
  const r = RIVAL_RELEASES[type] ?? RIVAL_RELEASES.none;
  // Свой релиз перебивает чужой тем сильнее, чем он громче
  const counter = Math.min(0.65, ownBuzz * 0.45);

  return {
    ...r,
    acquisitionMult: r.acquisition + (1 - r.acquisition) * counter,
    churnAdd: r.churnAdd * (1 - counter),
    hoursMult: r.hours + (1 - r.hours) * counter,
  };
}


// ===== src/model/rival.js ==========================================
// ============================================================================
// Живой конкурент.
//
// Раньше афиша конкурента разыгрывалась случайно, и он был константой
// в формуле. Из-за этого у игры существовала фиксированная оптимальная
// политика: среда не менялась, значит и решение не должно было меняться.
//
// Теперь у конкурента есть собственное состояние — касса, каталог, база
// подписчиков — и политика, которая читает ваши решения и отвечает на них.
// Рынок один на двоих: сумма ваших и его подписчиков ограничена ёмкостью
// сегментов, а часть базы каждый месяц перетекает от слабого к сильному.
//
// Следствие: оптимальной постоянной стратегии больше не существует. Ответ
// на вопрос «поднимать ли цену» зависит от того, что конкурент делает
// сейчас и что он может себе позволить дальше.
// ============================================================================


const genreOr = (id) => genreById(id) ?? GENRES[0];

// Позиции конкурента. Игрок видит их как понятные слова, а не как числа:
// смысл в том, чтобы можно было предсказать следующий ход.
const STANCES = {
  //         цена к вашей   бюджет   агрессия маркетинга
  build:   { priceRatio: 0.95, budget: 1.00, marketing: 1.00 }, // ровный рост
  war:     { priceRatio: 0.72, budget: 1.45, marketing: 1.60 }, // демпинг и трата кассы
  press:   { priceRatio: 1.06, budget: 1.15, marketing: 1.15 }, // давит, пока выигрывает
  harvest: { priceRatio: 1.18, budget: 0.55, marketing: 0.40 }, // снимает сливки, экономит
  retreat: { priceRatio: 1.10, budget: 0.30, marketing: 0.15 }, // выживает на остатках
};

function createRival(rng) {
  return {
    alive: true,
    cash: 5_200_000_000,
    raises: 0,
    maxRaises: 2,
    price: 449,
    adLoad: 5,
    stance: 'build',
    stanceMonths: 0,
    focus: 'blockbuster',
    catalogLicensed: 2_200,
    catalogOriginal: 0,
    freshHours: 220,
    pipeline: [],
    studioFund: 0,
    lastBuzz: 0,
    awareness: 0.30,
    spend: { licensing: 90_000_000, originals: 90_000_000, marketing: 70_000_000 },
    // Конкурент стартует с уже набранной базой: вы выходите на занятый рынок
    segments: Object.fromEntries(SEGMENTS.map((s) => [s.id, s.potential * 0.07])),
    // Что он анонсировал на следующий месяц (игроку это видно заранее)
    announced: null,
    exitMonthsLeft: 0,   // после банкротства база расходится не мгновенно
  };
}

function rivalSubs(rival) {
  return Object.values(rival.segments).reduce((s, v) => s + v, 0);
}

// ----------------------------------------------------------------------------
// Выбор позиции. Читается как логика живого менеджмента, а не как рулетка.
// ----------------------------------------------------------------------------
const STANCE_MIN_MONTHS = 4;

function chooseStance(rival, yourSubs, month) {
  const mine = rivalSubs(rival);
  const total = mine + yourSubs;
  const myShare = total > 0 ? mine / total : 0.5;
  const runwayMonths = rival.cash / Math.max(1, monthlyBurn(rival));

  if (!rival.alive) return 'retreat';
  // Деньги кончаются — не до войны, и это сильнее любого гистерезиса
  if (runwayMonths < 6 && rival.raises >= rival.maxRaises) return 'retreat';
  if (runwayMonths < 10) return 'harvest';

  // Позиция держится минимум несколько месяцев. Конкурент, меняющий стратегию
  // каждый месяц, — это шум; конкурент, который держит курс, — это противник,
  // к которому можно готовиться. Второе и интереснее, и правдоподобнее.
  if (rival.stanceMonths < STANCE_MIN_MONTHS && STANCES[rival.stance]) return rival.stance;

  if (myShare < 0.34 && month >= 6) return 'war';
  if (myShare < 0.46) return 'build';
  if (myShare > 0.66) return 'press';
  return 'build';
}

function monthlyBurn(rival) {
  return rival.spend.licensing + rival.spend.originals + rival.spend.marketing + 20_000_000;
}

// В какой жанр он идёт: туда, где вы сильнее всего. Контр-вход — самый
// частый ответ на чужой эксклюзив: если у вас работает драма, он снимает драму.
function chooseFocus(rival, yourOriginalsByGenre) {
  const entries = Object.entries(yourOriginalsByGenre ?? {});
  if (!entries.length) return rival.focus;
  const [best] = entries.sort((a, b) => b[1] - a[1]);
  // Пока у вас ничего нет, он делает то, что дешевле в пересчёте на шум
  if (!best || best[1] <= 0) return 'blockbuster';
  return best[0];
}

// ----------------------------------------------------------------------------
// Ход конкурента. Вызывается до расчёта рынка: игрок видит последствия
// решений конкурента в том же месяце, что и своих.
// ----------------------------------------------------------------------------
function stepRival(rival, ctx, rng) {
  const { yourPrice, yourSubs, yourOriginalsByGenre, month, licenseIndex, seasonMult } = ctx;

  if (!rival.alive) {
    // База обанкротившегося конкурента расходится по рынку несколько месяцев
    rival.exitMonthsLeft = Math.max(0, rival.exitMonthsLeft - 1);
    const drain = rival.exitMonthsLeft > 0 ? 0.34 : 1;
    for (const s of SEGMENTS) rival.segments[s.id] *= (1 - drain);
    rival.premieres = [];
    rival.buzz = 0;
    return rival;
  }

  const stance = chooseStance(rival, yourSubs, month);
  rival.stanceMonths = stance === rival.stance ? rival.stanceMonths + 1 : 0;
  rival.stance = stance;
  rival.stanceChangedIn = rival.stanceMonths === 0;
  const S = STANCES[stance];

  // --- Цена: движется к цели медленно, чтобы игрок успевал реагировать ---
  const targetPrice = clamp(yourPrice * S.priceRatio, 149, 899);
  rival.price = Math.round(clamp(
    rival.price + clamp(targetPrice - rival.price, -45, 45), 149, 899));
  rival.adLoad = clamp(stance === 'harvest' ? 9 : stance === 'war' ? 2 : 5, 0, 16);

  // --- Бюджеты: доля выручки плюс база, масштабированная позицией ---
  // Бюджет крупного игрока менее эластичен к выручке: согласования, легаси,
  // обязательства. Это и есть шанс маленького — он быстрее переставляет ноги.
  const revenue = rival.lastRevenue ?? 0;
  const base = 110_000_000 + revenue * 0.42;
  rival.spend = {
    licensing: Math.round(base * 0.5 * S.budget),
    originals: Math.round(base * 0.5 * S.budget),
    marketing: Math.round((55_000_000 + revenue * 0.26) * S.marketing),
  };

  // --- Раунд, если касса на исходе ---
  if (rival.cash < monthlyBurn(rival) * 4 && rival.raises < rival.maxRaises) {
    rival.cash += 3_000_000_000;
    rival.raises += 1;
    rival.justRaised = true;
  } else {
    rival.justRaised = false;
  }

  // --- Каталог ---
  // Тот же рубль даёт ему меньше часов: корпоративные накладные — реальная вещь
  const bought = rival.spend.licensing / (CONFIG.licenseCostPerHour * licenseIndex * 1.08);
  rival.catalogLicensed = rival.catalogLicensed * (1 - CONFIG.licenseDecay) + bought;

  rival.focus = chooseFocus(rival, yourOriginalsByGenre);
  const genre = genreOr(rival.focus);
  const projectCost = genre.hours * CONFIG.originalCostPerHour * genre.costPerHour;
  rival.studioFund += rival.spend.originals;
  const started = [];
  while (rival.studioFund >= projectCost && started.length < 3) {
    rival.studioFund -= projectCost;
    started.push({
      genre: genre.id,
      monthsLeft: CONFIG.originalLeadMonths,
      hours: genre.hours,
      quality: clamp(0.6 + 0.5 * rng(), 0.3, 1.3),
    });
  }
  rival.pipeline.push(...started);

  for (const p of rival.pipeline) p.monthsLeft -= 1;
  const premieres = rival.pipeline.filter((p) => p.monthsLeft <= 0);
  rival.pipeline = rival.pipeline.filter((p) => p.monthsLeft > 0);

  let fresh = 0;
  for (const p of premieres) {
    rival.catalogOriginal += p.hours;
    fresh += p.hours;
  }
  rival.freshHours = rival.freshHours * (1 - CONFIG.freshDecay)
    + fresh + bought * CONFIG.licenseFreshShare;

  rival.premieres = premieres.map((p) => ({
    genre: p.genre, hours: p.hours, quality: p.quality,
    buzz: genreOr(p.genre).buzz * p.quality,
  }));
  rival.buzz = rival.premieres.reduce((s, p) => s + p.buzz, 0);

  // --- Что он анонсирует на следующий месяц ---
  // Анонс честный: он выпустит именно то, что доедет до премьеры.
  const next = rival.pipeline.filter((p) => p.monthsLeft <= 1);
  rival.announced = next.length
    ? { buzz: next.reduce((s, p) => s + genreOr(p.genre).buzz * p.quality, 0), genre: next[0].genre }
    : null;

  // --- Узнаваемость и деньги ---
  rival.awareness = clamp(
    rival.awareness
    + (1 - rival.awareness) * clamp(rival.spend.marketing / 1_400_000_000, 0, 0.14)
    - rival.awareness * CONFIG.awarenessDecay
    + rival.buzz * 0.015,
    0.02, 0.9);

  const subs = rivalSubs(rival);
  const rivalRevenue = subs * (rival.price * 0.55 + rival.price * 0.37 * 0.45)
    + subs * 22 * seasonMult * rival.adLoad * 2 / 1000 * CONFIG.cpm * 0.45;
  const rivalCosts = monthlyBurn(rival) + subs * 22 * seasonMult * CONFIG.cdnCostPerHour * 0.9;
  rival.lastRevenue = rivalRevenue;
  rival.cash += rivalRevenue - rivalCosts;

  if (rival.cash < 0 && rival.raises >= rival.maxRaises) {
    rival.alive = false;
    rival.exitMonthsLeft = 3;
    rival.stance = 'retreat';
  }
  return rival;
}

// ----------------------------------------------------------------------------
// Сравнение двух сервисов глазами одного сегмента.
// Возвращает долю «голосов» за вас: 0.5 — паритет.
// ----------------------------------------------------------------------------
function segmentPreference(seg, you, rivalSide) {
  const pull = (side) => Math.max(1e-6,
    Math.pow(side.priceFactor, 0.9)
    * Math.pow(Math.max(0.05, side.appeal), 1.0)
    * side.adPenalty
    * Math.pow(Math.max(0.05, side.awareness), 0.35)
    // Эксклюзив — единственное, что конкурент не может купить теми же деньгами.
    // Лицензия лежит на обеих полках; своё — только на вашей.
    * (1 + CONFIG.exclusivePull * (side.exclusive ?? 0))
    * (1 + side.buzz * CONFIG.switchPremiereBoost));

  const a = Math.pow(pull(you), CONFIG.competeSharpness);
  const b = Math.pow(pull(rivalSide), CONFIG.competeSharpness);
  return a / (a + b);
}

/**
 * Переток базы между сервисами за месяц.
 * Возвращает «сколько человек этого сегмента перешло к вам» (может быть < 0).
 *
 * Лояльные сегменты переходят неохотно даже при явном перевесе — привычка
 * сильнее арифметики.
 */
function switchFlow(segDef, preference, yourSegSubs, rivalSegSubs) {
  const advantage = (preference - 0.5) * 2;               // ∈ [−1, 1]
  // loyalty здесь — множитель оттока: чем он выше, тем легче человек снимается
  // с места. Семьи почти не переходят, молодёжь уходит за первым же хайпом.
  const mobility = CONFIG.switchIntensity * segDef.loyalty;
  if (advantage >= 0) return rivalSegSubs * mobility * advantage;
  return -yourSegSubs * mobility * (-advantage);
}

// ============================================================================
// Совет директоров: цели на год и последствия их провала.
//
// Зачем это в модели. Одна цель на всю партию («максимизируйте оценку»)
// позволяет выбрать стратегию на первом ходу и больше к ней не возвращаться.
// Совет ставит цель на год, и цели устроены так, что тянут в разные стороны:
// первый год — рост базы, второй — доказать, что бизнес умеет быть прибыльным,
// третий — отобрать рынок у конкурента. Стратегия, выигрывающая первый год,
// проваливает второй.
//
// Цели известны заранее — они объявляются в первый месяц года. Это не рулетка,
// а планирование: вы знаете, к чему идёте, и решаете, чем ради этого жертвуете.
// ============================================================================


const GOAL_TYPES = {
  subscribers: 'subscribers',   // база на конец года
  profit: 'profit',             // сколько месяцев года закрыты в плюс
  share: 'share',               // доля рынка против конкурента
};

/**
 * Цель года. Считается от фактического состояния на начало года,
 * поэтому всегда остаётся вызовом и не превращается в формальность.
 */
function makeGoal(year, state, yourSubs, rivalSubs) {
  if (year === 1) {
    return {
      year,
      type: GOAL_TYPES.subscribers,
      target: 900_000,
      reward: 0.10,
      penalty: 'dilution',
    };
  }
  if (year === 2) {
    return {
      year,
      type: GOAL_TYPES.profit,
      // Не разово, а устойчиво: минимум 4 прибыльных месяца из 12
      target: 4,
      subsFloor: Math.round(Math.max(1_800_000, yourSubs * 1.5)),
      reward: 0.12,
      penalty: 'contentCap',
    };
  }
  const total = yourSubs + rivalSubs;
  return {
    year,
    type: GOAL_TYPES.share,
    target: 0.5,
    subsFloor: Math.round(Math.max(3_000_000, yourSubs * 1.35)),
    reward: 0.18,
    penalty: 'valuation',
    startShare: total > 0 ? yourSubs / total : 0.5,
  };
}

/** Текущий прогресс по цели — для отображения каждый месяц, а не только в конце. */
function goalProgress(goal, ctx) {
  if (!goal) return null;
  const { subs, rivalSubs, profitableMonths } = ctx;
  if (goal.type === GOAL_TYPES.subscribers) {
    return { value: subs, target: goal.target, done: subs >= goal.target };
  }
  if (goal.type === GOAL_TYPES.profit) {
    return {
      value: profitableMonths,
      target: goal.target,
      subs,
      subsFloor: goal.subsFloor,
      done: profitableMonths >= goal.target && subs >= goal.subsFloor,
    };
  }
  const total = subs + rivalSubs;
  const share = total > 0 ? subs / total : 0;
  return {
    value: share,
    target: goal.target,
    subs,
    subsFloor: goal.subsFloor,
    done: share >= goal.target && subs >= goal.subsFloor,
  };
}

/**
 * Применяет последствия. Провал не убивает партию — он делает следующий год
 * труднее, и именно это заставляет пересобирать стратегию, а не начинать заново.
 */
function applyGoalOutcome(state, goal, progress, month) {
  const passed = Boolean(progress?.done);
  const outcome = { year: goal.year, type: goal.type, passed, effect: null };

  if (passed) {
    state.flags.valuationBonus += goal.reward;
    outcome.effect = 'reward';
    return outcome;
  }

  if (goal.penalty === 'dilution') {
    // Совет вводит деньги сам — на своих условиях. Долю режет заметно.
    state.pendingDilution = 0.18;
    outcome.effect = 'dilution';
  } else if (goal.penalty === 'contentCap') {
    // Бюджет на контент режется на полгода: инвесторы больше не верят в «мы
    // всё вложим в рост». Это ломает стратегию, которая работала до сих пор.
    state.restrictions = {
      contentCap: 140_000_000,
      until: month + CONFIG.boardCapMonths,
    };
    state.flags.valuationBonus -= 0.10;
    outcome.effect = 'contentCap';
  } else {
    state.flags.valuationBonus -= 0.15;
    outcome.effect = 'valuation';
  }
  return outcome;
}

function crisisById(id) {
  return CRISES.find((c) => c.id === id) ?? null;
}

/**
 * Кризис приходит тем охотнее, чем крупнее и заметнее сервис.
 * Одновременно висит не больше одного: игра про управление, а не про пожар.
 */
function rollCrisis(rng, month, { subs, active }) {
  if (active) return null;
  const pool = CRISES.filter((c) => month >= c.minMonth);
  if (!pool.length) return null;

  // 2% при пустом сервисе, до ~14% при миллионах подписчиков
  const scale = clamp(subs / 3_000_000, 0, 1);
  const chance = 0.02 + 0.12 * scale;
  if (rng() > chance) return null;

  const total = pool.reduce((s, c) => s + c.weight, 0);
  let roll = rng() * total;
  for (const c of pool) {
    roll -= c.weight;
    if (roll <= 0) return { id: c.id, months: 0 };
  }
  return { id: pool[pool.length - 1].id, months: 0 };
}

// Кризис ухудшается не бесконечно: через MAX_ESCALATION месяцев он выходит
// на полку. Это не милосердие, а честность — дальше он просто дорого стоит
// каждый месяц, и решение всё равно остаётся за игроком.
const MAX_ESCALATION = 5;

const severityOf = (active) => clamp(Math.max(1, (active?.months ?? 0) + 1), 1, MAX_ESCALATION);

/** Эффекты активного кризиса на текущий месяц. */
function crisisEffects(active) {
  if (!active) return {};
  const def = crisisById(active.id);
  if (!def) return {};
  return def.escalate(severityOf(active));
}

/** Стоимость выбранного решения — зависит от того, сколько вы тянули. */
function resolutionCost(active, resolutionId) {
  const def = crisisById(active?.id);
  const res = def?.resolutions.find((r) => r.id === resolutionId);
  if (!res) return 0;
  return res.cost(severityOf(active));
}

function resolutionById(crisisId, resolutionId) {
  return crisisById(crisisId)?.resolutions.find((r) => r.id === resolutionId) ?? null;
}
