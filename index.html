  <style>

    .card p { margin: 0; line-height: 1.6; color: var(--text); }
    .card ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.7; font-size: 13px; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
    .card-actions a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid var(--line);

    .series-card:empty { display: none; }
    .series-card { margin-top: 26px; gap: 6px; }
    .series-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .series-head span { color: var(--muted); font-size: 12px; }
    .series-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }
    .series-name { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .series-bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
    .series-bar i { display: block; height: 100%; background: var(--accent); }
    .top-block { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px; }
    .top-list { list-style: none; margin: 2px 0 0; padding: 0; }
    .top-list li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home-foot { margin-top: 30px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .home-foot a { color: var(--accent-2); }
    .home-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    /* НОВОГРАД — финал серии: отдельный широкий блок под тремя играми */
    .eco-label { margin: 34px 0 12px; color: var(--muted); font-size: 12px;
      letter-spacing: 0.14em; text-transform: uppercase; }
    .eco-card { border-color: rgba(74, 222, 128, 0.4);
      background: linear-gradient(180deg, rgba(74, 222, 128, 0.06), var(--panel) 55%); }
    .eco-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .eco-head .card-icon { font-size: 30px; }
    @media (min-width: 720px) {
      .eco-card ul { columns: 2; column-gap: 32px; }
      .eco-card ul li { break-inside: avoid; }
      .eco-card .card-actions { max-width: 340px; }
    }
  </style>

    <!-- Уровень сложности стоит ПОСЛЕ всех четырёх игр. Раньше он разделял
         тройку и НОВОГРАД, и на первом экране до четвёртой игры дело просто

  <script>
    // Адрес сервера мировой таблицы — тот же, что у игр. Витрина показывает
    // с него только топ-3 (GET), ничего не отправляя.
    window.__lbEndpoint = 'https://script.google.com/macros/s/AKfycbz47A5KW2B9i_Jwfd-rfH3Z2pC9OjH08mGlOCXxc2-RXTxISDg9bNsDWgajYswVnLvPyA/exec';
  </script>
  <script type="module">
    // Витрина живёт по тем же правилам, что и игры: язык хранится в одном
    // ключе localStorage, поэтому выбор со стартовой страницы переносится внутрь.
    import { t, setLang, getLang, detectLang, setStrings } from './shared/i18n.js';
    import {
      legacyUnlocks, conglomerateUnlocked, seriesScorecard, resetEcosystemProgress,
    } from './shared/meta.js';
    import { lbTop, lbMine, lbLiveRank, lbEndpoint } from './shared/leaderboard.js';
    import { money } from './shared/format.js';
    import { taggedGame } from './shared/difficulty.js';

    // Мета-прогрессия на витрине: витрина — не список ссылок, а карта пути.
    // Финалы старых игр (локальные рекорды этого устройства) отмечаются
    // звёздами; достойный НОВОГРАД зажигает корону.
    // Мировая таблица прямо на витрине: три первых места и ваше, если оно
    // есть. Раньше таблица жила только за финальным экраном — то есть её
    // видел лишь тот, кто уже доиграл. Грузится лениво и молча: нет сервера
    // или нет сети — карточка просто остаётся без блока.
    function renderTops() {
      if (!lbEndpoint()) return;
      const ru = getLang() === 'ru';
      for (const [id, game] of Object.entries({
        food: 'НОВОЕДА', cinema: 'КИНОРЕКА', tickets: 'БИЛЕТВИЛЬ', eco: 'НОВОГРАД',
      })) {
        const node = document.getElementById(`${id}-top`);
        if (!node) continue;
        // Глубина 100 — не ради показа (видны три строки), а ради честного
        // «вашего места»: место, записанное при отправке, — снимок, и
        // «место 1» из пустой таблицы месяц спустя превращается в неправду.
        lbTop(taggedGame(game), 100).then((top) => {
          // Пустая таблица — не повод молчать: молчание читалось как «топы
          // сломались», а не «здесь ещё никто не играл».
          if (!top || !top.length) {
            node.innerHTML = `<div class="top-block"><b>${ru ? 'Мировая таблица' : 'World leaderboard'}</b> — ${
              ru ? 'пока пусто, сыграйте первым' : 'no runs yet, be the first'}</div>`;
            return;
          }
          // Счёт хранится в рублях (одна шкала на обе версии сайта), а
          // показывается в валюте языка — иначе финал игры и мировая
          // таблица говорили бы разными деньгами про одно число.
          const fmt = (n) => money(n);
          const rows = top.slice(0, 3).map((r, i) => `<li>${['🥇', '🥈', '🥉'][i]} ${
            String(r.name).replace(/[&<>]/g, '')} — ${fmt(r.score)}</li>`).join('');
          const mine = lbMine(taggedGame(game));
          const live = mine ? lbLiveRank(top, Number(mine.score)) : null;
          const mineRow = live
            ? `<li>${ru ? 'вы' : 'you'}: ${fmt(mine.score)} · ${ru ? 'место' : 'rank'} ${live.rank}${live.exact ? '' : '+'}</li>`
            : '';
          node.innerHTML = `<div class="top-block"><b>${ru ? 'Мировая таблица' : 'World leaderboard'}</b>
            <ol class="top-list">${rows}${mineRow}</ol></div>`;
        }).catch(() => { node.textContent = ''; });
      }
    }

    // Челленджа недели на витрине больше нет — карточка выбивалась из ряда
    // (сюда приходят выбрать игру, а не читать про соревнование). Сам
    // механизм жив и без неё: новая партия сама предлагает город недели,
    // а таблица недели ждёт вкладкой на финальном экране.

    // Путь серии: одна строка о том, где игрок на пути из четырёх игр.
    // Прогресс каждой игры нормирован её «крепким» финалом, поэтому 100% —
    // это «сыграно крепко всё», а не «набит рекорд в одной».
    function renderSeries() {
      const node = document.getElementById('series-card');
      if (!node) return;
      const ru = getLang() === 'ru';
      let sc;
      try { sc = seriesScorecard(); } catch { node.innerHTML = ''; return; }
      if (!sc.games.some((g) => g.score > 0)) { node.innerHTML = ''; return; }
      const cells = sc.games.map((g) => {
        const p = Math.round(Math.min(1, g.ratio) * 100);
        return `<div class="series-item">
          <div class="series-name">${g.done ? '★' : '☆'} ${g.tag}</div>
          <div class="series-bar"><i style="width:${p}%"></i></div>
        </div>`;
      }).join('');
      const done = sc.missing.length === 0;
      const tail = done
        ? (ru ? 'Весь путь пройден: серия сыграна целиком.' : 'You have walked the whole path: the series is complete.')
        : (ru ? `Не хватает: ${sc.missing.join(', ')}.` : `Missing: ${sc.missing.join(', ')}.`);
      node.innerHTML = `<div class="series-head">
          <b>${ru ? 'Путь серии' : 'The series path'}</b>
          <span>${Math.round(sc.share * 100)}% · ${sc.filled}/${sc.total}</span>
        </div>
        <div class="series-grid">${cells}</div>
        <p class="sub" style="margin-top:8px">${tail} ${ru
          ? 'Полоса — насколько близко вы к уверенной победе в игре; выше шкала не растёт.'
          : 'The bar shows how close you are to a confident win in that game; it does not grow beyond that.'}</p>
        <div class="card-actions" style="padding-top:4px">
          <a href="#" id="series-reset" style="flex:0 0 auto;padding:8px 14px;font-size:13px">${
            ru ? 'Начать путь заново' : 'Start the path over'}</a>
        </div>`;
      // Сброс пути: партии, строки и наследие. Таблицы рекордов
      // неприкосновенны — и личные, и мировая: сброс лишь ставит отметку
      // времени, старые записи перестают питать наследие (см. meta.js).
      document.getElementById('series-reset')?.addEventListener('click', (e) => {
        e.preventDefault();
        const ask = ru
          ? 'Начать путь заново? Стираются незаконченные партии, строки результатов и перенос наследия — серия встретит как в первый раз. Таблицы рекордов не трогаются: и личные в играх, и мировая на сервере останутся как есть.'
          : 'Start the path over? Unfinished games, result strings and the legacy transfer are wiped — the series greets you as on day one. High-score tables are untouched: both the personal ones in the games and the shared online table stay as they are.';
        if (!window.confirm(ask)) return;
        resetEcosystemProgress();
        render();
      });
    }

    function renderConglomeratePath() {
      const node = document.getElementById('eco-meta');
      if (!node) return;
      try {
        const u = legacyUnlocks();
        const star = (on) => (on ? '★' : '☆');
        const crown = conglomerateUnlocked() ? ' · 👑' : '';
        node.textContent = (getLang() === 'ru'
          ? `Путь конгломерата: ${star(u.delivery)} НОВОЕДА · ${star(u.streaming)} КИНОРЕКА · ${star(u.tickets)} БИЛЕТВИЛЬ${crown}`
          : `The conglomerate path: ${star(u.delivery)} NOVOEDA · ${star(u.streaming)} KINOREKA · ${star(u.tickets)} TICKETGRAD${crown}`);
      } catch { node.textContent = t('ecoMetaNone'); }
    }

    const STRINGS = {
      homeTitle: {
        ru: 'Новоград: бизнес-симуляторы',
        en: 'Novograd Business Simulators',
      },
      // Вопрос-крючок живёт в лиде, а не в H1: вывеска, которую видят при
      // каждом возвращении, не должна быть одноразовой шуткой.
      homeLead: {
        ru: 'Построите прибыльный бизнес? Город сомневается. Три игры про управление бизнесом и общий финал — экосистема, в которую вы приходите победителем любой из них. В каждой — десяток рычагов, спокойные пошаговые решения и понятная причина, по которой можно разориться. Модель считается честно: любую цифру на экране можно объяснить.',
        en: 'Can you build a profitable business? The city doubts it. Three games about running a business, plus a shared endgame — an ecosystem you enter as the winner of any of them. Each has a dozen levers, calm turn-by-turn decisions and a clear reason you can go bust. The model is computed honestly: every number on screen can be explained.',
      },
      foodTitle: { ru: 'НОВОЕДА', en: 'NOVOEDA' },
      foodSub: { ru: 'доставка еды · партия — меньше часа', en: 'food delivery · under an hour to play' },
      foodText: {
        ru: 'Вы запускаете сервис доставки: районы, цены, курьеры, рестораны, маркетинг. Курьеров не хватает — время доставки растёт, клиенты уходят. Курьеров много — платите за простой.',
        en: 'You launch a delivery service: districts, prices, couriers, restaurants, marketing. Too few couriers and delivery time rises and customers leave. Too many and you pay for idle time.',
      },
      foodList: {
        ru: 'Очередь и загрузка курьеров|Погода и сезонность|Динамическое ценообразование и персональные скидки|Юнит-экономика заказа',
        en: 'Queueing and courier utilisation|Weather and seasonality|Surge pricing and personal discounts|Unit economics of an order',
      },
      cinemaTitle: { ru: 'КИНОРЕКА', en: 'KINOREKA' },
      cinemaSub: { ru: 'онлайн-кинотеатр · партия — меньше часа', en: 'streaming service · under an hour to play' },
      cinemaText: {
        ru: 'Вы строите стриминг: два тарифа, закупка лицензий, собственная студия с полугодовым циклом производства, афиша конкурента и раунды инвестиций, которые размывают вашу долю.',
        en: 'You build a streaming service: two tiers, licence buying, an in-house studio with a six-month production cycle, the rival’s release calendar and funding rounds that dilute your stake.',
      },
      cinemaList: {
        ru: 'Аренда каталога против собственной библиотеки|Часы просмотра как расход, а не как успех|Чужие премьеры и контрпрограммирование|Рост базы против сохранения доли',
        en: 'Renting a catalogue versus owning a library|Watch hours as a cost, not a success|Rival premieres and counter-programming|Growing the base versus keeping your stake',
      },
      ticketsTitle: { ru: 'БИЛЕТВИЛЬ', en: 'TICKETGRAD' },

    };

      document.title = t('homeTitle');

      set('home-lead', t('homeLead'));

    // Service worker включается только на настоящем сайте: с file:// и в

      navigator.serviceWorker.register('sw.js').catch(() => {});
