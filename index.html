<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Ruben Deev" />
  <title>Учебные экономические симуляторы</title>
  <link rel="stylesheet" href="shared/styles.css" />
  <style>
    /* Витрина — единственная страница без игровой сетки, поэтому у неё
       свои несколько правил поверх общей темы. */
    .home { max-width: 980px; margin: 0 auto; padding: 40px 20px 60px; }
    .home h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: 0.02em; }
    .home .lead { color: var(--muted); max-width: 62ch; line-height: 1.6; margin: 0 0 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-icon { font-size: 34px; line-height: 1; }
    .card h2 { margin: 0; font-size: 18px; }
    .card .sub { color: var(--muted); font-size: 12px; margin: -6px 0 0; }
    .card p { margin: 0; line-height: 1.6; color: var(--text); }
    .card ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.7; font-size: 13px; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
    .card-actions a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--panel-2);
    }
    .card-actions a.primary { background: var(--accent); color: #06210f; border-color: transparent; }
    .top-block { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px; }
    .top-list { list-style: none; margin: 2px 0 0; padding: 0; }
    .top-list li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home-foot { margin-top: 30px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .home-foot a { color: var(--accent-2); }
    .home-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    /* НОВОГРАД — финал серии: отдельный широкий блок под тремя играми */
    .eco-label { margin: 34px 0 12px; color: var(--muted); font-size: 12px;
      letter-spacing: 0.14em; text-transform: uppercase; }
    .eco-card { border-color: rgba(74, 222, 128, 0.4);
      background: linear-gradient(180deg, rgba(74, 222, 128, 0.06), var(--panel) 55%); }
    .eco-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .eco-head .card-icon { font-size: 30px; align-self: center; }
    .eco-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #06210f;
      background: var(--accent); border-radius: 999px; padding: 3px 10px; text-transform: uppercase; }
    @media (min-width: 720px) {
      .eco-card ul { columns: 2; column-gap: 32px; }
      .eco-card ul li { break-inside: avoid; }
      .eco-card .card-actions { max-width: 340px; }
    }
  </style>
  <!-- Яндекс.Метрика. Считает только на сайте: этот блок живёт в странице-
       обёртке и в раздаваемый однофайловый HTML не попадает. Пока номер
       счётчика не задан (null) — не делает ничего. -->
  <script>
    window.__metrikaId = 111545020;
    if (window.__metrikaId) {
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
      ym(window.__metrikaId, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true });
    }
  </script>
</head>
<body>
  <noscript>
    <div class="nojs-hint" style="display:block">
      <div class="panel">
        <h2 class="panel-title">Скрипты не выполняются · Scripts are disabled</h2>
        <p class="funding-note">Витрина подписывает карточки скриптом, поэтому сейчас она пуста.
          Ссылки на игры работают и без него:</p>
        <p class="funding-note">
          <a href="games/foodtech/index.html">НОВОЕДА — доставка еды</a> ·
          <a href="games/cinema/index.html">КИНОРЕКА — онлайн-кинотеатр</a> ·
          <a href="games/tickets/index.html">БИЛЕТВИЛЬ — билетный сервис</a> ·
          <a href="games/ecosystem/index.html">НОВОГРАД — экосистема (бета)</a></p>
      </div>
    </div>
  </noscript>

  <main class="home">
    <div class="home-head">
      <div>
        <h1 id="home-title"></h1>
        <p class="lead" id="home-lead"></p>
      </div>
      <button id="btn-lang" class="btn ghost"></button>
    </div>

    <div class="cards">
      <section class="card">
        <div class="card-icon">🛵</div>
        <h2 id="food-title"></h2>
        <p class="sub" id="food-sub"></p>
        <p id="food-text"></p>
        <ul id="food-list"></ul>
        <div id="food-top"></div>
        <div class="card-actions">
          <a class="primary" href="games/foodtech/index.html" id="food-play"></a>
        </div>
      </section>

      <section class="card">
        <div class="card-icon">🎬</div>
        <h2 id="cinema-title"></h2>
        <p class="sub" id="cinema-sub"></p>
        <p id="cinema-text"></p>
        <ul id="cinema-list"></ul>
        <div id="cinema-top"></div>
        <div class="card-actions">
          <a class="primary" href="games/cinema/index.html" id="cinema-play"></a>
        </div>
      </section>

      <section class="card">
        <div class="card-icon">🎟️</div>
        <h2 id="tickets-title"></h2>
        <p class="sub" id="tickets-sub"></p>
        <p id="tickets-text"></p>
        <ul id="tickets-list"></ul>
        <div id="tickets-top"></div>
        <div class="card-actions">
          <a class="primary" href="games/tickets/index.html" id="tickets-play"></a>
        </div>
      </section>
    </div>

    <p class="eco-label" id="eco-label"></p>
    <section class="card eco-card">
      <div class="eco-head">
        <div class="card-icon">🏙️</div>
        <h2 id="eco-title"></h2>
        <span class="eco-badge" id="eco-badge"></span>
      </div>
      <p class="sub" id="eco-sub"></p>
      <p id="eco-text"></p>
      <ul id="eco-list"></ul>
      <div id="eco-top"></div>
      <p class="sub" id="eco-meta" style="margin-top:6px"></p>
      <div class="card-actions">
        <a class="primary" href="games/ecosystem/index.html" id="eco-play"></a>
      </div>
    </section>

    <p class="home-foot" id="home-foot"></p>
  </main>

  <script>
    // Адрес сервера мировой таблицы — тот же, что у игр. Витрина показывает
    // с него только топ-3 (GET), ничего не отправляя.
    window.__lbEndpoint = 'https://script.google.com/macros/s/AKfycbz47A5KW2B9i_Jwfd-rfH3Z2pC9OjH08mGlOCXxc2-RXTxISDg9bNsDWgajYswVnLvPyA/exec';
  </script>
  <script type="module">
    // Витрина живёт по тем же правилам, что и игры: язык хранится в одном
    // ключе localStorage, поэтому выбор со стартовой страницы переносится внутрь.
    import { t, setLang, getLang, detectLang, setStrings } from './shared/i18n.js';
    import { legacyUnlocks, conglomerateUnlocked } from './shared/meta.js';
    import { lbTop, lbMine, lbEndpoint } from './shared/leaderboard.js';

    // Мета-прогрессия на витрине: витрина — не список ссылок, а карта пути.
    // Финалы старых игр (локальные рекорды этого устройства) отмечаются
    // звёздами; достойный НОВОГРАД зажигает корону.
    // Мировая таблица прямо на витрине: три первых места и ваше, если оно
    // есть. Раньше таблица жила только за финальным экраном — то есть её
    // видел лишь тот, кто уже доиграл. Грузится лениво и молча: нет сервера
    // или нет сети — карточка просто остаётся без блока.
    function renderTops() {
      if (!lbEndpoint()) return;
      const ru = getLang() === 'ru';
      for (const [id, game] of Object.entries({
        food: 'НОВОЕДА', cinema: 'КИНОРЕКА', tickets: 'БИЛЕТВИЛЬ', eco: 'НОВОГРАД',
      })) {
        const node = document.getElementById(`${id}-top`);
        if (!node) continue;
        lbTop(game, 3).then((top) => {
          if (!top || !top.length) { node.textContent = ''; return; }
          const fmt = (n) => (n >= 1e9 ? `${(n / 1e9).toFixed(1)} ${ru ? 'млрд' : 'bn'}`
            : `${Math.round(n / 1e6)} ${ru ? 'млн' : 'M'}`);
          const rows = top.map((r, i) => `<li>${['🥇', '🥈', '🥉'][i]} ${
            String(r.name).replace(/[&<>]/g, '')} — ${fmt(r.score)}</li>`).join('');
          const mine = lbMine(game);
          const mineRow = mine
            ? `<li>${ru ? 'вы' : 'you'}: ${fmt(mine.score)} · ${ru ? 'место' : 'rank'} ${mine.rank}</li>`
            : '';
          node.innerHTML = `<div class="top-block"><b>${ru ? 'Мировая таблица' : 'World leaderboard'}</b>
            <ol class="top-list">${rows}${mineRow}</ol></div>`;
        }).catch(() => { node.textContent = ''; });
      }
    }

    function renderConglomeratePath() {
      const node = document.getElementById('eco-meta');
      if (!node) return;
      try {
        const u = legacyUnlocks();
        const star = (on) => (on ? '★' : '☆');
        const crown = conglomerateUnlocked() ? ' · 👑' : '';
        node.textContent = (getLang() === 'ru'
          ? `Путь конгломерата: ${star(u.delivery)} НОВОЕДА · ${star(u.streaming)} КИНОРЕКА · ${star(u.tickets)} БИЛЕТВИЛЬ${crown}`
          : `The conglomerate path: ${star(u.delivery)} NOVOEDA · ${star(u.streaming)} KINOREKA · ${star(u.tickets)} BILETVILLE${crown}`);
      } catch { node.textContent = t('ecoMetaNone'); }
    }

    const STRINGS = {
      homeTitle: {
        ru: 'Учебные экономические симуляторы',
        en: 'Economics simulators for the classroom',
      },
      homeLead: {
        ru: 'Три игры про управление бизнесом и общий финал — экосистема, в которую вы приходите победителем любой из них. Каждая игра — один ход в единицу времени, десяток рычагов и понятная причина, по которой можно разориться. Модель считается честно: любую цифру на экране можно объяснить.',
        en: 'Three games about running a business, plus a shared endgame — an ecosystem you enter as the winner of any of them. Each game is one turn per period, a dozen levers and a clear reason you can go bust. The model is computed honestly: every number on screen can be explained.',
      },
      foodTitle: { ru: 'НОВОЕДА', en: 'NOVOEDA' },
      foodSub: { ru: 'доставка еды в городе · ход = неделя · 52 недели', en: 'food delivery in a city · turn = week · 52 weeks' },
      foodText: {
        ru: 'Вы запускаете сервис доставки: районы, цены, курьеры, рестораны, маркетинг. Курьеров не хватает — время доставки растёт, клиенты уходят. Курьеров много — платите за простой.',
        en: 'You launch a delivery service: districts, prices, couriers, restaurants, marketing. Too few couriers and delivery time rises and customers leave. Too many and you pay for idle time.',
      },
      foodList: {
        ru: 'Очередь и загрузка курьеров|Погода и сезонность|Динамическое ценообразование и персональные скидки|Юнит-экономика заказа',
        en: 'Queueing and courier utilisation|Weather and seasonality|Surge pricing and personal discounts|Unit economics of an order',
      },
      cinemaTitle: { ru: 'КИНОРЕКА', en: 'KINOREKA' },
      cinemaSub: { ru: 'онлайн-кинотеатр · ход = месяц · 36 месяцев', en: 'streaming service · turn = month · 36 months' },
      cinemaText: {
        ru: 'Вы строите стриминг: два тарифа, закупка лицензий, собственная студия с полугодовым циклом производства, афиша конкурента и раунды инвестиций, которые размывают вашу долю.',
        en: 'You build a streaming service: two tiers, licence buying, an in-house studio with a six-month production cycle, the rival’s release calendar and funding rounds that dilute your stake.',
      },
      cinemaList: {
        ru: 'Аренда каталога против собственной библиотеки|Часы просмотра как расход, а не как успех|Чужие премьеры и контрпрограммирование|Рост базы против сохранения доли',
        en: 'Renting a catalogue versus owning a library|Watch hours as a cost, not a success|Rival premieres and counter-programming|Growing the base versus keeping your stake',
      },
      ticketsTitle: { ru: 'БИЛЕТВИЛЬ', en: 'BILETVILLE' },
      ticketsSub: { ru: '36 месяцев · двусторонний рынок · B2B и B2C', en: '36 months · two-sided market · B2B and B2C' },
      ticketsText: {
        ru: 'Вы управляете билетным оператором. С одной стороны организаторы дают афишу, с другой зрители покупают билеты. Ни одна сторона не приходит первой сама по себе.',
        en: 'You run a ticketing operator. Organisers provide the listings on one side, buyers buy tickets on the other. Neither side arrives first on its own.',
      },
      ticketsList: {
        ru: 'Одна выручка, две стороны: сбор с покупателя против комиссии с организатора|Конфликт каналов: билетный виджет удерживает клиента и уводит продажи|Оборот и выручка — разные числа, и эквайринг вычитается из второго|Доверие: перекупщики наполняют оборот и опустошают репутацию',
        en: 'One revenue, two sides: buyer fee versus organiser commission|Channel conflict: a ticketing widget keeps the client and takes the sales|Turnover and revenue are different numbers, and acquiring comes out of the second|Trust: resellers fill the turnover and empty the reputation',
      },
      ecoLabel: { ru: 'Финал серии', en: 'The series endgame' },
      ecoTitle: { ru: 'НОВОГРАД', en: 'NOVOGRAD' },
      ecoBadge: { ru: 'бета', en: 'beta' },
      ecoSub: { ru: 'экосистема сервисов · ход = месяц · 36 месяцев', en: 'a service ecosystem · turn = month · 36 months' },
      ecoText: {
        ru: 'Продолжение любой из трёх игр: ваш выигранный бизнес становится стартовым активом холдинга. Свой рынок он уже насытил — дальше рост не числом клиентов, а новыми сервисами для тех же людей: такси, е-ком, подписка «Плюс». Инвестор оценивает холдинг по сумме частей, и убыточная вертикаль без роста тянет оценку вниз.',
        en: 'The continuation of any of the three games: the business you won becomes the holding’s starting asset. It has already saturated its own market — growth now comes from new services for the same people: ride-hailing, e-commerce, the Plus subscription. Investors value the holding as a sum of parts, and a loss-making vertical with no growth drags the valuation down.',
      },
      ecoList: {
        ru: 'Стартовый актив задаёт форму экосистемы: доставка, стриминг или билеты|Кросс-селл по своей базе против дорогого холодного маркетинга|Подписка «Плюс»: платите маржой сейчас за удержание потом|Финалы трёх игр дают наследие на старте — а сильный финал НОВОГРАДА открывает памятные знаки в них',
        en: 'The starting asset shapes the ecosystem: delivery, streaming or ticketing|Cross-selling your own base versus expensive cold marketing|The Plus subscription: pay margin now for retention later|The three endgames grant a legacy at the start — and a strong NOVOGRAD finale unlocks keepsake badges back in them',
      },
      ecoMetaNone: {
        ru: 'Путь конгломерата: ☆ НОВОЕДА · ☆ КИНОРЕКА · ☆ БИЛЕТВИЛЬ. Финал каждой игры на этом устройстве зажигает звезду и даёт наследие на старте НОВОГРАДА.',
        en: 'The conglomerate path: ☆ NOVOEDA · ☆ KINOREKA · ☆ BILETVILLE. Finishing each game on this device lights a star and grants a legacy at the start of NOVOGRAD.',
      },
      play: { ru: 'Играть', en: 'Play' },
      foot: {
        ru: 'Игры работают в браузере, без установки. Разбор моделей и сценарии занятий: <a href="docs/foodtech/economics.md">доставка</a> · <a href="docs/cinema/economics.md">кинотеатр</a> · <a href="docs/tickets/economics.md">билеты</a>.<br>Автор — <b><a href="https://www.linkedin.com/in/ruben-deev" target="_blank" rel="noopener">Ruben Deev</a></b> · лицензия <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ru" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>: свободно для учёбы и некоммерческого использования с указанием автора.',
        en: 'The games run in a browser, nothing to install. Model write-ups and lesson plans: <a href="docs/foodtech/en/economics.md">delivery</a> · <a href="docs/cinema/en/economics.md">streaming</a> · <a href="docs/tickets/en/economics.md">ticketing</a>.<br>Made by <b><a href="https://www.linkedin.com/in/ruben-deev" target="_blank" rel="noopener">Ruben Deev</a></b> · licensed <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>: free for education and non-commercial use with attribution.',
      },
      langBtn: { ru: 'EN', en: 'RU' },
    };

    setStrings(STRINGS);
    setLang(detectLang());

    const set = (id, value) => { document.getElementById(id).innerHTML = value; };
    const list = (id, key) => {
      document.getElementById(id).innerHTML = t(key).split('|')
        .map((item) => `<li>${item}</li>`).join('');
    };

    function render() {
      document.documentElement.lang = getLang();
      document.title = t('homeTitle');
      set('home-title', t('homeTitle'));
      set('home-lead', t('homeLead'));

      set('food-title', t('foodTitle'));
      set('food-sub', t('foodSub'));
      set('food-text', t('foodText'));
      list('food-list', 'foodList');
      set('food-play', t('play'));

      set('cinema-title', t('cinemaTitle'));
      set('cinema-sub', t('cinemaSub'));
      set('cinema-text', t('cinemaText'));
      list('cinema-list', 'cinemaList');
      set('eco-label', t('ecoLabel'));
      set('eco-title', t('ecoTitle'));
      set('eco-badge', t('ecoBadge'));
      set('eco-sub', t('ecoSub'));
      set('eco-text', t('ecoText'));
      list('eco-list', 'ecoList');
      set('eco-play', t('play'));
      renderConglomeratePath();
      renderTops();

      set('tickets-title', t('ticketsTitle'));
      set('tickets-sub', t('ticketsSub'));
      set('tickets-text', t('ticketsText'));
      list('tickets-list', 'ticketsList');
      set('tickets-play', t('play'));
      set('cinema-play', t('play'));

      set('home-foot', t('foot'));
      set('btn-lang', t('langBtn'));
    }

    document.getElementById('btn-lang').addEventListener('click', () => {
      setLang(getLang() === 'ru' ? 'en' : 'ru');
      render();
    });

    render();
  </script>
</body>
</html>
